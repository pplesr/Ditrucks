        F('Hora descarga',e('input',{className:'inp',type:'time',value:cHora,onChange:ev=>setCHora(ev.target.value),disabled:!cFecha})),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:8}},

          e('button',{className:'btn',onClick:completar},'Guardar')

// ── EFICIENCIA ──
function Eficiencia(){
  const [tramos,setTramos]=useState([]);
  const [period,setPeriod]=useState('month');
  const [patFil,setPatFil]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const now=new Date();
  const fil=useMemo(()=>{
    const days={week:7,month:30,quarter:90,all:9999}[period];
    const cut=new Date(now-days*86400000);
    return tramos.filter(t=>new Date(t.fecha_carga||t.created_at)>=cut);
  },[tramos,period]);

  const byT=useMemo(()=>{
    const m={};
    fil.forEach(t=>{
      if(!t.patente)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',n:0,ing:0,cos:0,kmC:0,kmV:0,cosV:0,sinGuia:0};
      const {tarifa,costo,extras}=calcT(t);
      const p=m[t.patente];
      p.n++;p.ing+=tarifa+extras;p.cos+=costo+(t.costo_vacio||0);
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;p.cosV+=t.costo_vacio||0;
      if(!t.guia)p.sinGuia++;
    });
    return Object.values(m).sort((a,b)=>(b.ing-b.cos)-(a.ing-a.cos));
  },[fil]);

  const src=patFil==='todos'?byT:byT.filter(p=>p.pat===patFil);
  const tot=src.reduce((a,p)=>({n:a.n+p.n,ing:a.ing+p.ing,cos:a.cos+p.cos,kmC:a.kmC+p.kmC,kmV:a.kmV+p.kmV}),{n:0,ing:0,cos:0,kmC:0,kmV:0});
  const util=tot.ing-tot.cos;
  const pctV=tot.kmC+tot.kmV>0?Math.round(tot.kmV/(tot.kmC+tot.kmV)*100):0;

  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}},
      ...Object.entries({week:'7 días',month:'30 días',quarter:'90 días',all:'Todo'}).map(([v,l])=>
        e('button',{key:v,onClick:()=>setPeriod(v),style:{padding:'6px 14px',borderRadius:8,border:'1.5px solid',borderColor:period===v?'#0A1929':'#e2e8f0',background:period===v?'#0A1929':'white',color:period===v?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},l)
      )
    ),
    byT.length>1&&e('div',{style:{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}},
      ...['todos',...byT.map(p=>p.pat)].map(p=>
        e('button',{key:p,onClick:()=>setPatFil(p),style:{flexShrink:0,padding:'4px 10px',borderRadius:8,border:'1.5px solid',borderColor:patFil===p?'#0A1929':'#e2e8f0',background:patFil===p?'#0A1929':'white',color:patFil===p?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},p==='todos'?'Todos':p)
      )
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
      ...[[`🚛 Tramos`,tot.n],[`💵 Ingresos`,fCLP(tot.ing)],[`📈 Utilidad`,fCLP(util)],[`🛣️ Km vacíos`,tot.kmV.toLocaleString()+'  ('+pctV+'%)']].map(([l,v])=>
        e('div',{key:l,className:'card',style:{padding:14}},
          e('div',{style:{fontSize:'.8rem',color:'#64748b',marginBottom:4}},l),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem'}},v)
        )
      )
    ),
    tot.kmC+tot.kmV>0&&e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'#64748b',marginBottom:6}},
        e('span',null,'📍 '+tot.kmC.toLocaleString()+' km cargado'),
        e('span',null,'🛣️ '+tot.kmV.toLocaleString()+' km vacío')
      ),
      e('div',{style:{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}},
        tot.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
        tot.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
      ),
      e('div',{style:{textAlign:'center',fontSize:'.75rem',color:'#94a3b8',marginTop:4}},'Eficiencia: '+(100-pctV)+'% cargado')
    ),
    src.length===0?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'📊 Sin datos para el período')
    :src.map(p=>{
      const u=p.ing-p.cos;
      const pv=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
      return e('div',{key:p.pat,className:'card',style:{marginBottom:10}},
        e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:10}},
          e('div',null,e('div',{style:{fontFamily:'monospace',fontWeight:700}},p.pat),e('div',{style:{fontSize:'.82rem',color:'#64748b'}},'👤 '+p.cond)),
          e('div',{style:{textAlign:'right'}},e('div',{style:{fontFamily:'monospace',fontWeight:700,color:u>=0?'#059669':'#dc2626'}},fCLP(u)),e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},p.n+' tramo'+(p.n!==1?'s':'')))
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}},
          ...[[`Ingresos`,fCLP(p.ing),'#f0fdf4','#166534'],['Costos',fCLP(p.cos),'#fef2f2','#991b1b'],['Km vacío',p.kmV.toLocaleString(),'#f5f3ff','#5b21b6']].map(([l,v,bg,col])=>
            e('div',{key:l,style:{background:bg,borderRadius:8,padding:8,textAlign:'center'}},
              e('div',{style:{fontSize:'.72rem',color:col,marginBottom:2}},l),
              e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}},v)
            )
          )
        ),
        e('div',{style:{display:'flex',height:6,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginBottom:4}},
          p.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pv)+'%'}}),
          p.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pv+'%'}})
        ),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'#94a3b8'}},
          e('span',null,p.kmC.toLocaleString()+' km cargado'),e('span',null,pv+'% vacío')
        ),
        p.sinGuia>0&&e('div',{style:{marginTop:8,fontSize:'.78rem',background:'#fffbeb',color:'#92400e',borderRadius:6,padding:'6px 10px'}},'⚠️ '+p.sinGuia+' tramo'+(p.sinGuia!==1?'s':'')+' sin guía')
      );
    })
  );
}

// ── APP ──
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('nuevo');
  const [tramos,setTramos]=useState([]);
  const isOwner=user?.rol==='owner';
  useEffect(()=>{if(user)api.get().then(setTramos);},[user]);
  if(!user)return e(Login,{onLogin:u=>{setUser(u);setTab('nuevo');}});
  const tabs=[{id:'nuevo',l:'➕ Nuevo tramo'},{id:'lista',l:'📋 Tramos'},...(isOwner?[{id:'eficiencia',l:'📊 Eficiencia'}]:[])];
  return e('div',{style:{minHeight:'100vh',background:'#F0F4F8'}},
    e('header',{style:{background:'white',borderBottom:'1px solid #e2e8f0',position:'sticky',top:0,zIndex:40}},
      e('div',{style:{maxWidth:640,margin:'0 auto',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('span',{style:{fontSize:20}},'🚛'),
          e('span',{style:{fontWeight:700,fontSize:'1.1rem',background:'linear-gradient(135deg,#00BCD4,#0097A7)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'DITrucks · Tramos')
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('span',{style:{fontSize:'.85rem',color:'#64748b'}},user.nombre),
          e('button',{onClick:()=>setUser(null),style:{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},'Salir')
        )
      ),
      e('div',{style:{maxWidth:640,margin:'0 auto',padding:'0 16px',display:'flex',gap:2}},
        ...tabs.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{padding:'10px 14px',border:'none',background:'transparent',borderBottom:'2px solid '+(tab===t.id?'#00BCD4':'transparent'),color:tab===t.id?'#0097A7':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',transition:'all .15s',fontFamily:'Geist,sans-serif'}},t.l))
      )
    ),
    e('main',{style:{maxWidth:640,margin:'0 auto',padding:'20px 16px'}},
      tab==='nuevo'&&e(NuevoTramo,{user,tramos,onSaved:()=>{api.get().then(setTramos);setTab('lista');}}),
      tab==='lista'&&e(ListaTramos,{user,isOwner}),
      tab==='eficiencia'&&isOwner&&e(Eficiencia)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
