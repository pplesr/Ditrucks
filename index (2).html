.dark-panel{background:linear-gradient(135deg,#0A1929,#1E293B);color:white;border-radius:16px;padding:1.5rem}
@keyframes si{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.lbl{display:block;font-size:.82rem;font-weight:600;color:#475569;margin-bottom:5px}
.f-vencida{border-left:4px solid #ef4444;background:#fff5f5}

const addDays=(d,n)=>{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];};
const getVenc=(f)=>addDays(f.fecha_factura,f.plazo||30);
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/(1000*86400));
const getEstadoFact=(f)=>{if(f.pagada)return'pagada';const d=diffDays(getVenc(f),today());if(d<0)return'vencida';if(d<=7)return'proxima';return'vigente';};
const getDias=(f)=>{if(f.pagada)return null;return diffDays(getVenc(f),today());};

const cls=()=>[...new Set(RT.map(r=>r.cl))].sort();

const des=(cl,or)=>[...new Set(RT.filter(r=>r.cl===cl&&r.or===or).map(r=>r.de))].sort();
const haversine=(a,b)=>{const R=6371,rad=d=>d*Math.PI/180,dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]),x=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.3);};

// Índice de búsqueda rápida: "OR|DE" → entry
const DIST_IDX=(()=>{const m={};DIST.forEach(r=>{m[r.or+'|'+r.de]=r;});return m;})();

// ── COSTO POR KM VACÍO (regla 2: georreferencia) ──
const COSTO_KM_VACIO=785;

// ── ZONAS EQUIVALENTES: misma zona = 0 km vacíos ──
// Solo ciudades en el mismo punto físico (< 15 km). Ciudades distintas calculan su propio vacío.
const ZONAS_EQUIV=[];
const mismaZona=(a,b)=>{
  if(!a||!b)return false;
  const au=a.toUpperCase(),bu=b.toUpperCase();
  if(au===bu)return true;
  return ZONAS_EQUIV.some(z=>z.includes(au)&&z.includes(bu));
};

// ── CÁLCULO KM VACÍOS ──
// Regla 1: buscar en DIST (tabla Excel) directo o inverso → usar KMS y Gasto_Tramo real
// Regla 2: si no existe → Haversine (georreferencia) × $785/km
const kmV=(a,b)=>{
  if(!a||!b)return{km:0,costo:0,fuente:'zona'};
  const au=a.toUpperCase().trim(),bu=b.toUpperCase().trim();
  // Misma ciudad o misma zona → 0
  if(mismaZona(au,bu))return{km:0,costo:0,fuente:'zona'};

  // REGLA 1: buscar en tabla de distancias (directo o inverso)
  const dir=DIST_IDX[au+'|'+bu];
  if(dir)return{km:dir.km,costo:dir.c,fuente:'tabla'};
  const inv=DIST_IDX[bu+'|'+au];
  if(inv)return{km:inv.km,costo:inv.c,fuente:'tabla'};

  // REGLA 2: georreferencia Haversine × $785
  const ca=CC[au]||CC[a],cb=CC[bu]||CC[b];
  if(!ca||!cb)return{km:0,costo:0,fuente:'sin_coords'};
  const km=haversine(ca,cb);
  return{km,costo:Math.round(km*COSTO_KM_VACIO),fuente:'geo'};
};

const calcT=(t)=>{const r=findR(t.cliente,t.origen,t.destino);const tarifa=r?(r.ton?(Number(t.toneladas)||0)*r.ton:r.t):0;const costoVacio=Number(t.costo_vacio||0);const costo=(r?r.c:0)+costoVacio+(t.encarpe?Number(t.encarpe_monto||0):0)+(t.lavado?Number(t.lavado_monto||0):0);const extras=(t.estadia?Number(t.estadia_monto||0):0)+(t.rechazada?Number(t.rechazada_monto||0):0);return{tarifa,costo,costoVacio,extras,util:tarifa+extras-costo,km:r?r.k:0};};

// ── DROPDOWN ──
function DD({label,opts,val,onChange,ph,disabled,req}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState('');
  const ref=useRef(null);
  useEffect(()=>{
    const fn=ev=>{if(ref.current&&!ref.current.contains(ev.target)){setOpen(false);setQ('');}};
    document.addEventListener('mousedown',fn);
    return()=>document.removeEventListener('mousedown',fn);
  },[]);
  const fil=q?opts.filter(o=>o.toLowerCase().startsWith(q.toLowerCase())):opts;
  return e('div',{className:'dd-wrap',ref},
    label&&e('label',{className:'lbl'},label,req&&e('span',{style:{color:'red'}},' *')),
    e('div',{className:'inp',style:{display:'flex',alignItems:'center',justifyContent:'space-between',cursor:disabled?'not-allowed':'pointer',opacity:disabled?.6:1,minHeight:44,userSelect:'none'},

  const [f,setF]=useState(ef());
  const [saving,setSaving]=useState(false);
  const [ok,setOk]=useState(false);
  const [errMsg,setErrMsg]=useState('');
  const s=ch=>setF(p=>({...p,...ch}));
  const route=findR(f.cliente,f.origen,f.destino);
  const {tarifa,costo,extras,util}=calcT(f);
  const truck=TRUCKS.find(t=>t.p===f.patente);
  const prevT=useMemo(()=>{
    if(!f.patente)return null;
    // Incluir tramos del mismo día (<=) y ordenar por fecha + created_at desc
    // Excluir el tramo actual si estamos editando (no aplica en NuevoTramo, pero por seguridad)
    return tramos
      .filter(t=>t.patente===f.patente&&(t.fecha_carga||'')<=(f.fecha_carga||'9999'))
      .sort((a,b)=>(b.fecha_carga||'').localeCompare(a.fecha_carga||'')||b.created_at-a.created_at)[0]||null;
  },[f.patente,f.fecha_carga,tramos]);
  // FIX: usar mismaZona para detectar 0 km vacíos
  const vacio=useMemo(()=>{
    if(!prevT||!f.origen)return null;
    const prevRoute=findR(prevT.cliente,prevT.origen,prevT.destino);
    const prevCity=prevRoute?.dc||prevT.destino;
    const nextRoute=findR(f.cliente,f.origen,f.destino);
    const nextCity=nextRoute?.oc||f.origen;
    if(mismaZona(prevCity,nextCity))return null;

    if(!f.patente||!f.cliente||!f.origen||!f.destino){alert('Completa Camión, Cliente, Origen y Destino');return;}

      vacio&&vacio.km>0&&e('div',{style:{marginTop:10,padding:'10px 12px',background:'#f5f3ff',border:'1.5px solid #ddd6fe',borderRadius:10,fontSize:'.85rem',color:'#5b21b6'}},

// ── LISTA TRAMOS ──
function ListaTramos({user,isOwner}){
  const [data,setData]=useState([]);
  const [q,setQ]=useState('');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [sel,setSel]=useState(null);
  const [loading,setLoading]=useState(true);
  const [comp,setComp]=useState(null);
  const [cGuia,setCGuia]=useState('');
  const [cFecha,setCFecha]=useState('');
  const [cHora,setCHora]=useState('');
  const [cTon,setCTon]=useState('');
  const [cEncarpe,setCEncarpe]=useState(false);
  const [cEncarpeM,setCEncarpeM]=useState('');
  const [cLavado,setCLavado]=useState(false);
  const [cLavadoM,setCLavadoM]=useState('');
  const [cEstadia,setCEstadia]=useState(false);
  const [cEstadiaM,setCEstadiaM]=useState('');
  const [cRechazada,setCRechazada]=useState(false);
  const [cRechazadaM,setCRechazadaM]=useState('');
  const load=async()=>{setLoading(true);const d=await api.get();setData(d);setLoading(false);};
  useEffect(()=>{load();},[]);
  const fil=useMemo(()=>{
    const sq=q.toLowerCase();
    return data.filter(t=>{
      if(sq&&![t.cliente,t.origen,t.destino,t.patente,t.guia,t.creado_por].some(v=>(v||'').toLowerCase().includes(sq)))return false;
      if(filtDesde&&(t.fecha_carga||'')<filtDesde)return false;
      if(filtHasta&&(t.fecha_carga||'')>filtHasta)return false;
      return true;
    });
  },[data,q,filtDesde,filtHasta]);
  const del=async(id)=>{
    if(!confirm('¿Eliminar este tramo?'))return;
    const tramoBorrado=data.find(t=>t.id===id);
    await api.del(id);
    if(tramoBorrado&&tramoBorrado.patente){
      const restantes=data
        .filter(t=>t.id!==id&&t.patente===tramoBorrado.patente)
        .sort((a,b)=>(a.fecha_carga||'').localeCompare(b.fecha_carga||'')||a.created_at-b.created_at);
      const sigIdx=restantes.findIndex(t=>
        (t.fecha_carga||'')>(tramoBorrado.fecha_carga||'')||
        ((t.fecha_carga||'')===(tramoBorrado.fecha_carga||'')&&t.created_at>tramoBorrado.created_at)
      );
      if(sigIdx>=0){
        const sig=restantes[sigIdx];
        const prevDelSig=sigIdx>0?restantes[sigIdx-1]:null;
        let nuevoKmVacio=0,nuevoCostoVacio=0,nuevaCiudad='';
        // FIX: usar mismaZona
        if(prevDelSig&&prevDelSig.destino&&sig.origen){
          const prR=findR(prevDelSig.cliente,prevDelSig.origen,prevDelSig.destino);
          const pc=prR?.dc||prevDelSig.destino;
          const nxR=findR(sig.cliente,sig.origen,sig.destino);
          const nc2=nxR?.oc||sig.origen;
          if(!mismaZona(pc,nc2)){
            const v=kmV(pc,nc2);
            nuevoKmVacio=v.km;nuevoCostoVacio=v.costo;nuevaCiudad=pc;
          }
        }
        await api.patch(sig.id,{km_vacio:nuevoKmVacio,costo_vacio:nuevoCostoVacio,ciudad_vacio_desde:nuevaCiudad});
      }
    }
    load();
  };
  const completar=async()=>{
    await api.patch(comp.id,{
      guia:cGuia,fecha_desc:cFecha,hora_desc:cHora,
      toneladas:cTon||comp.toneladas,
      encarpe:cEncarpe,encarpe_monto:cEncarpeM,
      lavado:cLavado,lavado_monto:cLavadoM,
      estadia:cEstadia,estadia_monto:cEstadiaM,
      rechazada:cRechazada,rechazada_monto:cRechazadaM,
    });
    setComp(null);load();
  };
  const est=(t)=>{
    if(t.guia&&t.fecha_desc)return{l:'Completo',bg:'#d1fae5',col:'#065f46',ic:'✅'};
    if(!t.guia)return{l:'Sin guía',bg:'#fee2e2',col:'#991b1b',ic:'⚠️'};
    return{l:'Sin descarga',bg:'#fef3c7',col:'#92400e',ic:'⏳'};
  };
  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=data.map(t=>{
      const {tarifa,costo,extras,util,km}=calcT(t);
      const truck=TRUCKS.find(x=>x.p===t.patente);
      const dias=t.fecha_carga&&t.fecha_desc?Math.round((new Date(t.fecha_desc)-new Date(t.fecha_carga))/86400000):'';
      const r=findR(t.cliente,t.origen,t.destino);
      return{'Patente':t.patente,'Conductor':truck?.c||'','Cliente':t.cliente,'Origen':t.origen,'Destino':t.destino,'Fecha Carga':t.fecha_carga,'Hora Carga':t.hora_carga,'Fecha Descarga':t.fecha_desc||'Pendiente','Días Tránsito':dias,'Guía':t.guia||'Pendiente','Toneladas':r&&r.ton?(t.toneladas||''):'-','Km Cargado':km,'Km Vacío':t.km_vacio||0,'Ciudad Vacío Desde':t.ciudad_vacio_desde||'','Tarifa':Math.round(tarifa),'Costo':Math.round(costo),'Extras':Math.round(extras),'Utilidad':Math.round(util),'Costo Km Vacío':t.costo_vacio||0,'Estado':t.guia&&t.fecha_desc?'Completo':!t.guia?'Sin guía':'Sin descarga','Creado por':t.creado_por||''};
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Tramos');
    XLSX.writeFile(wb,'DITrucks_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };
  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    comp&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},
      e('div',{className:'card si',style:{width:'100%',maxWidth:440,maxHeight:'90vh',overflowY:'auto'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          e('strong',null,comp.guia&&comp.fecha_desc?'✏️ Editar tramo':'Completar tramo'),
          e('button',{onClick:()=>setComp(null),style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#94a3b8'}},'×')
        ),
        e('div',{style:{fontSize:'.85rem',color:'#64748b',marginBottom:12}},comp.cliente+' · '+comp.origen+' → '+comp.destino),
        F('N° Guía',e('input',{className:'inp',type:'text',value:cGuia,onChange:ev=>setCGuia(ev.target.value),placeholder:'Número de guía'})),
        (()=>{const r=findR(comp.cliente,comp.origen,comp.destino);return r&&r.ton?e('div',null,
          e('label',{className:'lbl'},'Toneladas cargadas ',e('span',{style:{color:'#00BCD4'}},'('+r.ton+' $/ton)')),
          e('input',{className:'inp',type:'number',min:0,value:cTon,onChange:ev=>setCTon(ev.target.value),placeholder:'Ej: 28'}),
          cTon&&e('div',{style:{marginTop:4,fontSize:'.82rem',color:'#059669',fontWeight:600}},'Tarifa: $'+(Math.round(Number(cTon)*r.ton)).toLocaleString('es-CL'))
        ):null;})(),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
          F('Fecha descarga',e('input',{className:'inp',type:'date',value:cFecha,onChange:ev=>setCFecha(ev.target.value)})),
          F('Hora descarga',e('input',{className:'inp',type:'time',value:cHora,onChange:ev=>setCHora(ev.target.value),disabled:!cFecha}))
        ),
        e('div',{style:{borderTop:'1px solid #f1f5f9',marginTop:12,paddingTop:12}},
          e('div',{style:{fontSize:'.82rem',fontWeight:600,color:'#475569',marginBottom:8}},'➕ Cargos adicionales'),
          ...[
            ['encarpe','🔧 Encarpe',cEncarpe,setCEncarpe,cEncarpeM,setCEncarpeM],
            ['lavado','🚿 Lavado',cLavado,setCLavado,cLavadoM,setCLavadoM],
            ['estadia','🏨 Estadía',cEstadia,setCEstadia,cEstadiaM,setCEstadiaM],
            ['rechazada','📦 Rechazada',cRechazada,setCRechazada,cRechazadaM,setCRechazadaM],
          ].map(([k,l,val,setVal,monto,setMonto])=>
            e('div',{key:k,style:{marginBottom:6,padding:'8px 10px',borderRadius:8,border:'1.5px solid',borderColor:val?'#a5f3fc':'#f1f5f9',background:val?'#e0f7fa':'#f8fafc'}},
              e('label',{style:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:'.85rem',fontWeight:500}},
                e('input',{type:'checkbox',checked:val,onChange:ev=>setVal(ev.target.checked),style:{width:15,height:15,accentColor:'#00BCD4'}}),l
              ),
              val&&e('input',{className:'inp',type:'number',placeholder:'Monto (+ cargo / - descuento)',value:monto,onChange:ev=>setMonto(ev.target.value),style:{marginTop:6,fontSize:'.85rem'}})
            )
          )
        ),

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}},
          e('button',{onClick:()=>setComp(null),style:{padding:'.75rem',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',cursor:'pointer',fontWeight:500,fontFamily:'Geist,sans-serif'}},'Cancelar'),
          e('button',{className:'btn',onClick:completar},'Guardar')
        )
      )
    ),
    e('div',{style:{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap'}},
      e('input',{className:'inp',style:{flex:'1 1 200px'},placeholder:'🔍 Buscar…',value:q,onChange:ev=>setQ(ev.target.value)}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtDesde||'',onChange:ev=>setFiltDesde(ev.target.value),title:'Desde'}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtHasta||'',onChange:ev=>setFiltHasta(ev.target.value),title:'Hasta'}),
      e('button',{onClick:exportExcel,style:{padding:'.7rem 1rem',background:'#16a34a',color:'white',border:'none',borderRadius:10,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',fontSize:'.88rem',fontFamily:'Geist,sans-serif'}},'📥 Excel'),
      isOwner&&e('button',{onClick:async()=>{
        if(!confirm('¿Recalcular km vacíos de TODOS los tramos?'))return;
        const todos=await api.get();
        const porPat={};
        todos.forEach(t=>{
          if(!t.patente)return;
          if(!porPat[t.patente])porPat[t.patente]=[];
          porPat[t.patente].push(t);
        });
        let actualizados=0;
        for(const pat of Object.keys(porPat)){
          const tramosOrden=porPat[pat].sort((a,b)=>{
            const fa=a.fecha_carga||'',fb=b.fecha_carga||'';
            if(fa!==fb)return fa.localeCompare(fb);
            return (a.created_at||0)-(b.created_at||0);
          });
          for(let i=0;i<tramosOrden.length;i++){
            const t=tramosOrden[i];
            const prev=i>0?tramosOrden[i-1]:null;
            let nuevoKm=0,nuevoCosto=0,nuevaCiudad='';
            // FIX: usar mismaZona
            if(prev&&prev.destino&&t.origen){
            const prR2=findR(prev.cliente,prev.origen,prev.destino);
            const pc=prR2?.dc||prev.destino;
            const nxR2=findR(t.cliente,t.origen,t.destino);
            const nc2=nxR2?.oc||t.origen;
            if(!mismaZona(pc,nc2)){
                const v=kmV(pc,nc2);
              nuevoKm=v.km;nuevoCosto=v.costo;nuevaCiudad=pc;
            }
          }
            await api.patch(t.id,{km_vacio:nuevoKm,costo_vacio:nuevoCosto,ciudad_vacio_desde:nuevaCiudad});
            actualizados++;
          }
        }
        alert('✅ Recálculo completado. '+actualizados+' tramos actualizados.');
        load();
      },style:{padding:'.7rem 1rem',background:'#7c3aed',color:'white',border:'none',borderRadius:10,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',fontSize:'.88rem',fontFamily:'Geist,sans-serif'}},'🔄 Recalcular km vacíos')
    ),
    fil.length>0&&(()=>{
      const tots=fil.reduce((a,t)=>{const r=findR(t.cliente,t.origen,t.destino);return{n:a.n+1,km:a.km+(r?.k||0),kmV:a.kmV+(t.km_vacio||0)};},{n:0,km:0,kmV:0});
      return e('div',{style:{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}},
        e('div',{style:{background:'#f1f5f9',borderRadius:8,padding:'8px 14px',fontSize:'.85rem',color:'#475569',fontWeight:600}},'📦 ',e('strong',null,tots.n),' tramos'),
        e('div',{style:{background:'#dbeafe',borderRadius:8,padding:'8px 14px',fontSize:'.85rem',color:'#1e40af',fontWeight:600}},'📍 ',e('strong',null,tots.km.toLocaleString()),' km cargado'),
        e('div',{style:{background:'#ede9fe',borderRadius:8,padding:'8px 14px',fontSize:'.85rem',color:'#5b21b6',fontWeight:600}},'🛣️ ',e('strong',null,tots.kmV.toLocaleString()),' km vacío')
      );
    })(),
    loading?e('div',{style:{textAlign:'center',padding:40,color:'#94a3b8'}},'Cargando…')
    :fil.length===0?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},e('div',{style:{fontSize:40}},'🚛'),e('div',null,'Sin tramos'))
    :fil.map(t=>{
      const {tarifa,costo,extras,util,km}=calcT(t);
      const es=est(t);
      const open=sel===t.id;
      const dias=t.fecha_carga&&t.fecha_desc?Math.round((new Date(t.fecha_desc)-new Date(t.fecha_carga))/86400000):null;
      return e('div',{key:t.id,className:'card',style:{marginBottom:10,cursor:'pointer'},onClick:()=>setSel(open?null:t.id)},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
          e('div',{style:{flex:1,minWidth:0}},
            e('div',{style:{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4}},
              e('span',{style:{display:'inline-flex',alignItems:'center',padding:'2px 8px',borderRadius:99,fontSize:'.72rem',fontWeight:700,background:es.bg,color:es.col}},es.ic+' '+es.l),
              t.patente&&e('span',{style:{fontSize:'.75rem',background:'#f1f5f9',color:'#475569',padding:'2px 6px',borderRadius:4,fontFamily:'monospace'}},t.patente),
              (t.km_vacio||0)>0&&e('span',{style:{fontSize:'.72rem',background:'#ede9fe',color:'#5b21b6',padding:'2px 6px',borderRadius:99,fontWeight:700}},'🛣️ '+t.km_vacio+' km vacíos')
            ),
            e('div',{style:{fontWeight:600,fontSize:'.92rem'}},t.cliente+' · '+t.origen+' → '+t.destino),
            e('div',{style:{fontSize:'.78rem',color:'#64748b',marginTop:2}},(t.fecha_carga||'')+(t.fecha_desc?' → '+t.fecha_desc:'')+(dias!==null?' ('+dias+'d)':'')+' · '+(t.creado_por||''))
          ),
          e('div',{style:{textAlign:'right',flexShrink:0,marginLeft:8}},
            e('div',{style:{fontFamily:'monospace',fontWeight:700,color:util>=0?'#059669':'#dc2626'}},fCLP(util)),
            e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},km+' km')
          )
        ),
        open&&e('div',{className:'si',style:{marginTop:12,paddingTop:12,borderTop:'1px solid #f1f5f9'}},
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}},
            ...[[`Ingreso`,fCLP(tarifa+extras),'#f0fdf4','#166534'],['Costo',fCLP(costo),'#fef2f2','#991b1b'],['Utilidad',fCLP(util),util>=0?'#f0fdf4':'#fef2f2',util>=0?'#166534':'#991b1b']].map(([l,v,bg,col])=>
              e('div',{key:l,style:{background:bg,borderRadius:8,padding:8,textAlign:'center'}},
                e('div',{style:{fontSize:'.72rem',color:col,marginBottom:2}},l),
                e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.85rem'}},v)
              )
            )
          ),
          (t.km_vacio||0)>0&&e('div',{style:{background:'#f5f3ff',borderRadius:8,padding:'8px 10px',fontSize:'.85rem',color:'#5b21b6',marginBottom:8}},'🛣️ Vacío desde ',e('strong',null,t.ciudad_vacio_desde),': '+t.km_vacio+' km · '+fCLP(t.costo_vacio||0)),
          t.guia&&e('div',{style:{fontSize:'.85rem',marginBottom:6}},'📄 Guía: ',e('strong',null,t.guia)),
          t.observaciones&&e('div',{style:{background:'#fffbeb',borderRadius:8,padding:'8px 10px',fontSize:'.85rem',color:'#92400e',marginBottom:8}},'📝 '+t.observaciones),
          e('div',{style:{display:'flex',gap:10,flexWrap:'wrap',marginTop:4}},
            e('button',{className:'btn',style:{width:'auto',padding:'.5rem 1rem',fontSize:'.85rem'},
              onClick:ev=>{ev.stopPropagation();
                setCGuia(t.guia||'');setCFecha(t.fecha_desc||'');setCHora(t.hora_desc||'');
                setCTon(t.toneladas||'');
                setCEncarpe(!!t.encarpe);setCEncarpeM(t.encarpe_monto||'');
                setCLavado(!!t.lavado);setCLavadoM(t.lavado_monto||'');
                setCEstadia(!!t.estadia);setCEstadiaM(t.estadia_monto||'');
                setCRechazada(!!t.rechazada);setCRechazadaM(t.rechazada_monto||'');
                setComp(t);}
            },t.guia&&t.fecha_desc?'✏️ Editar':'✏️ Completar'),
            (isOwner||t.creado_por===user.nombre)&&e('button',{onClick:ev=>{ev.stopPropagation();del(t.id);},style:{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:'.85rem',fontWeight:500,fontFamily:'Geist,sans-serif'}},'🗑️ Eliminar')
          )
        )
      );
    })
  );
}

// ── EFICIENCIA ──
function Eficiencia(){
  const [tramos,setTramos]=useState([]);
  const [period,setPeriod]=useState('month');
  const [patFil,setPatFil]=useState('todos');
  const [grupo,setGrupo]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const periodDays={week:7,month:30,quarter:90,all:9999};

  const byT=useMemo(()=>{
    const days=periodDays[period];
    const cut=new Date(Date.now()-days*86400000);
    const m={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      if(new Date(t.fecha_carga||t.created_at)<cut)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',grupo:grupoPatente(t.patente),n:0,ing:0,cos:0,kmC:0,kmV:0,sinGuia:0,fechas:[]};
      const {tarifa,costo,extras}=calcT(t);
      const p=m[t.patente];
      p.n++;p.ing+=tarifa+extras;p.cos+=costo+(t.costo_vacio||0);
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;
      if(!t.guia)p.sinGuia++;
      if(t.fecha_carga)p.fechas.push(t.fecha_carga);
      if(t.fecha_desc)p.fechas.push(t.fecha_desc);
    });
    // Calcular días activos por camión (días con al menos un tramo en ruta)
    // Días inactivos = días del período - días activos estimados
    const totalDays=Math.min(days, Math.ceil((Date.now()-new Date(tramos.reduce((mn,t)=>(!t.fecha_carga||t.fecha_carga>mn)?mn:t.fecha_carga, new Date().toISOString().split('T')[0])).getTime())/86400000)+1);
    Object.values(m).forEach(p=>{
      // Contar días únicos con actividad
      const diasActivos=new Set(p.fechas).size;
      p.diasActivos=diasActivos;
      p.diasInactivos=Math.max(0,Math.min(days,totalDays)-diasActivos);
    });
    return Object.values(m).sort((a,b)=>(b.ing-b.cos)-(a.ing-a.cos));
  },[tramos,period]);

  const src=useMemo(()=>{
    if(patFil!=='todos')return byT.filter(p=>p.pat===patFil);
    if(grupo!=='todos')return byT.filter(p=>p.grupo===grupo);
    return byT;
  },[byT,patFil,grupo]);

  const tot=useMemo(()=>src.reduce((a,p)=>({
    n:a.n+p.n,ing:a.ing+p.ing,cos:a.cos+p.cos,kmC:a.kmC+p.kmC,kmV:a.kmV+p.kmV,
    diasInactivos:a.diasInactivos+(p.diasInactivos||0)
  }),{n:0,ing:0,cos:0,kmC:0,kmV:0,diasInactivos:0}),[src]);

  const util=tot.ing-tot.cos;
  const pctV=tot.kmC+tot.kmV>0?Math.round(tot.kmV/(tot.kmC+tot.kmV)*100):0;
  const days=periodDays[period];

  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}},
      ...Object.entries({week:'7 días',month:'30 días',quarter:'90 días',all:'Todo'}).map(([v,l])=>
        e('button',{key:v,onClick:()=>setPeriod(v),style:{padding:'6px 14px',borderRadius:8,border:'1.5px solid',borderColor:period===v?'#0A1929':'#e2e8f0',background:period===v?'#0A1929':'white',color:period===v?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},l)
      )
    ),
    e('div',{style:{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}},
      ...['todos','propios','terceros'].map(g=>
        e('button',{key:g,onClick:()=>{setGrupo(g);setPatFil('todos');},
          style:{padding:'6px 14px',borderRadius:8,border:'1.5px solid',
            borderColor:grupo===g&&patFil==='todos'?'#0097A7':'#e2e8f0',
            background:grupo===g&&patFil==='todos'?'#e0f7fa':'white',
            color:grupo===g&&patFil==='todos'?'#0097A7':'#64748b',
            fontWeight:600,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},
          {todos:'🚛 Todos',propios:'🏠 Propios',terceros:'🤝 Terceros'}[g]
        )
      )
    ),
    byT.length>1&&e('div',{style:{display:'flex',gap:6,marginBottom:10,overflowX:'auto',paddingBottom:4}},
      ...['todos',...byT.map(p=>p.pat)].map(p=>
        e('button',{key:p,onClick:()=>setPatFil(p),
          style:{flexShrink:0,padding:'4px 10px',borderRadius:8,border:'1.5px solid',
            borderColor:patFil===p?'#0A1929':'#e2e8f0',
            background:patFil===p?'#0A1929':'white',
            color:patFil===p?'white':'#64748b',
            fontWeight:500,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},
          p==='todos'?'Todos':p)
      )
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
      ...[[`🚛 Tramos`,tot.n],[`💵 Ingresos`,fCLP(tot.ing)],[`📈 Utilidad`,fCLP(util)],[`🛣️ Km vacíos`,tot.kmV.toLocaleString()+' ('+pctV+'%)']].map(([l,v])=>
        e('div',{key:l,className:'card',style:{padding:14}},
          e('div',{style:{fontSize:'.8rem',color:'#64748b',marginBottom:4}},l),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem'}},v)
        )
      )
    ),
    // KPI días inactivos flota
    src.length>0&&e('div',{className:'card',style:{marginBottom:12,borderLeft:'3px solid',borderLeftColor:tot.diasInactivos>src.length*days*0.3?'#ef4444':'#f59e0b'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('div',null,
          e('div',{style:{fontSize:'.8rem',color:'#64748b',marginBottom:3}},'😴 Días inactivos acumulados · flota seleccionada'),
          e('div',{style:{display:'flex',alignItems:'baseline',gap:8}},
            e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.3rem',color:tot.diasInactivos>src.length*days*0.3?'#dc2626':'#92400e'}},tot.diasInactivos),
            e('span',{style:{fontSize:'.8rem',color:'#94a3b8'}},'días-camión sin actividad en el período')
          )
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},{week:'7 días',month:'30 días',quarter:'90 días',all:'Todo el historial'}[period]),
          e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},src.length+' camiones')
        )
      )
    ),
    tot.kmC+tot.kmV>0&&e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'#64748b',marginBottom:6}},
        e('span',null,'📍 '+tot.kmC.toLocaleString()+' km cargado'),
        e('span',null,'🛣️ '+tot.kmV.toLocaleString()+' km vacío')
      ),
      e('div',{style:{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}},
        tot.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
        tot.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
      ),
      e('div',{style:{textAlign:'center',fontSize:'.75rem',color:'#94a3b8',marginTop:4}},'Eficiencia: '+(100-pctV)+'% cargado')
    ),
    src.length===0
      ?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'📊 Sin datos para el período')
      :src.map(p=>{
        const u=p.ing-p.cos;
        const pv=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
        return e('div',{key:p.pat,className:'card',style:{marginBottom:10}},
          e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:10}},
            e('div',null,
              e('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:2}},
                e('span',{style:{fontFamily:'monospace',fontWeight:700}},p.pat),
                e('span',{style:{fontSize:'.7rem',padding:'1px 6px',borderRadius:4,fontWeight:600,
                  background:p.grupo==='terceros'?'#fef3c7':'#dbeafe',
                  color:p.grupo==='terceros'?'#92400e':'#1e40af'}},
                  p.grupo==='terceros'?'Tercero':'Propio')
              ),
              e('div',{style:{fontSize:'.82rem',color:'#64748b'}},'👤 '+p.cond)
            ),
            e('div',{style:{textAlign:'right'}},
              e('div',{style:{fontFamily:'monospace',fontWeight:700,color:u>=0?'#059669':'#dc2626'}},fCLP(u)),
              e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},p.n+' tramo'+(p.n!==1?'s':''))
            )
          ),
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}},
            ...[[`Ingresos`,fCLP(p.ing),'#f0fdf4','#166534'],['Costos',fCLP(p.cos),'#fef2f2','#991b1b'],['Km vacío',p.kmV.toLocaleString(),'#f5f3ff','#5b21b6']].map(([l,v,bg,col])=>
              e('div',{key:l,style:{background:bg,borderRadius:8,padding:8,textAlign:'center'}},

            '😴 '+p.diasInactivos+' día'+(p.diasInactivos!==1?'s':'')+' inactivo'+(p.diasInactivos!==1?'s':'')+' en el período'

  'XVI':['PUERTO MONTT','LLANQUIHUE','CALBUCO','PARGUA'],
  'XVII':['CASTRO','QUELLON','ANCUD'],
};
const getRegion=(ciudad)=>{
  if(!ciudad)return'Sin destino';
  const c=ciudad.toUpperCase();
  for(const[reg,cities]of Object.entries(REGIONES)){
    if(cities.includes(c))return reg+' Región';
  }
  return'Otra región';
};
const REGION_NAMES={
  'I Región':'Tarapacá','II Región':'Parinacota / Arica',
  'III Región':'Antofagasta','IV Región':'Atacama',
  'V Región':'Coquimbo','VI Región':'Valparaíso',
  'VII Región':'Metropolitana','VIII Región':"O'Higgins",
  'IX Región':'Maule','X Región':'Maule Sur',
  'XI Región':'Ñuble Norte','XII Región':'Ñuble',
  'XIII Región':'Biobío','XIV Región':'Araucanía',
  'XV Región':'Los Lagos Norte','XVI Región':'Los Lagos',
  'XVII Región':'Los Lagos Sur / Chiloé',
  'Sin destino':'Sin destino registrado','Otra región':'Otra región',
};
const FIJOS_CORONEL=['GWKV-11','RVTZ-27'];

// ── DISPONIBILIDAD ──
function Disponibilidad({tramos}){
  const disponibles=useMemo(()=>{
    const map={};
    const sorted=[...tramos].sort((a,b)=>(b.fecha_carga||'').localeCompare(a.fecha_carga||'')||b.created_at-a.created_at);
    sorted.forEach(t=>{
      if(!t.patente)return;
      if(!map[t.patente]){
        const truck=TRUCKS.find(x=>x.p===t.patente);
        if(!truck)return;
        const destino=t.destino||'Sin registro';
        // Sin fecha_desc = en tránsito hacia el destino
        const enTransito=!t.fecha_desc&&!!t.destino;
        // Días detenido desde la descarga (solo si no está en tránsito)
        let diasDetenido=null;
        if(!enTransito&&t.fecha_desc){
          const desc=new Date(t.fecha_desc);
          const hoy=new Date();
          desc.setHours(0,0,0,0);hoy.setHours(0,0,0,0);
          diasDetenido=Math.floor((hoy-desc)/86400000);
        }
        map[t.patente]={patente:t.patente,conductor:truck.c,acoplado:truck.a||'',destino,fecha:t.fecha_carga||'',fechaDesc:t.fecha_desc||'',region:getRegion(destino),fijo:false,enTransito,cliente:t.cliente||'',diasDetenido};
      }
    });
    TRUCKS.forEach(t=>{
      if(!map[t.p]){
        const esFijo=FIJOS_CORONEL.includes(t.p);
        map[t.p]={patente:t.p,conductor:t.c,acoplado:t.a||'',destino:esFijo?'CORONEL':'Sin registro',fecha:'',region:esFijo?getRegion('CORONEL'):'Sin destino',fijo:esFijo,enTransito:false,cliente:''};
      }
    });
    return Object.values(map);
  },[tramos]);
  const porRegion=useMemo(()=>{
    const m={};
    disponibles.forEach(d=>{
      const regKey=REGION_NAMES[d.region]||d.region;
      if(!m[regKey])m[regKey]=[];
      m[regKey].push(d);
    });
    return m;
  },[disponibles]);
  const regionOrder=['Tarapacá','Parinacota / Arica','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana',"O'Higgins",'Maule','Maule Sur','Ñuble Norte','Ñuble','Biobío','Araucanía','Los Lagos Norte','Los Lagos','Los Lagos Sur / Chiloé','Sin destino registrado','Otra región'];
  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{marginBottom:16,padding:'10px 14px',background:'#e0f7fa',borderRadius:10,fontSize:'.85rem',color:'#006064'}},
      '📍 Último destino por camión · ',
      e('strong',null,disponibles.filter(d=>d.destino!=='Sin registro').length),
      ' de ',e('strong',null,disponibles.length),' camiones con actividad'
    ),
    regionOrder.filter(r=>porRegion[r]&&porRegion[r].length>0).map(nombre=>{
      const cams=porRegion[nombre];
      return e('div',{key:nombre,className:'card',style:{marginBottom:12}},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:'1px solid #f1f5f9'}},
          e('div',{style:{fontWeight:700,fontSize:'.95rem',color:'#0A1929'}},nombre),
          e('div',{style:{fontSize:'.78rem',color:'#94a3b8'}},cams.length+' camión'+(cams.length!==1?'es':''))
        ),
        cams.map(d=>e('div',{key:d.patente,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f8fafc'}},
          e('div',null,
            e('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
              e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.88rem',color:'#0A1929'}},d.patente),
              d.destino==='Sin registro'
              ?e('span',{style:{fontSize:'.72rem',background:'#f1f5f9',color:'#94a3b8',padding:'1px 6px',borderRadius:4}},'Sin actividad')
              :d.enTransito
                ?e('span',{style:{fontSize:'.72rem',background:'#fef3c7',color:'#92400e',padding:'1px 6px',borderRadius:4}},'🚛 En tránsito → '+d.destino)
                :e('span',{style:{fontSize:'.75rem',background:'#d1fae5',color:'#065f46',padding:'1px 6px',borderRadius:4}},'✅ '+d.destino),
              // Badge urgencia tiempo detenido
              d.diasDetenido!==null&&d.diasDetenido>=0&&e('span',{style:{
                fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:600,
                background:d.diasDetenido===0?'#f0fdf4':d.diasDetenido<=1?'#fefce8':d.diasDetenido<=3?'#fef3c7':'#fef2f2',
                color:d.diasDetenido===0?'#166534':d.diasDetenido<=1?'#713f12':d.diasDetenido<=3?'#92400e':'#991b1b',
              }},
                d.diasDetenido===0?'⚡ Descargó hoy':
                d.diasDetenido===1?'🕐 1 día detenido':
                d.diasDetenido<=3?'⏳ '+d.diasDetenido+' días detenido':
                '🔴 '+d.diasDetenido+' días detenido'
              ),
            ),
            e('div',{style:{fontSize:'.77rem',color:'#64748b',marginTop:2}},'👤 '+d.conductor+(d.acoplado?' · 🔗 '+d.acoplado:'')+(d.enTransito&&d.cliente?' · '+d.cliente:''))
          ),
          d.fecha&&e('div',{style:{fontSize:'.74rem',color:'#94a3b8',textAlign:'right'}},d.fecha)
        ))
      );
    })
  );
}

    return tramos.filter(t=>{
      if(cliente&&t.cliente!==cliente)return false;
      if(desde&&t.fecha_carga<desde)return false;
      if(hasta&&t.fecha_carga>hasta)return false;
      if(grupo!=='todos'&&grupoPatente(t.patente)!==grupo)return false;

    });

    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Reporte');
    XLSX.writeFile(wb,'DITrucks_Reporte_'+(cliente||'todos')+'_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };
  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},
    e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{fontWeight:700,marginBottom:12}},'🔍 Filtros'),

function Facturas({user}){
  const [facts,setFacts]=useState([]);

  const [form,setForm]=useState(null);
  const [filtCliente,setFiltCliente]=useState('');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [sf,setSf]=useState({cliente:'',rut:'',n_factura:'',fecha_factura:today(),monto:'',plazo:30,concepto:'Fletes',observaciones:''});
  const loadF=async()=>{setLoading(true);const d=await api.getFact();setFacts(d);setLoading(false);};
  useEffect(()=>{loadF();},[]);

  const clientesDisp=useMemo(()=>['',...new Set(facts.map(f=>f.cliente).filter(Boolean))].sort(),[facts]);

  const factsBase=useMemo(()=>facts.filter(f=>{
    if(filtCliente&&f.cliente!==filtCliente)return false;
    if(filtDesde&&(f.fecha_factura||'')<filtDesde)return false;
    if(filtHasta&&(f.fecha_factura||'')>filtHasta)return false;
    return true;
  }),[facts,filtCliente,filtDesde,filtHasta]);

  const porEstado=useMemo(()=>{
    const m={vigente:[],proxima:[],vencida:[],pagada:[]};
    factsBase.forEach(f=>{const s=getEstadoFact(f);if(m[s])m[s].push(f);});
    return m;
  },[factsBase]);

  const lista=tab==='todas'?factsBase:porEstado[tab]||[];

  // Resumen cobro
  const resumen=useMemo(()=>factsBase.reduce((a,f)=>{
    const est=getEstadoFact(f);
    a.total+=f.monto||0;

    else if(est==='vencida')a.vencido+=f.monto||0;
    else a.pendiente+=f.monto||0;
    return a;

  const guardarFact=async()=>{
    if(!sf.concepto||!sf.monto){alert('Completa concepto y monto');return;}

      id:Date.now().toString(),created_at:Date.now(),creado_por:user?.nombre||'',

      concepto:sf.concepto,observaciones:sf.observaciones||'',
      pagada:false,fecha_pago:'',monto_pagado:0
    });
    if(ok){setForm(null);setSf({cliente:'',rut:'',n_factura:'',fecha_factura:today(),monto:'',plazo:30,concepto:'Fletes',observaciones:''});loadF();}
    else alert('Error al guardar. Intenta de nuevo.');

        'Plazo (días)':f.plazo||30,'Monto':f.monto||0,
        'Estado':est==='pagada'?'Pagada':est==='vencida'?'Vencida':est==='proxima'?'Por vencer':'Vigente',
        'Días al vencimiento':dias!==null?dias:'—',
        'Fecha Pago':f.fecha_pago||'',
        'Descripción':f.descripcion||''
      };
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Facturas');
    XLSX.writeFile(wb,'DITrucks_Facturas_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',null,
    // Modal nueva factura
    form&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},

        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},

    // Resumen KPIs

function Mantencion({user}){
  const [mants,setMants]=useState([]);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState(false);
  const [filtPat,setFiltPat]=useState('');
  const [filtTipo,setFiltTipo]=useState('');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [mf,setMf]=useState({patente:'',tipo:'',descripcion:'',fecha:today(),costo:'',taller:''});
  const load=async()=>{setLoading(true);const d=await api.getMant();setMants(d);setLoading(false);};
  useEffect(()=>{load();},[]);
  const guardar=async()=>{
    if(!mf.patente||!mf.tipo){alert('Completa Patente y Tipo');return;}
    const ok=await api.addMant({...mf,costo:Number(mf.costo)||0});
    if(ok){setForm(false);setMf({patente:'',tipo:'',descripcion:'',fecha:today(),costo:'',taller:''});load();}

  const mantsFil=useMemo(()=>mants.filter(x=>{
    if(filtPat&&x.patente!==filtPat)return false;
    if(filtTipo&&x.tipo!==filtTipo)return false;
    if(filtDesde&&(x.fecha||'')<filtDesde)return false;
    if(filtHasta&&(x.fecha||'')>filtHasta)return false;

// ── RANKING EFICIENCIA ──
function Ranking(){
  const [tramos,setTramos]=useState([]);
  const [desde,setDesde]=useState('');
  const [hasta,setHasta]=useState('');
  const [grupo,setGrupo]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const ranking=useMemo(()=>{
    const m={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      if(desde&&(t.fecha_carga||'')<desde)return;
      if(hasta&&(t.fecha_carga||'')>hasta)return;
      if(grupo!=='todos'&&grupoPatente(t.patente)!==grupo)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',grupo:grupoPatente(t.patente),n:0,util:0,kmC:0,kmV:0,ing:0,cos:0};
      const{tarifa,costo,extras}=calcT(t);
      const costoVacio=Number(t.costo_vacio||0);
      const p=m[t.patente];
      p.n++;
      p.ing+=tarifa+extras;
      p.cos+=costo+costoVacio;
      p.util+=tarifa+extras-costo-costoVacio;
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;
    });
    return Object.values(m).sort((a,b)=>b.util-a.util);
  },[tramos,desde,hasta,grupo]);

  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=ranking.map((p,i)=>({
      'Posición':i+1,'Patente':p.pat,'Conductor':p.cond,'Grupo':p.grupo==='terceros'?'Tercero':'Propio',
      'Tramos':p.n,'Utilidad':Math.round(p.util),'Ingresos':Math.round(p.ing),'Costos':Math.round(p.cos),
      'Km Cargado':p.kmC,'Km Vacío':p.kmV,'Km Total':p.kmC+p.kmV,
      '% Vacío':p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0
    }));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ranking');
    XLSX.writeFile(wb,'DITrucks_Ranking_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',{style:{maxWidth:680,margin:'0 auto',paddingBottom:48}},
    // Filtros
    e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',gap:6,marginBottom:10}},
        ...['todos','propios','terceros'].map(g=>
          e('button',{key:g,onClick:()=>setGrupo(g),style:{padding:'5px 14px',borderRadius:8,border:'1.5px solid',borderColor:grupo===g?'#0097A7':'#e2e8f0',background:grupo===g?'#e0f7fa':'white',color:grupo===g?'#0097A7':'#64748b',fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},
            {todos:'🚛 Todos',propios:'🏠 Propios',terceros:'🤝 Terceros'}[g]
          )
        )
      ),
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
        e('div',null,e('label',{className:'lbl'},'Desde'),e('input',{className:'inp',type:'date',value:desde,onChange:ev=>setDesde(ev.target.value),style:{fontSize:'.82rem',padding:'.5rem .75rem'}})),
        e('div',null,e('label',{className:'lbl'},'Hasta'),e('input',{className:'inp',type:'date',value:hasta,onChange:ev=>setHasta(ev.target.value),style:{fontSize:'.82rem',padding:'.5rem .75rem'}}))
      )
    ),
    // Header
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
      e('div',{style:{fontSize:'.85rem',color:'#64748b'}},ranking.length+' camiones · ordenados por utilidad'),
      e('button',{onClick:exportExcel,style:{padding:'.4rem .9rem',background:'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'📥 Excel')
    ),
    // Lista
    ranking.length===0
      ?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'Sin datos para el período seleccionado')
      :ranking.map((p,i)=>{
        const pctV=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
        const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        return e('div',{key:p.pat,className:'card',style:{marginBottom:8,borderLeft:'3px solid',borderLeftColor:i===0?'#f59e0b':i===1?'#94a3b8':i===2?'#b45309':'#e2e8f0'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
            e('div',{style:{display:'flex',alignItems:'center',gap:8}},
              e('span',{style:{fontSize:'1.1rem',width:28,textAlign:'center'}},medal||('#'+(i+1))),
              e('div',null,
                e('div',{style:{display:'flex',alignItems:'center',gap:6}},
                  e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.95rem'}},p.pat),
                  e('span',{style:{fontSize:'.7rem',padding:'1px 6px',borderRadius:4,fontWeight:600,background:p.grupo==='terceros'?'#fef3c7':'#dbeafe',color:p.grupo==='terceros'?'#92400e':'#1e40af'}},p.grupo==='terceros'?'Tercero':'Propio')
                ),
                e('div',{style:{fontSize:'.8rem',color:'#64748b'}},'👤 '+p.cond+' · '+p.n+' tramo'+(p.n!==1?'s':''))
              )
            ),
            e('div',{style:{textAlign:'right'}},
              e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1rem',color:p.util>=0?'#059669':'#dc2626'}},fCLP(p.util)),
              e('div',{style:{fontSize:'.72rem',color:'#94a3b8'}},'utilidad acumulada')
            )
          ),
          e('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}},
            ...[[`📍 Km cargado`,p.kmC.toLocaleString(),'#dbeafe','#1e40af'],[`🛣️ Km vacío`,p.kmV.toLocaleString(),'#ede9fe','#5b21b6'],[`📊 % Vacío`,pctV+'%',pctV>30?'#fef2f2':'#f0fdf4',pctV>30?'#991b1b':'#166534'],[`📦 Tramos`,p.n,'#f1f5f9','#475569']].map(([l,v,bg,col])=>
              e('div',{key:l,style:{background:bg,borderRadius:6,padding:'6px 8px',textAlign:'center'}},
                e('div',{style:{fontSize:'.65rem',color:col,marginBottom:2,fontWeight:600}},l),
                e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}},v)
              )
            )
          ),
          e('div',{style:{display:'flex',height:5,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginTop:8}},
            p.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
            p.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
          )
        );
      })
  );
}

    {id:'disponibilidad',l:'📍 Disponibilidad'},
    ...(!isLimitado?[{id:'reportes',l:'📁 Reportes'}]:[]),
    {id:'admin',l:'🧾 Facturación'},
  ];
  return e('div',{style:{minHeight:'100vh'}},
    e('div',{style:{background:'linear-gradient(135deg,#0A1929,#1E293B)',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10}},
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:24}},'🚛'),
        e('span',{style:{fontWeight:700,fontSize:'1.1rem',letterSpacing:-.5}},'DITrucks')
      ),
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:'.82rem',color:'rgba(255,255,255,.6)'}},'👤 '+user.nombre),
        e('button',{onClick:()=>setUser(null),style:{background:'rgba(255,255,255,.1)',border:'none',color:'white',padding:'4px 10px',borderRadius:6,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},'Salir')
      )
    ),
    e('div',{style:{overflowX:'auto',background:'white',borderBottom:'1px solid #e2e8f0',display:'flex',gap:0}},
      tabs.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{padding:'10px 14px',border:'none',borderBottom:'2px solid',borderBottomColor:tab===t.id?'#00BCD4':'transparent',background:'none',color:tab===t.id?'#0097A7':'#64748b',fontWeight:tab===t.id?600:400,cursor:'pointer',fontSize:'.82rem',whiteSpace:'nowrap',fontFamily:'Geist,sans-serif',transition:'all .15s'}},t.l))
    ),
    e('div',{style:{padding:'16px',maxWidth:700,margin:'0 auto'}},
      tab==='nuevo'&&e(NuevoTramo,{user,tramos,onSaved:reload}),
      tab==='tramos'&&e(ListaTramos,{user,isOwner}),
      tab==='eficiencia'&&e(Eficiencia),
      tab==='ranking'&&e(Ranking),
      tab==='disponibilidad'&&e(Disponibilidad,{tramos}),
      tab==='reportes'&&e(ReportesClientes),
      tab==='admin'&&e(Reportes,{user})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
