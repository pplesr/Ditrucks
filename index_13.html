*{box-sizing:border-box}
body{font-family:'Geist',sans-serif;background:#F0F4F8;margin:0;min-height:100vh}
.inp{width:100%;padding:.7rem 1rem;border:1.5px solid #E2E8F0;border-radius:10px;font-size:.92rem;outline:none;background:white;font-family:'Geist',sans-serif;transition:border .2s}

.card{background:white;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:1.25rem}
.dd-wrap{position:relative}
.dd-menu{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:white;border:1.5px solid #E2E8F0;border-radius:10px;max-height:250px;overflow-y:auto;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.dd-item{padding:.55rem 1rem;cursor:pointer;font-size:.88rem}
.dd-item:hover{background:#E0F7FA}
.dark-panel{background:linear-gradient(135deg,#0A1929,#1E293B);color:white;border-radius:16px;padding:1.5rem}
@keyframes si{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.si{animation:si .2s ease-out}
.lbl{display:block;font-size:.82rem;font-weight:600;color:#475569;margin-bottom:5px}
.f-vencida{border-left:4px solid #ef4444;background:#fff5f5}
.f-proxima{border-left:4px solid #f59e0b;background:#fffbeb}
.f-vigente{border-left:4px solid #3b82f6}
.f-pagada{border-left:4px solid #10b981;opacity:.8}
.tab-fact{padding:8px 14px;border:none;background:transparent;border-bottom:2px solid transparent;color:#64748b;font-weight:500;cursor:pointer;font-size:.83rem;font-family:'Geist',sans-serif;transition:all .15s}
.tab-fact-active{border-bottom-color:#00BCD4;color:#0097A7}

const addDays=(d,n)=>{const dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];};

const fCLP=n=>'$'+Math.round(n||0).toLocaleString('es-CL');

const findR=(cl,or,de)=>RT.find(r=>r.cl===cl&&r.or===or&&r.de===de);
const cls=()=>[...new Set(RT.map(r=>r.cl))].sort();
const ors=(cl)=>[...new Set(RT.filter(r=>r.cl===cl).map(r=>r.or))].sort();
const des=(cl,or)=>[...new Set(RT.filter(r=>r.cl===cl&&r.or===or).map(r=>r.de))].sort();
const haversine=(a,b)=>{const R=6371,rad=d=>d*Math.PI/180,dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]),x=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.3);};
const kmV=(a,b)=>{
  if(!a||!b||a===b)return{km:0,costo:0};
  // 1. Buscar ruta directa en BD (ambos sentidos)
  const rutaDir=RT.find(r=>(r.or===a&&r.de===b)||(r.or===b&&r.de===a));
  if(rutaDir){
    const cpkm=rutaDir.k>0?rutaDir.c/rutaDir.k:700;
    return{km:rutaDir.k,costo:Math.round(rutaDir.k*cpkm)};
  }
  // 2. Triangular via ciudad intermedia
  const rutasA=RT.filter(r=>r.or===a||r.de===a);
  for(const ra of rutasA){
    const mid=ra.or===a?ra.de:ra.or;
    const rb=RT.find(r=>(r.or===mid&&r.de===b)||(r.or===b&&r.de===mid));
    if(rb){
      const km=ra.k+rb.k;
      const cpkm=((ra.k>0?ra.c/ra.k:700)+(rb.k>0?rb.c/rb.k:700))/2;
      return{km,costo:Math.round(km*cpkm)};
    }
  }
  // 3. Último recurso: Haversine
  const ca=CC[a],cb=CC[b];
  if(!ca||!cb)return{km:0,costo:0};
  const km=haversine(ca,cb);
  const rs=RT.filter(r=>r.or===a||r.de===a||r.or===b||r.de===b);
  const cpkm=rs.length?rs.reduce((s,r)=>s+(r.k>0?r.c/r.k:700),0)/rs.length:700;
  return{km,costo:Math.round(km*cpkm)};
};

  const [cRechazadaM,setCRechazadaM]=useState('');

  const load=async()=>{setLoading(true);const d=await api.get();setData(d);setLoading(false);};
  useEffect(()=>{load();},[]);

  const fil=useMemo(()=>{
    const sq=q.toLowerCase();
    return data.filter(t=>{
      if(sq&&![t.cliente,t.origen,t.destino,t.patente,t.guia,t.creado_por].some(v=>(v||'').toLowerCase().includes(sq)))return false;
      if(filtDesde&&(t.fecha_carga||'')<filtDesde)return false;
      if(filtHasta&&(t.fecha_carga||'')>filtHasta)return false;
      return true;
    });
  },[data,q,filtDesde,filtHasta]);

  const del=async(id)=>{
    if(!confirm('¿Eliminar este tramo?'))return;
    // Buscar el tramo a eliminar
    const tramoBorrado=data.find(t=>t.id===id);
    // Eliminar
    await api.del(id);
    // Recalcular km vacíos del tramo siguiente del mismo camión
    if(tramoBorrado&&tramoBorrado.patente){
      const restantes=data.filter(t=>t.id!==id&&t.patente===tramoBorrado.patente)
        .sort((a,b)=>(a.fecha_carga||'').localeCompare(b.fecha_carga||'')||a.created_at-b.created_at);
      // Buscar el tramo que viene después del borrado
      const sigIdx=restantes.findIndex(t=>(t.fecha_carga||'')>=(tramoBorrado.fecha_carga||''));
      if(sigIdx>=0){
        const sig=restantes[sigIdx];
        // Tramo anterior al siguiente (ahora que borramos el intermedio)
        const prevDelSig=sigIdx>0?restantes[sigIdx-1]:null;
        let nuevoKmVacio=0,nuevoCostoVacio=0,nuevaCiudad='';
        if(prevDelSig&&prevDelSig.destino&&sig.origen&&prevDelSig.destino!==sig.origen){
          const v=kmV(prevDelSig.destino,sig.origen);
          nuevoKmVacio=v.km;nuevoCostoVacio=v.costo;nuevaCiudad=prevDelSig.destino;
        }
        await api.patch(sig.id,{km_vacio:nuevoKmVacio,costo_vacio:nuevoCostoVacio,ciudad_vacio_desde:nuevaCiudad});
      }
    }
    load();
  };
  const completar=async()=>{
    await api.patch(comp.id,{
      guia:cGuia,fecha_desc:cFecha,hora_desc:cHora,
      toneladas:cTon||comp.toneladas,
      encarpe:cEncarpe,encarpe_monto:cEncarpeM,
      lavado:cLavado,lavado_monto:cLavadoM,
      estadia:cEstadia,estadia_monto:cEstadiaM,
      rechazada:cRechazada,rechazada_monto:cRechazadaM,
    });
    setComp(null);load();
  };
  const est=(t)=>{
    if(t.guia&&t.fecha_desc)return{l:'Completo',bg:'#d1fae5',col:'#065f46',ic:'✅'};
    if(!t.guia)return{l:'Sin guía',bg:'#fee2e2',col:'#991b1b',ic:'⚠️'};
    return{l:'Sin descarga',bg:'#fef3c7',col:'#92400e',ic:'⏳'};
  };

  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=data.map(t=>{
      const {tarifa,costo,extras,util,km}=calcT(t);
      const truck=TRUCKS.find(x=>x.p===t.patente);
      const dias=t.fecha_carga&&t.fecha_desc?Math.round((new Date(t.fecha_desc)-new Date(t.fecha_carga))/86400000):'';
      return{'Patente':t.patente,'Conductor':truck?.c||'','Cliente':t.cliente,'Origen':t.origen,'Destino':t.destino,'Fecha Carga':t.fecha_carga,'Hora Carga':t.hora_carga,'Fecha Descarga':t.fecha_desc||'Pendiente','Días Tránsito':dias,'Guía':t.guia||'Pendiente','Km Cargado':km,'Km Vacío':t.km_vacio||0,'Ciudad Vacío Desde':t.ciudad_vacio_desde||'','Tarifa':Math.round(tarifa),'Costo':Math.round(costo),'Extras':Math.round(extras),'Utilidad':Math.round(util),'Costo Km Vacío':t.costo_vacio||0,'Estado':t.guia&&t.fecha_desc?'Completo':!t.guia?'Sin guía':'Sin descarga','Creado por':t.creado_por||''};
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Tramos');
    XLSX.writeFile(wb,'DITrucks_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    // Modal completar
    comp&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},
      e('div',{className:'card si',style:{width:'100%',maxWidth:440,maxHeight:'90vh',overflowY:'auto'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          e('strong',null,'Completar tramo'),
          e('button',{onClick:()=>setComp(null),style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#94a3b8'}},'×')

        e('div',{style:{fontSize:'.85rem',color:'#64748b',marginBottom:12}},comp.cliente+' · '+comp.origen+' → '+comp.destino),
        F('N° Guía',e('input',{className:'inp',type:'text',value:cGuia,onChange:ev=>setCGuia(ev.target.value),placeholder:'Número de guía'})),
        (()=>{const r=findR(comp.cliente,comp.origen,comp.destino);return r&&r.ton?e('div',null,
          e('label',{className:'lbl'},'Toneladas cargadas ',e('span',{style:{color:'#00BCD4'}},'('+r.ton+' $/ton)')),
          e('input',{className:'inp',type:'number',min:0,value:cTon,onChange:ev=>setCTon(ev.target.value),placeholder:'Ej: 28'}),
          cTon&&e('div',{style:{marginTop:4,fontSize:'.82rem',color:'#059669',fontWeight:600}},'Tarifa: $'+(Math.round(Number(cTon)*r.ton)).toLocaleString('es-CL'))
        ):null;})(),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
          F('Fecha descarga',e('input',{className:'inp',type:'date',value:cFecha,onChange:ev=>setCFecha(ev.target.value)})),
          F('Hora descarga',e('input',{className:'inp',type:'time',value:cHora,onChange:ev=>setCHora(ev.target.value),disabled:!cFecha}))
        ),
        e('div',{style:{borderTop:'1px solid #f1f5f9',marginTop:12,paddingTop:12}},
          e('div',{style:{fontSize:'.82rem',fontWeight:600,color:'#475569',marginBottom:8}},'➕ Cargos adicionales'),
          ...[
            ['encarpe','🔧 Encarpe',cEncarpe,setCEncarpe,cEncarpeM,setCEncarpeM],
            ['lavado','🚿 Lavado',cLavado,setCLavado,cLavadoM,setCLavadoM],
            ['estadia','🏨 Estadía',cEstadia,setCEstadia,cEstadiaM,setCEstadiaM],
            ['rechazada','📦 Rechazada',cRechazada,setCRechazada,cRechazadaM,setCRechazadaM],
          ].map(([k,l,val,setVal,monto,setMonto])=>
            e('div',{key:k,style:{marginBottom:6,padding:'8px 10px',borderRadius:8,border:'1.5px solid',borderColor:val?'#a5f3fc':'#f1f5f9',background:val?'#e0f7fa':'#f8fafc'}},
              e('label',{style:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:'.85rem',fontWeight:500}},
                e('input',{type:'checkbox',checked:val,onChange:ev=>setVal(ev.target.checked),style:{width:15,height:15,accentColor:'#00BCD4'}}),l
              ),

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}},
          e('button',{onClick:()=>setComp(null),style:{padding:'.75rem',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',cursor:'pointer',fontWeight:500,fontFamily:'Geist,sans-serif'}},'Cancelar'),
          e('button',{className:'btn',onClick:completar},'Guardar')

    e('div',{style:{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap'}},
      e('input',{className:'inp',style:{flex:'1 1 200px'},placeholder:'🔍 Buscar…',value:q,onChange:ev=>setQ(ev.target.value)}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtDesde||'',onChange:ev=>setFiltDesde(ev.target.value),title:'Desde'}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtHasta||'',onChange:ev=>setFiltHasta(ev.target.value),title:'Hasta'}),

    ),

      return e('div',{style:{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}},
        e('div',{style:{background:'#f1f5f9',borderRadius:8,padding:'8px 14px',fontSize:'.85rem',color:'#475569',fontWeight:600}},
          '📦 ',e('strong',null,tots.n),' tramos'

        e('div',{style:{background:'#dbeafe',borderRadius:8,padding:'8px 14px',fontSize:'.85rem',color:'#1e40af',fontWeight:600}},

    :fil.map(t=>{

// ── EFICIENCIA ──
function Eficiencia(){
  const [tramos,setTramos]=useState([]);
  const [period,setPeriod]=useState('month');
  const [patFil,setPatFil]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const now=new Date();
  const fil=useMemo(()=>{
    const days={week:7,month:30,quarter:90,all:9999}[period];
    const cut=new Date(now-days*86400000);
    return tramos.filter(t=>new Date(t.fecha_carga||t.created_at)>=cut);
  },[tramos,period]);

  const byT=useMemo(()=>{
    const m={};
    fil.forEach(t=>{
      if(!t.patente)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',n:0,ing:0,cos:0,kmC:0,kmV:0,cosV:0,sinGuia:0};
      const {tarifa,costo,extras}=calcT(t);
      const p=m[t.patente];
      p.n++;p.ing+=tarifa+extras;p.cos+=costo+(t.costo_vacio||0);
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;p.cosV+=t.costo_vacio||0;
      if(!t.guia)p.sinGuia++;
    });
    return Object.values(m).sort((a,b)=>(b.ing-b.cos)-(a.ing-a.cos));
  },[fil]);

  const src=patFil==='todos'?byT:byT.filter(p=>p.pat===patFil);
  const tot=src.reduce((a,p)=>({n:a.n+p.n,ing:a.ing+p.ing,cos:a.cos+p.cos,kmC:a.kmC+p.kmC,kmV:a.kmV+p.kmV}),{n:0,ing:0,cos:0,kmC:0,kmV:0});
  const util=tot.ing-tot.cos;
  const pctV=tot.kmC+tot.kmV>0?Math.round(tot.kmV/(tot.kmC+tot.kmV)*100):0;

  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}},
      ...Object.entries({week:'7 días',month:'30 días',quarter:'90 días',all:'Todo'}).map(([v,l])=>
        e('button',{key:v,onClick:()=>setPeriod(v),style:{padding:'6px 14px',borderRadius:8,border:'1.5px solid',borderColor:period===v?'#0A1929':'#e2e8f0',background:period===v?'#0A1929':'white',color:period===v?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},l)
      )
    ),
    byT.length>1&&e('div',{style:{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}},
      ...['todos',...byT.map(p=>p.pat)].map(p=>
        e('button',{key:p,onClick:()=>setPatFil(p),style:{flexShrink:0,padding:'4px 10px',borderRadius:8,border:'1.5px solid',borderColor:patFil===p?'#0A1929':'#e2e8f0',background:patFil===p?'#0A1929':'white',color:patFil===p?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},p==='todos'?'Todos':p)
      )
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
      ...[[`🚛 Tramos`,tot.n],[`💵 Ingresos`,fCLP(tot.ing)],[`📈 Utilidad`,fCLP(util)],[`🛣️ Km vacíos`,tot.kmV.toLocaleString()+'  ('+pctV+'%)']].map(([l,v])=>
        e('div',{key:l,className:'card',style:{padding:14}},
          e('div',{style:{fontSize:'.8rem',color:'#64748b',marginBottom:4}},l),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem'}},v)
        )
      )
    ),
    tot.kmC+tot.kmV>0&&e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'#64748b',marginBottom:6}},
        e('span',null,'📍 '+tot.kmC.toLocaleString()+' km cargado'),
        e('span',null,'🛣️ '+tot.kmV.toLocaleString()+' km vacío')
      ),
      e('div',{style:{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}},
        tot.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
        tot.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
      ),
      e('div',{style:{textAlign:'center',fontSize:'.75rem',color:'#94a3b8',marginTop:4}},'Eficiencia: '+(100-pctV)+'% cargado')
    ),
    src.length===0?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'📊 Sin datos para el período')
    :src.map(p=>{
      const u=p.ing-p.cos;
      const pv=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
      return e('div',{key:p.pat,className:'card',style:{marginBottom:10}},
        e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:10}},
          e('div',null,e('div',{style:{fontFamily:'monospace',fontWeight:700}},p.pat),e('div',{style:{fontSize:'.82rem',color:'#64748b'}},'👤 '+p.cond)),
          e('div',{style:{textAlign:'right'}},e('div',{style:{fontFamily:'monospace',fontWeight:700,color:u>=0?'#059669':'#dc2626'}},fCLP(u)),e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},p.n+' tramo'+(p.n!==1?'s':'')))
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}},
          ...[[`Ingresos`,fCLP(p.ing),'#f0fdf4','#166534'],['Costos',fCLP(p.cos),'#fef2f2','#991b1b'],['Km vacío',p.kmV.toLocaleString(),'#f5f3ff','#5b21b6']].map(([l,v,bg,col])=>
            e('div',{key:l,style:{background:bg,borderRadius:8,padding:8,textAlign:'center'}},
              e('div',{style:{fontSize:'.72rem',color:col,marginBottom:2}},l),
              e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}},v)
            )
          )
        ),
        e('div',{style:{display:'flex',height:6,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginBottom:4}},
          p.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pv)+'%'}}),
          p.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pv+'%'}})
        ),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'#94a3b8'}},
          e('span',null,p.kmC.toLocaleString()+' km cargado'),e('span',null,pv+'% vacío')
        ),
        p.sinGuia>0&&e('div',{style:{marginTop:8,fontSize:'.78rem',background:'#fffbeb',color:'#92400e',borderRadius:6,padding:'6px 10px'}},'⚠️ '+p.sinGuia+' tramo'+(p.sinGuia!==1?'s':'')+' sin guía')
      );
    })
  );
}

const getRegion=(ciudad)=>{
  if(!ciudad)return'Sin destino';
  const c=ciudad.toUpperCase();
  for(const[reg,cities]of Object.entries(REGIONES)){
    if(cities.includes(c))return reg+' Región';
  }
  return'Otra región';
};

// Camiones fijos arrendados en Coronel
const FIJOS_CORONEL=['GWKV-11','RVTZ-27'];

// ── DISPONIBILIDAD ──
function Disponibilidad({tramos}){
  const disponibles=useMemo(()=>{
    const map={};
    // Ordenar por fecha de carga (más reciente primero)
    const sorted=[...tramos].sort((a,b)=>(b.fecha_carga||'').localeCompare(a.fecha_carga||'')||b.created_at-a.created_at);
    sorted.forEach(t=>{
      if(!t.patente)return;
      if(!map[t.patente]){
        const truck=TRUCKS.find(x=>x.p===t.patente);
        if(!truck)return;
        // Usar destino real del último tramo
        const destino=t.destino||'Sin registro';
        map[t.patente]={
          patente:t.patente,
          conductor:truck.c,
          acoplado:truck.a||'',
          destino,
          fecha:t.fecha_carga||'',
          region:getRegion(destino),
          fijo:false,
        };
      }
    });
    // Camiones sin ningún tramo registrado
    TRUCKS.forEach(t=>{
      if(!map[t.p]){
        // Si es fijo arrendado en Coronel, mostrar ahí
        const esFijo=FIJOS_CORONEL.includes(t.p);
        map[t.p]={
          patente:t.p,conductor:t.c,acoplado:t.a||'',
          destino:esFijo?'CORONEL':'Sin registro',
          fecha:'',
          region:esFijo?getRegion('CORONEL'):'Sin destino',
          fijo:esFijo,
        };
      }
      // NO forzar fijos con tramos - respetar su último destino real
    });
    return Object.values(map);
  },[tramos]);

  const porRegion=useMemo(()=>{
    const m={};
    disponibles.forEach(d=>{
      const regKey=REGION_NAMES[d.region]||d.region;
      if(!m[regKey])m[regKey]=[];
      m[regKey].push(d);
    });
    return m;
  },[disponibles]);

  const regionOrder=[
    'Tarapacá','Parinacota / Arica','Antofagasta','Atacama','Coquimbo',
    'Valparaíso','Metropolitana',"O'Higgins",'Maule','Maule Sur',
    'Ñuble Norte','Ñuble','Biobío','Araucanía','Los Lagos Norte',
    'Los Lagos','Los Lagos Sur / Chiloé','Sin destino registrado','Otra región'
  ];

  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{marginBottom:16,padding:'10px 14px',background:'#e0f7fa',borderRadius:10,fontSize:'.85rem',color:'#006064'}},
      '📍 Último destino por camión · ',
      e('strong',null,disponibles.filter(d=>d.destino!=='Sin registro').length),
      ' de ',e('strong',null,disponibles.length),' camiones con actividad'
    ),
    regionOrder.filter(r=>porRegion[r]&&porRegion[r].length>0).map(nombre=>{
      const cams=porRegion[nombre];
      return e('div',{key:nombre,className:'card',style:{marginBottom:12}},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:'1px solid #f1f5f9'}},
          e('div',{style:{fontWeight:700,fontSize:'.95rem',color:'#0A1929'}},nombre),
          e('div',{style:{fontSize:'.78rem',color:'#94a3b8'}},cams.length+' camión'+(cams.length!==1?'es':''))
        ),
        cams.map(d=>e('div',{key:d.patente,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f8fafc'}},
          e('div',null,
            e('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
              e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.88rem',color:'#0A1929'}},d.patente),
              d.destino==='Sin registro'
                ?e('span',{style:{fontSize:'.72rem',background:'#f1f5f9',color:'#94a3b8',padding:'1px 6px',borderRadius:4}},'Sin actividad')
                :e('span',{style:{fontSize:'.75rem',background:'#d1fae5',color:'#065f46',padding:'1px 6px',borderRadius:4}},'✅ '+d.destino),

            ),
            e('div',{style:{fontSize:'.77rem',color:'#64748b',marginTop:2}},'👤 '+d.conductor+(d.acoplado?' · 🔗 '+d.acoplado:''))
          ),
          d.fecha&&e('div',{style:{fontSize:'.74rem',color:'#94a3b8',textAlign:'right'}},d.fecha)
        ))
      );
    })
  );
}

function ReporteMant(){
  const [lista,setLista]=useState([]);
  const [patFil,setPatFil]=useState('');
  const [tipoFil,setTipoFil]=useState('');
  const [desde,setDesde]=useState('');
  const [hasta,setHasta]=useState('');
  useEffect(()=>{api.getMant().then(setLista);},[]);

  const patentes=useMemo(()=>['',...new Set([...lista.map(m=>m.patente_tracto),...lista.map(m=>m.patente_semi)].filter(Boolean))].sort(),[lista]);

  const fil=useMemo(()=>lista.filter(m=>{
    if(patFil&&m.patente_tracto!==patFil&&m.patente_semi!==patFil)return false;
    if(tipoFil&&m.tipo!==tipoFil)return false;
    if(desde&&m.fecha<desde)return false;
    if(hasta&&m.fecha>hasta)return false;
    return true;
  }),[lista,patFil,tipoFil,desde,hasta]);

  const totPorPat=useMemo(()=>{
    const m={};
    fil.forEach(r=>{
      const pats=[r.patente_tracto,r.patente_semi].filter(Boolean);
      pats.forEach(p=>{
        if(!m[p])m[p]={patente:p,Repuesto:0,Neumático:0,Batería:0,total:0};
        m[p][r.tipo]=(m[p][r.tipo]||0)+(r.monto||0);
        m[p].total+=(r.monto||0);
      });
    });
    return Object.values(m).sort((a,b)=>b.total-a.total);
  },[fil]);

  const exportExcel=()=>{
    if(typeof XLSX==='undefined')return;
    const rows=fil.map(m=>({'Fecha':m.fecha,'Tipo':m.tipo,'Tracto':m.patente_tracto||'','Semi':m.patente_semi||'','Descripción':m.descripcion||'','Proveedor':m.proveedor||'','OT/Factura':m.ot||'','Monto':m.monto||0}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Gastos Mantención');
    XLSX.writeFile(wb,'DITrucks_Mant_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  const totGlobal=fil.reduce((a,m)=>a+(m.monto||0),0);

  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},
    // Filtros
    e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{fontWeight:700,marginBottom:12}},'🔍 Filtros'),
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
        e('div',null,
          e('label',{className:'lbl'},'Patente'),
          e('select',{className:'inp',value:patFil,onChange:ev=>setPatFil(ev.target.value),style:{cursor:'pointer'}},
            patentes.map(p=>e('option',{key:p,value:p},p===''?'Todas las patentes':p))
          )
        ),
        e('div',null,
          e('label',{className:'lbl'},'Tipo'),
          e('select',{className:'inp',value:tipoFil,onChange:ev=>setTipoFil(ev.target.value),style:{cursor:'pointer'}},
            [['','Todos'],['Repuesto','🔩 Repuestos'],['Neumático','🔘 Neumáticos'],['Batería','🔋 Baterías']].map(([v,l])=>e('option',{key:v,value:v},l))
          )
        )
      ),
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
        e('div',null,e('label',{className:'lbl'},'Desde'),e('input',{className:'inp',type:'date',value:desde,onChange:ev=>setDesde(ev.target.value)})),
        e('div',null,e('label',{className:'lbl'},'Hasta'),e('input',{className:'inp',type:'date',value:hasta,onChange:ev=>setHasta(ev.target.value)}))
      )
    ),
    // Total + Excel
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
      e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem',color:'#dc2626'}},'Total: '+fCLP(totGlobal)),
      e('button',{onClick:exportExcel,style:{padding:'.6rem 1rem',background:'#16a34a',color:'white',border:'none',borderRadius:10,fontWeight:600,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},'📥 Excel')
    ),
    // Por patente
    totPorPat.length===0?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'Sin datos para los filtros')
    :totPorPat.map(p=>e('div',{key:p.patente,className:'card',style:{marginBottom:10}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        e('div',null,
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.95rem'}},p.patente),
          e('div',{style:{fontSize:'.78rem',color:'#64748b'}},TRUCKS.find(t=>t.p===p.patente)?.c||'Semirremolque')
        ),
        e('div',{style:{fontFamily:'monospace',fontWeight:700,color:'#dc2626',fontSize:'1rem'}},fCLP(p.total))
      ),
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}},
        ...[[`🔩`,p.Repuesto,'#fef3c7','#92400e'],[`🔘`,p['Neumático'],'#ede9fe','#5b21b6'],[`🔋`,p.Batería,'#dbeafe','#1e40af']].map(([ic,v,bg,col])=>
          v>0&&e('div',{key:ic,style:{background:bg,borderRadius:8,padding:'8px',textAlign:'center'}},
            e('div',{style:{fontSize:'.75rem',color:col,marginBottom:2}},ic),

    ),

    // ── REPORTE ──
    subTab==='historial'&&e('div',null,
      e('div',{style:{display:'flex',gap:8,marginBottom:10}},
        e('input',{className:'inp',style:{flex:1},placeholder:'🔍 Buscar…',value:q,onChange:ev=>setQ(ev.target.value)}),
        e('button',{onClick:()=>{
          if(typeof XLSX==='undefined')return;
          const rows=data.map(f=>({'N° Factura':f.n_factura,'Cliente':f.cliente,'RUT':f.rut,'Fecha':f.fecha_factura,'Vencimiento':getVenc(f),'Monto':f.monto,'Estado':getEstadoFact(f),'Pagada':f.pagada?'Sí':'No','Fecha Pago':f.fecha_pago||'','Monto Pagado':f.monto_pagado||0,'Concepto':f.concepto||'','Creado por':f.creado_por||''}));
          const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Historial');
          XLSX.writeFile(wb,'DITrucks_Historial_Facturas_'+new Date().toISOString().split('T')[0]+'.xlsx');
        },style:{padding:'.7rem 1rem',background:'#16a34a',color:'white',border:'none',borderRadius:10,fontWeight:600,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},'📥 Excel')
      ),
      e('div',{style:{fontSize:'.82rem',color:'#64748b',marginBottom:8}},data.length+' facturas registradas'),
      loadingF?e('div',{style:{textAlign:'center',padding:40,color:'#94a3b8'}},'Cargando…')
      :data.filter(f=>{const sq=q.toLowerCase();return !sq||[f.cliente,f.n_factura,f.concepto,f.rut].some(v=>(v||'').toLowerCase().includes(sq));})
        .map((f,i)=>{
          const est=getEstadoFact(f);
          return e('div',{key:f.id,className:'card',style:{marginBottom:8,borderLeft:'4px solid',borderLeftColor:est==='vencida'?'#ef4444':est==='proxima'?'#f59e0b':est==='pagada'?'#10b981':'#3b82f6'}},
            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}},
              e('div',{style:{flex:1,minWidth:0}},
                e('div',{style:{fontWeight:600,fontSize:'.88rem',marginBottom:2}},f.cliente),
                e('div',{style:{fontSize:'.78rem',color:'#64748b'}},'N° '+f.n_factura+' · '+f.fecha_factura+' · Vence: '+getVenc(f)+(f.concepto?' · '+f.concepto:''))
              ),
              e('div',{style:{display:'flex',alignItems:'center',gap:10,flexShrink:0}},
                e('div',{style:{textAlign:'right'}},
                  e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.92rem'}},fCLP(f.monto)),
                  e(EstadoBadge,{f})
                ),
                (isOwner||f.creado_por===user.nombre)&&e('button',{
                  onClick:()=>delF(f.id),
                  style:{background:'none',border:'1.5px solid #fee2e2',borderRadius:8,color:'#ef4444',cursor:'pointer',padding:'4px 10px',fontSize:'.8rem',fontWeight:600,fontFamily:'Geist,sans-serif',whiteSpace:'nowrap'}
                },'🗑️ Borrar')
              )
            )
          );
        })
    ),
    subTab==='reporte'&&e('div',null,
      e('div',{className:'card',style:{marginBottom:12}},
        e('div',{style:{fontWeight:700,marginBottom:12}},'🔍 Filtros'),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
          e('div',null,e('label',{className:'lbl'},'Cliente'),
            e('select',{className:'inp',value:rCliente,onChange:ev=>setRCliente(ev.target.value),style:{cursor:'pointer'}},
              clientesDisp.map(c=>e('option',{key:c,value:c},c===''?'Todos':c))
            )
          ),
          e('div',null,e('label',{className:'lbl'},'Estado'),
            e('select',{className:'inp',value:rEstado,onChange:ev=>setREstado(ev.target.value),style:{cursor:'pointer'}},
              [['','Todos'],['vencida','🔴 Vencidas'],['proxima','⚠️ Por vencer'],['vigente','🔵 Vigentes'],['pagada','✅ Pagadas']].map(([v,l])=>e('option',{key:v,value:v},l))
            )
          )
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          e('div',null,e('label',{className:'lbl'},'Desde'),e('input',{className:'inp',type:'date',value:rDesde,onChange:ev=>setRDesde(ev.target.value)})),
          e('div',null,e('label',{className:'lbl'},'Hasta'),e('input',{className:'inp',type:'date',value:rHasta,onChange:ev=>setRHasta(ev.target.value)}))
        )
      ),
      e('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}},
        ...[[`💵 Pendiente`,fCLP(rTots.pendiente),'#dbeafe','#1e40af'],[`🔴 Vencido`,fCLP(rTots.vencido),'#fee2e2','#991b1b'],[`✅ Cobrado`,fCLP(rTots.cobrado),'#d1fae5','#065f46'],[`📄 Facturas`,rTots.n+' docs','#f8fafc','#0A1929'],[`💰 Total emitido`,fCLP(rTots.total),'#f1f5f9','#475569'],[`📊 % Cobrado`,rTots.total>0?Math.round(rTots.cobrado/rTots.total*100)+'%':'0%','#f0fdf4','#065f46']].map(([l,v,bg,col])=>
          e('div',{key:l,style:{background:bg,borderRadius:10,padding:'12px',border:'1px solid #e2e8f0'}},
            e('div',{style:{fontSize:'.72rem',color:col,fontWeight:600,marginBottom:2}},l),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'1rem'}},v)
          )

      ),
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},

            const diasTxt=f.pagada?'Pagado':est==='vencida'?'-'+Math.abs(dias)+'d':'+'+dias+'d';

// ── APP ──
function App(){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('nuevo');
  const [tramos,setTramos]=useState([]);
  const isOwner=user?.rol==='owner';
  useEffect(()=>{if(user)api.get().then(setTramos);},[user]);
  if(!user)return e(Login,{onLogin:u=>{setUser(u);setTab('nuevo');}});
  const tabs=[{id:'nuevo',l:'➕ Nuevo tramo'},{id:'lista',l:'📋 Tramos'},{id:'disponible',l:'📍 Disponibilidad'},{id:'mant',l:'🔧 Mantención'},{id:'facturas',l:'📄 Facturas'},...(isOwner?[{id:'eficiencia',l:'📊 Eficiencia'},{id:'reportes',l:'📋 Por cliente'},{id:'gastos',l:'💰 Gastos mant.'}]:[])];
  return e('div',{style:{minHeight:'100vh',background:'#F0F4F8'}},
    e('header',{style:{background:'white',borderBottom:'1px solid #e2e8f0',position:'sticky',top:0,zIndex:40}},
      e('div',{style:{maxWidth:640,margin:'0 auto',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('span',{style:{fontSize:20}},'🚛'),
          e('span',{style:{fontWeight:700,fontSize:'1.1rem',background:'linear-gradient(135deg,#00BCD4,#0097A7)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}},'DITrucks · Tramos')
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:10}},
          e('span',{style:{fontSize:'.85rem',color:'#64748b'}},user.nombre),
          e('button',{onClick:()=>setUser(null),style:{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},'Salir')
        )
      ),
      e('div',{style:{maxWidth:640,margin:'0 auto',padding:'0 16px',display:'flex',gap:2}},
        ...tabs.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{padding:'10px 14px',border:'none',background:'transparent',borderBottom:'2px solid '+(tab===t.id?'#00BCD4':'transparent'),color:tab===t.id?'#0097A7':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',transition:'all .15s',fontFamily:'Geist,sans-serif'}},t.l))
      )
    ),
    e('main',{style:{maxWidth:640,margin:'0 auto',padding:'20px 16px'}},
      tab==='nuevo'&&e(NuevoTramo,{user,tramos,onSaved:()=>{api.get().then(setTramos);setTab('lista');}}),
      tab==='lista'&&e(ListaTramos,{user,isOwner}),
      tab==='eficiencia'&&isOwner&&e(Eficiencia),
      tab==='disponible'&&e(Disponibilidad,{tramos}),
      tab==='mant'&&e(Mantencion,{user,isOwner}),
      tab==='facturas'&&e(ModuloFacturas,{user,isOwner}),
      tab==='reportes'&&isOwner&&e(ReportesClientes),
      tab==='gastos'&&isOwner&&e(ReporteMant)
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
