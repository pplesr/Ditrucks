const haversine = (a,b) => {
  const R=6371,rad=d=>d*Math.PI/180,dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);
  const x=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.3);
};
const kmVacio = (a,b) => {
  if(!a||!b||a===b) return {km:0,costo:0};
  const ca=CC[a],cb=CC[b]; if(!ca||!cb) return {km:0,costo:0};
  const km=haversine(ca,cb);
  const rs=[...ROUTES.filter(r=>r.or===a||r.de===a),...ROUTES.filter(r=>r.or===b||r.de===b)];
  const cpkm=rs.length?rs.reduce((s,r)=>s+(r.k>0?r.c/r.k:700),0)/rs.length:700;
  return {km,costo:Math.round(km*cpkm)};
};

// ── TRAMOS: NUEVO ──
const NuevoTramo = ({user,tramos,onSaved}) => {
  const ef=()=>({pat:'',cl:'',or:'',de:'',fechaCarga:today(),horaCarga:nowT(),fechaDesc:'',horaDesc:'',
    guia:'',clienteDest:'',ton:'',encarpe:false,encarpeM:'',lavado:false,lavadoM:'',
    estadia:false,estadiaM:'',rechazada:false,rechazadaM:'',obs:''});
  const [f,setF]=useState(ef());
  const [saving,setSaving]=useState(false);
  const [ok,setOk]=useState(false);
  const s=ch=>setF(p=>({...p,...ch}));
  const route=findR(f.cl,f.or,f.de);
  const tarifa=route?(route.ton?(Number(f.ton)||0)*route.ton:route.t):0;
  const costo=(route?.c||0)+(f.encarpe?Number(f.encarpeM||0):0)+(f.lavado?Number(f.lavadoM||0):0);
  const extras=(f.estadia?Number(f.estadiaM||0):0)+(f.rechazada?Number(f.rechazadaM||0):0);
  const util=tarifa+extras-costo;
  const truck=TRUCKS.find(t=>t.p===f.pat);

  const prevTramo=useMemo(()=>{
    if(!f.pat) return null;
    return tramos.filter(t=>t.pat===f.pat).sort((a,b)=>b.created_at-a.created_at)[0]||null;
  },[f.pat,tramos]);
  const vacio=useMemo(()=>{
    if(!prevTramo||!f.or) return null;
    if(prevTramo.de===f.or) return null;
    return kmVacio(prevTramo.de,f.or);
  },[prevTramo,f.or]);

  const save=async()=>{
    if(!f.pat||!f.cl||!f.or||!f.de){alert('Completa Camión, Cliente, Origen y Destino');return;}
    setSaving(true);
    await api.addTramo({...f,id:Date.now().toString(),created_at:Date.now(),creado_por:user.nombre,
      km_vacio:vacio?.km||0,costo_vacio:vacio?.costo||0,ciudad_vacio_desde:vacio?prevTramo.de:''});
    setSaving(false);setOk(true);setF(ef());
    setTimeout(()=>{setOk(false);onSaved&&onSaved();},2000);
  };

  return (
    <div style={{maxWidth:600,margin:'0 auto',paddingBottom:48}}>
      {ok&&<div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:12,padding:14,color:'#166534',fontWeight:600,textAlign:'center',marginBottom:16}}>✅ Tramo registrado</div>}

      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:12}}>🚛 Camión</div>
        <DD label="Patente" req opts={TRUCKS.map(t=>t.p)} val={f.pat} onChange={v=>s({pat:v})} ph="Seleccionar"/>
        {truck&&<div style={{marginTop:8,padding:'8px 12px',background:'#f8fafc',borderRadius:8,fontSize:'.85rem',color:'#475569'}}>
          👤 <strong>{truck.c}</strong>{truck.a&&<> · 🔗 {truck.a}</>}
        </div>}
        {vacio&&vacio.km>0&&<div style={{marginTop:10,padding:'10px 12px',background:'#f5f3ff',border:'1.5px solid #ddd6fe',borderRadius:10,fontSize:'.85rem',color:'#5b21b6'}}>
          🛣️ Tramo vacío detectado: <strong>{prevTramo.de} → {f.or}</strong> · <strong>{vacio.km} km</strong> · costo estimado <strong>{fCLP(vacio.costo)}</strong>
        </div>}
      </div>

      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:12}}>📍 Ruta</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
          <DD label="Cliente" req opts={clients()} val={f.cl} onChange={v=>s({cl:v,or:'',de:''})} ph="Cliente"/>
          <DD label="Origen" req opts={f.cl?origins(f.cl):[]} val={f.or} onChange={v=>s({or:v,de:''})} ph="Origen" disabled={!f.cl}/>
          <DD label="Destino" req opts={(f.cl&&f.or)?dests(f.cl,f.or):[]} val={f.de} onChange={v=>s({de:v})} ph="Destino" disabled={!f.or}/>
        </div>
        {route&&<div style={{background:'#e0f7fa',borderRadius:8,padding:'8px 12px',fontSize:'.82rem',color:'#006064',display:'flex',gap:12,flexWrap:'wrap',marginBottom:10}}>
          <span>📍 <strong>{route.k} km</strong></span>
          {route.t>0&&<span>💰 <strong>{fCLP(route.t)}</strong></span>}
          {route.ton&&<span>⚖️ <strong>{route.ton} $/ton</strong></span>}
          <span>⛽ <strong>{fCLP(route.c)}</strong></span>
        </div>}
        {route?.ton&&<div style={{marginBottom:10}}>
          <label style={{display:'block',fontSize:'.85rem',fontWeight:600,color:'#475569',marginBottom:6}}>Toneladas</label>
          <input className="inp" type="number" value={f.ton} onChange={e=>s({ton:e.target.value})} placeholder="Ej: 28"/>
        </div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:8}}>
          {[['Fecha carga','date',f.fechaCarga,'fechaCarga'],['Hora carga','time',f.horaCarga,'horaCarga'],
            ['Fecha descarga','date',f.fechaDesc,'fechaDesc'],['Hora descarga','time',f.horaDesc,'horaDesc']].map(([l,t,v,k])=>(
            <div key={k}>
              <label style={{display:'block',fontSize:'.78rem',fontWeight:600,color:'#475569',marginBottom:4}}>{l}{k==='fechaDesc'&&!v&&<span style={{marginLeft:4,fontSize:'.7rem',background:'#fef3c7',color:'#92400e',padding:'1px 5px',borderRadius:4}}>Pendiente</span>}</label>

            </div>
          ))}
        </div>
        {f.fechaCarga&&f.fechaDesc&&(()=>{const d=Math.round((new Date(f.fechaDesc)-new Date(f.fechaCarga))/86400000);return d>=0&&<div style={{fontSize:'.82rem',color:'#64748b',marginTop:6}}>⏱️ {d} día{d!==1?'s':''} de tránsito</div>;})()}
        <div style={{marginTop:10}}>
          <label style={{display:'block',fontSize:'.85rem',fontWeight:600,color:'#475569',marginBottom:6}}>

          </label>
          <input className="inp" type="text" value={f.guia} onChange={e=>s({guia:e.target.value})} placeholder="Número de guía"/>
        </div>
      </div>

      <div className="card" style={{marginBottom:12}}>
        <div style={{fontWeight:700,marginBottom:12}}>➕ Extras</div>

          <div key={k} style={{marginBottom:8,padding:'10px 12px',borderRadius:10,border:'1.5px solid',borderColor:f[k]?'#a5f3fc':'#f1f5f9',background:f[k]?'#e0f7fa':'#f8fafc'}}>

              <input type="checkbox" checked={f[k]||false} onChange={e=>s({[k]:e.target.checked})} style={{width:16,height:16,accentColor:'#00BCD4'}}/>
              {l}
            </label>
            {f[k]&&<input className="inp" type="number" placeholder="Monto ($)" value={f[m]||''} onChange={e=>s({[m]:e.target.value})} style={{marginTop:8}}/>}
          </div>
        ))}
      </div>

      {route&&<div className="dark-panel" style={{marginBottom:16}}>
        <div style={{fontWeight:700,marginBottom:12}}>💰 Resumen del tramo</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,textAlign:'center'}}>
          {[['Ingreso',fCLP(tarifa+extras),'#6ee7b7'],['Costo',fCLP(costo),'#fca5a5'],['Utilidad',fCLP(util),util>=0?'#6ee7b7':'#fca5a5']].map(([l,v,col])=>(
            <div key={l} style={{background:'rgba(255,255,255,.1)',borderRadius:10,padding:10}}>
              <div style={{fontSize:'.75rem',color:'rgba(255,255,255,.6)',marginBottom:4}}>{l}</div>
              <div style={{fontFamily:'monospace',fontWeight:700,color:col}}>{v}</div>

// ── REPORTES ──
const Reportes = () => {
  const [tramos,setTramos]=useState([]);
  const [period,setPeriod]=useState('month');
  const [patFil,setPatFil]=useState('todos');
  useEffect(()=>{api.getTramos().then(setTramos);},[]);

  const now=new Date();
  const fil=useMemo(()=>{
    const days={week:7,month:30,quarter:90,all:9999}[period];
    const cut=new Date(now-days*86400000);
    return tramos.filter(t=>new Date(t.fechaCarga||t.created_at)>=cut);
  },[tramos,period]);

  const byTracto=useMemo(()=>{
    const m={};
    fil.forEach(t=>{
      if(!t.pat)return;
      if(!m[t.pat])m[t.pat]={pat:t.pat,cond:TRUCKS.find(x=>x.p===t.pat)?.c||'—',n:0,ing:0,cos:0,kmC:0,kmV:0,cosV:0,sinGuia:0};
      const r=findR(t.cl,t.or,t.de);
      const tarifa=r?(r.ton?(Number(t.ton)||0)*r.ton:r.t):0;
      const costo=(r?.c||0)+(t.encarpe?Number(t.encarpeM||0):0)+(t.lavado?Number(t.lavadoM||0):0);
      const extras=(t.estadia?Number(t.estadiaM||0):0)+(t.rechazada?Number(t.rechazadaM||0):0);
      const p=m[t.pat];
      p.n++;p.ing+=tarifa+extras;p.cos+=costo+(t.costo_vacio||0);
      p.kmC+=r?.k||0;p.kmV+=t.km_vacio||0;p.cosV+=t.costo_vacio||0;
      if(!t.guia)p.sinGuia++;
    });
    return Object.values(m).sort((a,b)=>(b.ing-b.cos)-(a.ing-a.cos));
  },[fil]);

  const src=patFil==='todos'?byTracto:byTracto.filter(p=>p.pat===patFil);
  const tot=src.reduce((a,p)=>({n:a.n+p.n,ing:a.ing+p.ing,cos:a.cos+p.cos,kmC:a.kmC+p.kmC,kmV:a.kmV+p.kmV}),{n:0,ing:0,cos:0,kmC:0,kmV:0});
  const util=tot.ing-tot.cos;
  const pctV=tot.kmC+tot.kmV>0?Math.round(tot.kmV/(tot.kmC+tot.kmV)*100):0;

  return (
    <div style={{maxWidth:600,margin:'0 auto',paddingBottom:48}}>
      <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        {[['week','7d'],['month','30d'],['quarter','90d'],['all','Todo']].map(([v,l])=>(
          <button key={v} onClick={()=>setPeriod(v)} style={{padding:'6px 14px',borderRadius:8,border:'1.5px solid',borderColor:period===v?'#0A1929':'#e2e8f0',background:period===v?'#0A1929':'white',color:period===v?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem'}}>{l}</button>
        ))}
      </div>
      {byTracto.length>1&&<div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}}>
        {['todos',...byTracto.map(p=>p.pat)].map(p=>(
          <button key={p} onClick={()=>setPatFil(p)} style={{flexShrink:0,padding:'4px 10px',borderRadius:8,border:'1.5px solid',borderColor:patFil===p?'#0A1929':'#e2e8f0',background:patFil===p?'#0A1929':'white',color:patFil===p?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.8rem'}}>{p==='todos'?'Todos':p}</button>
        ))}
      </div>}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        {[['🚛 Tramos',tot.n],['💵 Ingresos',fCLP(tot.ing)],[`📈 Utilidad`,fCLP(util)],[`🛣️ Km vacíos`,tot.kmV.toLocaleString()+` (${pctV}%)`]].map(([l,v])=>(
          <div key={l} className="card" style={{padding:'14px'}}>
            <div style={{fontSize:'.8rem',color:'#64748b',marginBottom:4}}>{l}</div>
            <div style={{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem'}}>{v}</div>
          </div>
        ))}
      </div>

      {tot.kmC+tot.kmV>0&&<div className="card" style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'#64748b',marginBottom:6}}>
          <span>📍 {tot.kmC.toLocaleString()} km cargado</span>
          <span>🛣️ {tot.kmV.toLocaleString()} km vacío</span>
        </div>
        <div style={{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}}>
          {tot.kmC>0&&<div style={{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:`${100-pctV}%`}}/>}
          {tot.kmV>0&&<div style={{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:`${pctV}%`}}/>}
        </div>
        <div style={{textAlign:'center',fontSize:'.75rem',color:'#94a3b8',marginTop:4}}>Eficiencia: {100-pctV}% cargado</div>
      </div>}

      {src.map(p=>{
        const u=p.ing-p.cos;
        const pv=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
        return (
          <div key={p.pat} className="card" style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:10}}>
              <div>
                <div style={{fontFamily:'monospace',fontWeight:700}}>{p.pat}</div>
                <div style={{fontSize:'.82rem',color:'#64748b'}}>👤 {p.cond}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontFamily:'monospace',fontWeight:700,color:u>=0?'#059669':'#dc2626'}}>{fCLP(u)}</div>
                <div style={{fontSize:'.75rem',color:'#94a3b8'}}>{p.n} tramo{p.n!==1?'s':''}</div>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}}>
              {[['Ingresos',fCLP(p.ing),'#f0fdf4','#166534'],['Costos',fCLP(p.cos),'#fef2f2','#991b1b'],['Km vacío',p.kmV.toLocaleString(),'#f5f3ff','#5b21b6']].map(([l,v,bg,col])=>(
                <div key={l} style={{background:bg,borderRadius:8,padding:'8px',textAlign:'center'}}>
                  <div style={{fontSize:'.72rem',color:col,marginBottom:2}}>{l}</div>
                  <div style={{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',height:6,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginBottom:4}}>
              {p.kmC>0&&<div style={{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:`${100-pv}%`}}/>}
              {p.kmV>0&&<div style={{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:`${pv}%`}}/>}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'#94a3b8'}}>
              <span>{p.kmC.toLocaleString()} km cargado</span><span>{pv}% vacío</span>
            </div>
            {p.sinGuia>0&&<div style={{marginTop:8,fontSize:'.78rem',background:'#fffbeb',color:'#92400e',borderRadius:6,padding:'6px 10px'}}>⚠️ {p.sinGuia} tramo{p.sinGuia!==1?'s':''} sin guía</div>}
          </div>
        );
      })}
      {src.length===0&&<div className="card" style={{textAlign:'center',padding:48,color:'#94a3b8'}}>📊 Sin datos para el período</div>}
    </div>
  );
};

// ── APP ──
const App = () => {
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('nuevo');
  const [tramos,setTramos]=useState([]);
  const isOwner=user?.rol==='owner';

  useEffect(()=>{if(user)api.getTramos().then(setTramos);},[user]);

  if(!user) return <Login onLogin={u=>{setUser(u);setTab('nuevo');}}/>;

  const tabs=[
    {id:'nuevo',l:'➕ Nuevo tramo'},
    {id:'lista',l:'📋 Tramos'},
    ...(isOwner?[{id:'reportes',l:'📊 Eficiencia'}]:[]),
  ];

  return (
    <div style={{minHeight:'100vh',background:'#F0F4F8'}}>
      <header style={{background:'white',borderBottom:'1px solid #e2e8f0',position:'sticky',top:0,zIndex:40}}>
        <div style={{maxWidth:640,margin:'0 auto',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:20}}>🚛</span>
            <span style={{fontWeight:700,fontSize:'1.1rem',background:'linear-gradient(135deg,#00BCD4,#0097A7)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>DITrucks · Tramos</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:'.85rem',color:'#64748b'}}>{user.nombre}</span>
            <button onClick={()=>setUser(null)} style={{background:'none',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'.85rem'}}>Salir</button>
          </div>
        </div>
        <div style={{maxWidth:640,margin:'0 auto',padding:'0 16px',display:'flex',gap:2}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'10px 14px',border:'none',background:'transparent',borderBottom:`2px solid ${tab===t.id?'#00BCD4':'transparent'}`,color:tab===t.id?'#0097A7':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',transition:'all .15s'}}>{t.l}</button>
          ))}
        </div>
      </header>

      <main style={{maxWidth:640,margin:'0 auto',padding:'20px 16px'}}>
        {tab==='nuevo'&&<NuevoTramo user={user} tramos={tramos} onSaved={()=>{api.getTramos().then(setTramos);setTab('lista');}}/>}
        {tab==='lista'&&<ListaTramos user={user} isOwner={isOwner}/>}
        {tab==='reportes'&&isOwner&&<Reportes/>}
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
