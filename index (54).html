// ── FACTURAS ──
function Facturas({user}){
  const [facts,setFacts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [guardando,setGuardando]=useState(false);
  const [tab,setTab]=useState('vigente');
  const [form,setForm]=useState(null);
  const [filtCliente,setFiltCliente]=useState('');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [sf,setSf]=useState({cliente:'',rut:'',n_factura:'',fecha_factura:today(),monto:'',plazo:30,concepto:'Fletes',observaciones:''});
  const loadF=async()=>{setLoading(true);const d=await api.getFact();setFacts(d);setLoading(false);};
  useEffect(()=>{loadF();},[]);

  const clientesDisp=useMemo(()=>['',...new Set(facts.map(f=>f.cliente).filter(Boolean))].sort(),[facts]);

  const factsBase=useMemo(()=>facts.filter(f=>{
    if(filtCliente&&f.cliente!==filtCliente)return false;
    if(filtDesde&&(f.fecha_factura||'')<filtDesde)return false;
    if(filtHasta&&(f.fecha_factura||'')>filtHasta)return false;
    return true;
  }),[facts,filtCliente,filtDesde,filtHasta]);

  const porEstado=useMemo(()=>{
    const m={vigente:[],proxima:[],vencida:[],pagada:[]};
    factsBase.forEach(f=>{const s=getEstadoFact(f);if(m[s])m[s].push(f);});
    return m;
  },[factsBase]);

  const lista=tab==='todas'?factsBase:porEstado[tab]||[];

  // Resumen cobro
  const resumen=useMemo(()=>factsBase.reduce((a,f)=>{
    const est=getEstadoFact(f);
    a.total+=f.monto||0;
    if(est==='pagada')a.pagado+=f.monto||0;
    else if(est==='vencida')a.vencido+=f.monto||0;
    else a.pendiente+=f.monto||0;
    return a;
  },{total:0,pagado:0,vencido:0,pendiente:0}),[factsBase]);

  const guardarFact=async()=>{
    if(guardando)return; // evita doble envío
    if(!sf.concepto||!sf.monto){alert('Completa concepto y monto');return;}
    // Aviso si ya existe una factura con el mismo número y cliente
    if(sf.n_factura){
      const dup=facts.find(f=>(f.n_factura||f.numero||'')===sf.n_factura&&(f.cliente||'')===(sf.cliente||''));
      if(dup&&!confirm('⚠️ Ya existe una factura N° '+sf.n_factura+' para '+(sf.cliente||'este cliente')+'.\n\n¿Deseas guardarla de todas formas?'))return;
    }
    setGuardando(true);
    try{
      const ok=await api.addFact({
        id:Date.now().toString(),created_at:Date.now(),creado_por:user?.nombre||'',
        cliente:sf.cliente||'',rut:sf.rut||'',n_factura:sf.n_factura||'',
        fecha_factura:sf.fecha_factura,monto:Number(sf.monto),plazo:Number(sf.plazo)||30,
        concepto:sf.concepto,observaciones:sf.observaciones||'',
        pagada:false,fecha_pago:'',monto_pagado:0
      });
      if(ok){setForm(null);setSf({cliente:'',rut:'',n_factura:'',fecha_factura:today(),monto:'',plazo:30,concepto:'Fletes',observaciones:''});loadF();}
      else alert('Error al guardar. Intenta de nuevo.');
    }finally{
      setGuardando(false);
    }
  };

  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=lista.map(f=>{
      const est=getEstadoFact(f);
      const venc=getVenc(f);
      const dias=getDias(f);
      return{
        'Cliente':f.cliente,'RUT':f.rut||'','N° Factura':f.numero,
        'Fecha Factura':f.fecha_factura,'Fecha Vencimiento':venc,
        'Plazo (días)':f.plazo||30,'Monto':f.monto||0,
        'Estado':est==='pagada'?'Pagada':est==='vencida'?'Vencida':est==='proxima'?'Por vencer':'Vigente',
        'Días al vencimiento':dias!==null?dias:'—',
        'Fecha Pago':f.fecha_pago||'',
        'Descripción':f.descripcion||''
      };
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Facturas');
    XLSX.writeFile(wb,'DITrucks_Facturas_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',null,
    // Modal nueva factura
    form&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},
      e('div',{className:'card si',style:{width:'100%',maxWidth:480,maxHeight:'90vh',overflowY:'auto'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
          e('strong',null,'Nueva Factura'),
          e('button',{onClick:()=>setForm(null),style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#94a3b8'}},'×')
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          e('div',{style:{gridColumn:'1/-1'}},
            e('label',{className:'lbl'},'Cliente'),
            e('select',{className:'inp',value:sf.cliente,onChange:ev=>{const c=CLIENTES_FACT.find(x=>x.n===ev.target.value);setSf(p=>({...p,cliente:ev.target.value,rut:c?.r||'',plazo:c?.p||30}));},style:{cursor:'pointer'}},
              e('option',{value:''},'Seleccionar cliente…'),
              ...CLIENTES_FACT.map(c=>e('option',{key:c.n,value:c.n},c.n))
            )
          ),
          F('RUT',e('input',{className:'inp',value:sf.rut,onChange:ev=>setSf(p=>({...p,rut:ev.target.value})),placeholder:'76.xxx.xxx-x'})),
          F('N° Factura',e('input',{className:'inp',value:sf.n_factura,onChange:ev=>setSf(p=>({...p,n_factura:ev.target.value})),placeholder:'Ej: 2325'})),
          F('Fecha Factura',e('input',{className:'inp',type:'date',value:sf.fecha_factura,onChange:ev=>setSf(p=>({...p,fecha_factura:ev.target.value}))})),
          F('Monto ($)',e('input',{className:'inp',type:'number',value:sf.monto,onChange:ev=>setSf(p=>({...p,monto:ev.target.value})),placeholder:'Ej: 1500000'})),
          F('Plazo (días)',e('input',{className:'inp',type:'number',value:sf.plazo,onChange:ev=>setSf(p=>({...p,plazo:ev.target.value}))})),
          F('Concepto',e('input',{className:'inp',value:sf.concepto,onChange:ev=>setSf(p=>({...p,concepto:ev.target.value})),placeholder:'Ej: Fletes'})),
          e('div',{style:{gridColumn:'1/-1'}},F('Observaciones',e('textarea',{className:'inp',rows:2,value:sf.observaciones,onChange:ev=>setSf(p=>({...p,observaciones:ev.target.value})),placeholder:'Detalle adicional…'})))
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}},
          e('button',{onClick:()=>setForm(null),style:{padding:'.75rem',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',cursor:'pointer',fontWeight:500,fontFamily:'Geist,sans-serif'}},'Cancelar'),
          e('button',{className:'btn',onClick:guardarFact,disabled:guardando,style:{opacity:guardando?0.6:1,cursor:guardando?'not-allowed':'pointer'}},guardando?'Guardando…':'Guardar')
        )
      )
    ),

    // Filtros
    e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:0}},
        e('div',null,
          e('label',{className:'lbl'},'Cliente'),
          e('select',{className:'inp',value:filtCliente,onChange:ev=>setFiltCliente(ev.target.value),style:{cursor:'pointer',fontSize:'.82rem',padding:'.5rem .75rem'}},
            clientesDisp.map(c=>e('option',{key:c,value:c},c===''?'Todos':c))
          )
        ),
        e('div',null,e('label',{className:'lbl'},'Desde'),e('input',{className:'inp',type:'date',value:filtDesde,onChange:ev=>setFiltDesde(ev.target.value),style:{fontSize:'.82rem',padding:'.5rem .75rem'}})),
        e('div',null,e('label',{className:'lbl'},'Hasta'),e('input',{className:'inp',type:'date',value:filtHasta,onChange:ev=>setFiltHasta(ev.target.value),style:{fontSize:'.82rem',padding:'.5rem .75rem'}}))
      )
    ),

    // Resumen KPIs
    factsBase.length>0&&e('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:12}},
      ...[
        ['💰 Total',fCLP(resumen.total),'#f8fafc','#0A1929'],
        ['✅ Cobrado',fCLP(resumen.pagado),'#f0fdf4','#166534'],
        ['🔴 Vencido',fCLP(resumen.vencido),'#fef2f2','#991b1b'],
        ['⏳ Pendiente',fCLP(resumen.pendiente),'#fffbeb','#92400e'],

          e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}},v)
        )
      )
    ),

    // Tabs estado + botones acción
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}},
      e('div',{style:{display:'flex',gap:0,borderBottom:'2px solid #f1f5f9'}},
        ...['vigente','proxima','vencida','pagada','todas'].map(s=>
          e('button',{key:s,className:'tab-fact'+(tab===s?' tab-fact-active':''),onClick:()=>setTab(s)},

            +(s!=='todas'&&porEstado[s]?' ('+porEstado[s].length+')':'')
          )
        )

function Mantencion({user}){
  const [mants,setMants]=useState([]);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState(false);
  const [filtPat,setFiltPat]=useState('');
  const [filtTipo,setFiltTipo]=useState('');

    if(!mf.patente||!mf.tipo){alert('Completa Patente y Tipo');return;}
    const ok=await api.addMant({id:Date.now().toString(),created_at:Date.now(),...mf,costo:Number(mf.costo)||0});

            e('option',{value:''},'Seleccionar…'),

        F('Descripción',e('textarea',{className:'inp',rows:2,value:mf.descripcion,onChange:ev=>setMf(p=>({...p,descripcion:ev.target.value})),placeholder:'Detalle…'})),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          F('Fecha',e('input',{className:'inp',type:'date',value:mf.fecha,onChange:ev=>setMf(p=>({...p,fecha:ev.target.value}))})),

// ── RANKING EFICIENCIA ──
function Ranking(){
  const [tramos,setTramos]=useState([]);
  const [sel,setSel]=useState('m0');
  const [custom,setCustom]=useState({desde:'',hasta:''});
  const [grupo,setGrupo]=useState('todos');
  const [tipoFil,setTipoFil]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const rango=useMemo(()=>rangoPeriodo(sel,custom),[sel,custom]);

  const ranking=useMemo(()=>{
    const m={};
    const {desde,hasta}=rango;
    tramos.forEach(t=>{
      if(!t.patente)return;
      const f=t.fecha_carga||'';
      if(f<desde||f>hasta)return;
      if(grupo!=='todos'&&grupoPatente(t.patente)!==grupo)return;
      if(tipoFil!=='todos'&&tipoPatente(t.patente,t.fecha_carga)!==tipoFil)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',grupo:grupoPatente(t.patente),tipo:tipoPatente(t.patente,t.fecha_carga),n:0,util:0,kmC:0,kmV:0,ing:0,cos:0};
      const{tarifa,costo,extras}=calcT(t);
      const costoVacio=Number(t.costo_vacio||0);
      const p=m[t.patente];
      p.n++;
      if(p.grupo==='terceros'){
        const ingT=utilidadTercero(t);
        p.ing+=ingT;
        p.util+=ingT;
      }else{
        p.ing+=tarifa+extras;
        p.cos+=costo;
        p.util+=tarifa+extras-costo;
      }
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;
    });
    return Object.values(m).sort((a,b)=>b.util-a.util);
  },[tramos,rango,grupo,tipoFil]);

  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=ranking.map((p,i)=>({
      'Posición':i+1,'Patente':p.pat,'Conductor':p.cond,'Grupo':p.grupo==='terceros'?'Tercero':'Propio',
      'Tramos':p.n,'Utilidad':Math.round(p.util),'Ingresos':Math.round(p.ing),'Costos':Math.round(p.cos),
      'Km Cargado':p.kmC,'Km Vacío':p.kmV,'Km Total':p.kmC+p.kmV,
      '% Vacío':p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0
    }));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Ranking');
    XLSX.writeFile(wb,'DITrucks_Ranking_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',{style:{maxWidth:680,margin:'0 auto',paddingBottom:48}},
    // Filtros
    e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',gap:6,marginBottom:10}},
        ...['todos','propios','terceros'].map(g=>
          e('button',{key:g,onClick:()=>setGrupo(g),style:{padding:'5px 14px',borderRadius:8,border:'1.5px solid',borderColor:grupo===g?'#0097A7':'#e2e8f0',background:grupo===g?'#e0f7fa':'white',color:grupo===g?'#0097A7':'#64748b',fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},
            {todos:'🚛 Todos',propios:'🏠 Propios',terceros:'🤝 Terceros'}[g]
          )
        )
      ),
      e('div',{style:{display:'flex',gap:6,marginBottom:10}},
        ...['todos','estanque','plana'].map(tp=>
          e('button',{key:tp,onClick:()=>setTipoFil(tp),style:{padding:'5px 14px',borderRadius:8,border:'1.5px solid',borderColor:tipoFil===tp?'#7c3aed':'#e2e8f0',background:tipoFil===tp?'#f5f3ff':'white',color:tipoFil===tp?'#7c3aed':'#64748b',fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},
            {todos:'🔄 Todos',estanque:'🛢️ Estanque',plana:'🔩 Plana'}[tp]
          )
        )
      ),
      e(SelectorPeriodo,{sel,setSel,custom,setCustom})
    ),
    // Header
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
      e('div',{style:{fontSize:'.85rem',color:'#64748b'}},ranking.length+' camiones · ordenados por utilidad'),
      e('button',{onClick:exportExcel,style:{padding:'.4rem .9rem',background:'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'📥 Excel')
    ),
    // Lista
    ranking.length===0
      ?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'Sin datos para el período seleccionado')
      :ranking.map((p,i)=>{
        const pctV=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;

          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},

          e('div',{style:{display:'flex',height:5,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginTop:8}},
            p.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
            p.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
          )
        );
      })
  );
}

// Comprime una imagen (File) a JPEG pequeño en base64 para guardar en la base
const comprimirImagen=(file,maxLado=900,calidad=0.5)=>new Promise((resolve,reject)=>{
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>maxLado){h=h*maxLado/w;w=maxLado;}
      else if(h>maxLado){w=w*maxLado/h;h=maxLado;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      resolve(cv.toDataURL('image/jpeg',calidad));
    };
    img.onerror=reject;img.src=fr.result;
  };
  fr.onerror=reject;fr.readAsDataURL(file);
});

// ── FLUJO DE CAJA ──
const SALDO_INICIAL=83279889;
const CATEGORIAS_GASTO=['Combustible','Peajes','Sueldos','Mantención','Neumáticos','Seguros','Permisos','Arriendo','Servicios básicos','Impuestos','Repuestos','Lavado','Alimentación','Otro'];
const CATEGORIAS_INGRESO=['Cobro de fletes','Otro ingreso'];

function FlujoCaja({user}){
  const [movs,setMovs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [form,setForm]=useState(false);
  const [tipo,setTipo]=useState('gasto');// 'gasto' | 'ingreso'
  const [sf,setSf]=useState({concepto:'',categoria:'',monto:'',fecha:today(),nota:''});
  const [filtCat,setFiltCat]=useState('');
  const [filtTipo,setFiltTipo]=useState('todos');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [editSaldo,setEditSaldo]=useState(false);
  const [nuevoSaldo,setNuevoSaldo]=useState('');
  const [periodoSel,setPeriodoSel]=useState('actual'); // 'actual' | 'YYYY-MM'

  const load=async()=>{setLoading(true);const d=await apiFlujo.get();setMovs(d);setLoading(false);};
  useEffect(()=>{load();},[]);

  // Saldo actual = saldo inicial + ingresos - gastos
  const saldo=useMemo(()=>{
    const ajuste=movs.reduce((s,m)=>s+(m.tipo==='ingreso'?Number(m.monto||0):-Number(m.monto||0)),0);
    return SALDO_INICIAL+ajuste;
  },[movs]);

  // Filtrado
  const fil=useMemo(()=>movs.filter(m=>{
    if(filtTipo!=='todos'&&m.tipo!==filtTipo)return false;
    if(filtCat&&m.categoria!==filtCat)return false;
    if(filtDesde&&(m.fecha||'')<filtDesde)return false;
    if(filtHasta&&(m.fecha||'')>filtHasta)return false;
    return true;
  }),[movs,filtTipo,filtCat,filtDesde,filtHasta]);

  // Resumen categorías gastos
  const porCategoria=useMemo(()=>{
    const m={};
    movs.filter(x=>x.tipo==='gasto').forEach(x=>{
      const c=x.categoria||'Otro';
      if(!m[c])m[c]=0;
      m[c]+=Number(x.monto||0);
    });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  },[movs]);

  const totalGastos=movs.filter(m=>m.tipo==='gasto').reduce((s,m)=>s+Number(m.monto||0),0);
  const totalIngresos=movs.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+Number(m.monto||0),0);

  // Meses disponibles con movimientos
  const mesesConMov=useMemo(()=>{
    const s=new Set(movs.map(m=>(m.fecha||'').slice(0,7)).filter(Boolean));
    return [...s].sort().reverse();
  },[movs]);
  // Mes efectivo del resumen
  const mesResumen=periodoSel==='actual'?today().slice(0,7):periodoSel;
  // Resumen del período seleccionado
  const resumenPeriodo=useMemo(()=>{
    const delMes=movs.filter(m=>(m.fecha||'').slice(0,7)===mesResumen);
    const ing=delMes.filter(m=>m.tipo==='ingreso').reduce((s,m)=>s+Number(m.monto||0),0);
    const gas=delMes.filter(m=>m.tipo==='gasto').reduce((s,m)=>s+Number(m.monto||0),0);
    // Por categoría de gasto en el período
    const cat={};
    delMes.filter(m=>m.tipo==='gasto').forEach(m=>{const c=m.categoria||'Otro';cat[c]=(cat[c]||0)+Number(m.monto||0);});
    return {ingresos:ing,gastos:gas,neto:ing-gas,categorias:cat,n:delMes.length};
  },[movs,mesResumen]);
  // Análisis: items (categorías) que aumentaron >10% vs promedio de meses anteriores
  const aumentos=useMemo(()=>{
    const mesesPrevios=mesesConMov.filter(m=>m<mesResumen);
    if(mesesPrevios.length===0)return [];
    // Promedio por categoría en meses previos
    const acum={},cnt={};
    mesesPrevios.forEach(mes=>{
      const cat={};
      movs.filter(m=>m.tipo==='gasto'&&(m.fecha||'').slice(0,7)===mes).forEach(m=>{const c=m.categoria||'Otro';cat[c]=(cat[c]||0)+Number(m.monto||0);});
      Object.entries(cat).forEach(([c,v])=>{acum[c]=(acum[c]||0)+v;cnt[c]=(cnt[c]||0)+1;});
    });
    const res=[];
    Object.entries(resumenPeriodo.categorias).forEach(([c,actual])=>{
      const prom=cnt[c]?acum[c]/cnt[c]:0;
      if(prom>0){
        const varPct=(actual-prom)/prom*100;
        if(varPct>10)res.push({categoria:c,actual,promedio:prom,varPct});
      }
    });
    return res.sort((a,b)=>b.varPct-a.varPct);
  },[movs,mesesConMov,mesResumen,resumenPeriodo]);

  const [errMsg,setErrMsg]=useState('');
  const guardar=async()=>{
    if(!sf.concepto||!sf.monto||!sf.fecha){alert('Completa concepto, monto y fecha');return;}
    setErrMsg('');
    const res=await apiFlujo.add({
      id:Date.now().toString(),created_at:Date.now(),
      tipo,concepto:sf.concepto,categoria:sf.categoria||'Otro',
      monto:Number(sf.monto),fecha:sf.fecha,nota:sf.nota,
      creado_por:user?.nombre||''
    });
    if(res.ok){setForm(false);setSf({concepto:'',categoria:'',monto:'',fecha:today(),nota:''});load();}
    else setErrMsg('Error al guardar (HTTP '+res.status+'): '+(res.detail||'sin detalle')+'. Revisa que la tabla flujo_caja exista en Supabase.');
  };

  const maxGasto=porCategoria[0]?.[1]||1;

  return e('div',{style:{maxWidth:700,margin:'0 auto',paddingBottom:48}},

    // ── MODAL NUEVO MOVIMIENTO ──
    form&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},
      e('div',{className:'card si',style:{width:'100%',maxWidth:440,maxHeight:'90vh',overflowY:'auto'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
          e('strong',{style:{fontSize:'1rem'}},tipo==='gasto'?'💸 Registrar Gasto':'💵 Registrar Ingreso'),
          e('button',{onClick:()=>setForm(false),style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#94a3b8'}},'×')
        ),
        errMsg&&e('div',{style:{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:'10px 12px',color:'#991b1b',fontSize:'.8rem',marginBottom:14}},errMsg),
        // Tipo toggle
        e('div',{style:{display:'flex',gap:0,marginBottom:14,borderRadius:10,overflow:'hidden',border:'1.5px solid #e2e8f0'}},
          ...['gasto','ingreso'].map(t=>
            e('button',{key:t,onClick:()=>setTipo(t),style:{flex:1,padding:'8px',border:'none',background:tipo===t?(t==='gasto'?'#fef2f2':'#f0fdf4'):'white',color:tipo===t?(t==='gasto'?'#dc2626':'#16a34a'):'#94a3b8',fontWeight:700,cursor:'pointer',fontFamily:'Geist,sans-serif',fontSize:'.88rem',transition:'all .15s'}},
              t==='gasto'?'💸 Gasto':'💵 Ingreso')
          )
        ),
        e('div',{style:{display:'grid',gap:10}},
          e('div',null,
            e('label',{className:'lbl'},'Concepto *'),
            e('input',{className:'inp',value:sf.concepto,onChange:ev=>setSf(p=>({...p,concepto:ev.target.value})),placeholder:'Ej: Combustible camión RSCW-10'})
          ),
          tipo==='gasto'&&e('div',null,
            e('label',{className:'lbl'},'Categoría'),
            e('select',{className:'inp',value:sf.categoria,onChange:ev=>setSf(p=>({...p,categoria:ev.target.value})),style:{cursor:'pointer'}},
              e('option',{value:''},'Seleccionar categoría…'),
              ...CATEGORIAS_GASTO.map(c=>e('option',{key:c,value:c},c))
            )
          ),
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
            e('div',null,
              e('label',{className:'lbl'},'Monto ($) *'),
              e('input',{className:'inp',type:'number',value:sf.monto,onChange:ev=>setSf(p=>({...p,monto:ev.target.value})),placeholder:'0'})
            ),
            e('div',null,
              e('label',{className:'lbl'},'Fecha *'),
              e('input',{className:'inp',type:'date',value:sf.fecha,onChange:ev=>setSf(p=>({...p,fecha:ev.target.value}))})
            )
          ),
          e('div',null,
            e('label',{className:'lbl'},'Nota (opcional)'),
            e('input',{className:'inp',value:sf.nota,onChange:ev=>setSf(p=>({...p,nota:ev.target.value})),placeholder:'Ej: Factura 4521, patente BCDF-32'})
          )
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:14}},
          e('button',{onClick:()=>setForm(false),style:{padding:'.75rem',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',cursor:'pointer',fontWeight:500,fontFamily:'Geist,sans-serif'}},'Cancelar'),
          e('button',{className:'btn',onClick:guardar,style:{background:tipo==='gasto'?'#dc2626':'#16a34a'}},'Guardar')
        )
      )
    ),

    // ── SALDO PRINCIPAL ──
    e('div',{className:'card',style:{marginBottom:12,background:'linear-gradient(135deg,#0A1929,#1E3A5F)',border:'none',padding:20}},
      e('div',{style:{fontSize:'.8rem',color:'rgba(255,255,255,.6)',marginBottom:6}},'💰 Saldo actual cuenta corriente'),
      e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.8rem',color:saldo>=0?'#4ade80':'#f87171'}},
        fCLP(saldo)
      ),
      e('div',{style:{display:'flex',gap:16,marginTop:12}},
        e('div',null,
          e('div',{style:{fontSize:'.72rem',color:'rgba(255,255,255,.5)'}},'Saldo inicial'),
          e('div',{style:{fontSize:'.9rem',color:'rgba(255,255,255,.8)',fontFamily:'monospace'}},fCLP(SALDO_INICIAL))

        e('div',null,
          e('div',{style:{fontSize:'.72rem',color:'rgba(255,255,255,.5)'}},'▲ Ingresos'),
          e('div',{style:{fontSize:'.9rem',color:'#4ade80',fontFamily:'monospace'}},fCLP(totalIngresos))

        e('div',null,

          ),
          e('div',{style:{textAlign:'right',flexShrink:0,marginLeft:12}},
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1rem',color:m.tipo==='ingreso'?'#16a34a':'#dc2626'}},
              (m.tipo==='ingreso'?'+':'-')+fCLP(Number(m.monto))
            ),
            e('button',{onClick:async()=>{if(!confirm('¿Eliminar movimiento?'))return;await apiFlujo.del(m.id);load();},
              style:{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:'.73rem',fontFamily:'Geist,sans-serif',marginTop:4}},'🗑️ Eliminar')
          )
        )
      )
    )
  );
}

// ── CONTROL (Tablero de gestión) ──
function Control(){
  const [tramos,setTramos]=useState([]);
  const [period,setPeriod]=useState('month');
  const [sub,setSub]=useState('resumen');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const periodDays={week:7,month:30,quarter:90,all:9999};
  const days=periodDays[period];
  const cut=new Date(Date.now()-days*86400000);

  // Tramos del período con patente
  const enPeriodo=useMemo(()=>tramos.filter(t=>t.patente&&!esBaja(t.patente)&&new Date(t.fecha_carga||t.created_at)>=cut),[tramos,period]);

  // ── FUGAS: km vacíos, rechazos, estadías ──
  const fugas=useMemo(()=>{
    const porCamion={};
    let totVacioKm=0,totVacioCosto=0,totRechazo=0,totEstadia=0,totLavado=0,totEncarpe=0;
    enPeriodo.forEach(t=>{
      const p=t.patente;
      if(!porCamion[p])porCamion[p]={pat:p,cond:TRUCKS.find(x=>x.p===p)?.c||'—',kmV:0,costoV:0,kmC:0,rechazo:0,estadia:0,n:0};
      const c=porCamion[p];
      c.n++;
      c.kmV+=Number(t.km_vacio||0);
      c.costoV+=Number(t.costo_vacio||0);
      c.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      if(t.rechazada)c.rechazo+=Number(t.rechazada_monto||0);
      if(t.estadia)c.estadia+=Number(t.estadia_monto||0);
      totVacioKm+=Number(t.km_vacio||0);
      totVacioCosto+=Number(t.costo_vacio||0);
      if(t.rechazada)totRechazo+=Number(t.rechazada_monto||0);
      if(t.estadia)totEstadia+=Number(t.estadia_monto||0);
      if(t.lavado)totLavado+=Number(t.lavado_monto||0);
      if(t.encarpe)totEncarpe+=Number(t.encarpe_monto||0);
    });
    const lista=Object.values(porCamion).map(c=>({...c,pctV:c.kmC+c.kmV>0?Math.round(c.kmV/(c.kmC+c.kmV)*100):0})).sort((a,b)=>b.costoV-a.costoV);
    return {lista,totVacioKm,totVacioCosto,totRechazo,totEstadia,totLavado,totEncarpe};
  },[enPeriodo]);

  // ── RUTAS con más km vacío ──
  const rutasVacio=useMemo(()=>{
    const m={};
    enPeriodo.forEach(t=>{
      if(!t.km_vacio)return;
      const k=(t.ciudad_vacio_desde||'?')+' → '+(t.origen||'?');
      if(!m[k])m[k]={ruta:k,km:0,costo:0,n:0};
      m[k].km+=Number(t.km_vacio||0);
      m[k].costo+=Number(t.costo_vacio||0);
      m[k].n++;
    });
    return Object.values(m).sort((a,b)=>b.costo-a.costo).slice(0,8);
  },[enPeriodo]);

  // ── SEMÁFORO INACTIVIDAD ──
  const semaforo=useMemo(()=>{
    const hoy=new Date();hoy.setHours(0,0,0,0);
    // Umbral de rentabilidad proporcional al período: $3M en 30 días
    const umbralUtil=3000000*(Math.min(days,9999)/30);
    // Utilidad por camión en el período seleccionado
    const utilPeriodo={};
    enPeriodo.forEach(t=>{
      const {tarifa,costo,extras}=calcT(t);
      utilPeriodo[t.patente]=(utilPeriodo[t.patente]||0)+(tarifa+extras-costo);
    });
    const m={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      if(!m[t.patente])m[t.patente]=[];
      m[t.patente].push(t);
    });
    const result=TRUCKS.filter(truck=>!truck.baja).map(truck=>{
      const lista=(m[truck.p]||[]).sort((a,b)=>(b.created_at||0)-(a.created_at||0));
      const util=utilPeriodo[truck.p]||0;
      const rentable=util>=umbralUtil&&util>0;
      if(lista.length===0)return{pat:truck.p,cond:truck.c,estado:'sin_datos',dias:null,ultima:null,util};
      const ult=lista[0];
      // En tránsito: sin fecha_desc
      if(!ult.fecha_desc&&ult.destino)return{pat:truck.p,cond:truck.c,estado:'transito',dias:0,ultima:ult.destino,util};
      // Días hábiles desde la descarga
      if(ult.fecha_desc){
        let d=0;const cur=new Date(ult.fecha_desc+'T00:00:00');cur.setDate(cur.getDate()+1);
        while(cur<=hoy){if(esDiaHabil(cur))d++;cur.setDate(cur.getDate()+1);}
        // Si es altamente rentable en el período, marcar verde aunque tenga días detenido
        let estado=d===0?'verde':d<=2?'amarillo':'rojo';
        if(rentable&&estado!=='verde')estado='rentable';
        return{pat:truck.p,cond:truck.c,estado,dias:d,ultima:ult.destino,util};
      }
      return{pat:truck.p,cond:truck.c,estado:'sin_datos',dias:null,ultima:null,util};
    });
    return result.sort((a,b)=>(b.dias||0)-(a.dias||0));
  },[tramos,enPeriodo,days]);

  // ── BAJO RENDIMIENTO ──
  const bajoRend=useMemo(()=>{
    const porCamion={};
    enPeriodo.forEach(t=>{
      const p=t.patente;
      if(!porCamion[p])porCamion[p]={pat:p,cond:TRUCKS.find(x=>x.p===p)?.c||'—',util:0,kmC:0,kmV:0,n:0};
      const {tarifa,costo,extras}=calcT(t);
      const c=porCamion[p];
      c.n++;c.util+=tarifa+extras-costo;
      c.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      c.kmV+=Number(t.km_vacio||0);
    });
    return Object.values(porCamion).map(c=>({
      ...c,pctV:c.kmC+c.kmV>0?Math.round(c.kmV/(c.kmC+c.kmV)*100):0,
      alertas:[
        c.util<0?'Utilidad negativa':null,
        (c.kmC+c.kmV>0&&c.kmV/(c.kmC+c.kmV)>0.35)?'Exceso de km vacío':null,
      ].filter(Boolean)
    })).filter(c=>c.alertas.length>0).sort((a,b)=>a.util-b.util);
  },[enPeriodo]);

  // ── RESUMEN EJECUTIVO ──
  const resumen=useMemo(()=>{
    // Totales financieros del período
    let ing=0,cos=0,kmC=0,kmV=0;
    const utilPorCamion={};
    enPeriodo.forEach(t=>{
      const {tarifa,costo,extras}=calcT(t);
      ing+=tarifa+extras;cos+=costo;
      kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      kmV+=Number(t.km_vacio||0);
      utilPorCamion[t.patente]=(utilPorCamion[t.patente]||0)+(tarifa+extras-costo);
    });
    const util=ing-cos;
    const pctV=kmC+kmV>0?Math.round(kmV/(kmC+kmV)*100):0;
    const camionesActivos=Object.keys(utilPorCamion).length;
    const camionesRojos=semaforo.filter(s=>s.estado==='rojo').length;
    const camionesAmarillos=semaforo.filter(s=>s.estado==='amarillo').length;
    // Top y peor camión
    const ordenados=Object.entries(utilPorCamion).map(([pat,u])=>({pat,u,cond:TRUCKS.find(x=>x.p===pat)?.c||'—'})).sort((a,b)=>b.u-a.u);
    const mejor=ordenados[0];
    const peor=ordenados[ordenados.length-1];

    // HEALTH SCORE (0-100): combina rentabilidad, eficiencia de km y disponibilidad
    let score=100;
    // Penaliza % vacío (ideal <25%)
    if(pctV>25)score-=Math.min(30,(pctV-25)*1.2);
    // Penaliza camiones detenidos en rojo
    if(TRUCKS.length>0)score-=Math.min(30,(camionesRojos/TRUCKS.length)*100*0.6);
    // Penaliza utilidad negativa o baja
    const margen=ing>0?util/ing:0;
    if(margen<0.3)score-=Math.min(30,(0.3-margen)*100);
    score=Math.max(0,Math.round(score));
    const scoreColor=score>=75?'#16a34a':score>=50?'#f59e0b':'#dc2626';
    const scoreLabel=score>=75?'Saludable':score>=50?'Requiere atención':'Crítico';

    return {ing,cos,util,kmC,kmV,pctV,camionesActivos,camionesRojos,camionesAmarillos,mejor,peor,score,scoreColor,scoreLabel,margen:Math.round(margen*100),
      totVacioCosto:fugas.totVacioCosto,totRechazo:fugas.totRechazo,totEstadia:fugas.totEstadia,nAlertas:bajoRend.length};
  },[enPeriodo,semaforo,fugas,bajoRend]);

  const periodLabels={week:'7 días',month:'30 días',quarter:'90 días',all:'Todo'};

  return e('div',{style:{maxWidth:700,margin:'0 auto',paddingBottom:48}},
    // Selector período
    e('div',{style:{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}},
      ...Object.entries(periodLabels).map(([v,l])=>
        e('button',{key:v,onClick:()=>setPeriod(v),style:{padding:'6px 14px',borderRadius:8,border:'1.5px solid',borderColor:period===v?'#0A1929':'#e2e8f0',background:period===v?'#0A1929':'white',color:period===v?'white':'#64748b',fontWeight:500,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},l)
      )
    ),
    // Sub-tabs
    e('div',{style:{display:'flex',gap:0,marginBottom:16,borderBottom:'2px solid #f1f5f9',overflowX:'auto'}},
      ...[['resumen','📋 Resumen'],['fugas','💸 Fugas de eficiencia'],['semaforo','🚦 Semáforo inactividad'],['alertas','⚠️ Bajo rendimiento']].map(([s,l])=>
        e('button',{key:s,onClick:()=>setSub(s),style:{padding:'8px 14px',border:'none',borderBottom:'2px solid',borderBottomColor:sub===s?'#0097A7':'transparent',background:'none',color:sub===s?'#0097A7':'#64748b',fontWeight:sub===s?700:400,cursor:'pointer',fontSize:'.82rem',whiteSpace:'nowrap',fontFamily:'Geist,sans-serif'}},l)
      )
    ),

    // ═══ RESUMEN EJECUTIVO ═══
    sub==='resumen'&&e('div',null,
      // Health Score
      e('div',{className:'card',style:{marginBottom:12,padding:0,overflow:'hidden'}},
        e('div',{style:{display:'flex',alignItems:'stretch'}},
          e('div',{style:{background:resumen.scoreColor,color:'white',padding:'20px 24px',display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',minWidth:140}},
            e('div',{style:{fontSize:'2.6rem',fontWeight:800,fontFamily:'monospace',lineHeight:1}},resumen.score),
            e('div',{style:{fontSize:'.72rem',opacity:.9,marginTop:4}},'HEALTH SCORE')
          ),
          e('div',{style:{padding:'16px 20px',flex:1,display:'flex',flexDirection:'column',justifyContent:'center'}},
            e('div',{style:{fontWeight:700,fontSize:'1.05rem',color:resumen.scoreColor,marginBottom:4}},resumen.scoreLabel),
            e('div',{style:{fontSize:'.82rem',color:'#64748b',lineHeight:1.5}},
              'Flota operando al '+resumen.margen+'% de margen. ',
              resumen.camionesRojos>0?resumen.camionesRojos+' camión'+(resumen.camionesRojos!==1?'es':'')+' detenido'+(resumen.camionesRojos!==1?'s':'')+'. ':'Sin camiones detenidos. ',
              resumen.pctV>25?'Km vacío elevado ('+resumen.pctV+'%).':'Km vacío bajo control ('+resumen.pctV+'%).'
            )
          )
        )
      ),
      // KPIs financieros
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}},
        ...[
          ['💵 Ingresos',fCLP(resumen.ing),'#f0fdf4','#166534'],
          ['📈 Utilidad',fCLP(resumen.util),resumen.util>=0?'#f0fdf4':'#fef2f2',resumen.util>=0?'#166534':'#991b1b'],
          ['📊 Margen',resumen.margen+'%','#eff6ff','#1e40af'],
        ].map(([l,v,bg,col])=>
          e('div',{key:l,style:{background:bg,borderRadius:10,padding:14,textAlign:'center'}},
            e('div',{style:{fontSize:'.74rem',color:col,marginBottom:4,fontWeight:600}},l),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.05rem',color:col}},v)
          )
        )
      ),
      // Estado flota
      e('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}},
        ...[
          ['🚛 Activos',resumen.camionesActivos,'#0A1929'],
          ['🟡 1-2 días',resumen.camionesAmarillos,'#854d0e'],
          ['🔴 Detenidos',resumen.camionesRojos,'#991b1b'],
          ['⚠️ Alertas',resumen.nAlertas,'#9a3412'],
        ].map(([l,v,col])=>
          e('div',{key:l,className:'card',style:{padding:'10px 8px',textAlign:'center'}},
            e('div',{style:{fontSize:'1.3rem',fontWeight:700,color:col,fontFamily:'monospace'}},v),
            e('div',{style:{fontSize:'.7rem',color:'#94a3b8',marginTop:2}},l)
          )
        )
      ),
      // Mejor y peor camión
      (resumen.mejor||resumen.peor)&&e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}},
        resumen.mejor&&e('div',{className:'card',style:{borderLeft:'3px solid #16a34a',padding:'12px 14px'}},
          e('div',{style:{fontSize:'.72rem',color:'#16a34a',fontWeight:700,marginBottom:4}},'🏆 MÁS RENTABLE'),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.92rem'}},resumen.mejor.pat),
          e('div',{style:{fontSize:'.76rem',color:'#64748b'}},resumen.mejor.cond),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,color:'#059669',marginTop:4}},fCLP(resumen.mejor.u))
        ),
        resumen.peor&&resumen.peor.pat!==resumen.mejor?.pat&&e('div',{className:'card',style:{borderLeft:'3px solid #dc2626',padding:'12px 14px'}},
          e('div',{style:{fontSize:'.72rem',color:'#dc2626',fontWeight:700,marginBottom:4}},'📉 MENOS RENTABLE'),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.92rem'}},resumen.peor.pat),
          e('div',{style:{fontSize:'.76rem',color:'#64748b'}},resumen.peor.cond),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,color:resumen.peor.u<0?'#dc2626':'#059669',marginTop:4}},fCLP(resumen.peor.u))
        )
      ),
      // Fugas resumidas
      e('div',{className:'card',style:{padding:'14px 16px'}},
        e('div',{style:{fontWeight:700,fontSize:'.85rem',color:'#0A1929',marginBottom:10}},'💸 Fugas del período'),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',padding:'5px 0',borderBottom:'1px solid #f1f5f9'}},
          e('span',{style:{color:'#64748b'}},'🛣️ Km vacíos'),e('span',{style:{fontFamily:'monospace',fontWeight:600,color:'#dc2626'}},fCLP(resumen.totVacioCosto))),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',padding:'5px 0',borderBottom:'1px solid #f1f5f9'}},
          e('span',{style:{color:'#64748b'}},'🚫 Rechazos'),e('span',{style:{fontFamily:'monospace',fontWeight:600,color:'#9a3412'}},fCLP(resumen.totRechazo))),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',padding:'5px 0'}},
          e('span',{style:{color:'#64748b'}},'⏱️ Estadías'),e('span',{style:{fontFamily:'monospace',fontWeight:600,color:'#854d0e'}},fCLP(resumen.totEstadia))),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.85rem',padding:'8px 0 0',marginTop:6,borderTop:'2px solid #f1f5f9'}},
          e('span',{style:{fontWeight:700}},'Total fugas'),e('span',{style:{fontFamily:'monospace',fontWeight:700,color:'#dc2626'}},fCLP(resumen.totVacioCosto+resumen.totRechazo+resumen.totEstadia)))
      )
    ),

    // ═══ FUGAS ═══
    sub==='fugas'&&e('div',null,
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}},
        ...[
          ['🛣️ Costo km vacíos',fCLP(fugas.totVacioCosto),'#fef2f2','#991b1b'],
          ['📏 Km vacíos totales',fugas.totVacioKm.toLocaleString()+' km','#f5f3ff','#5b21b6'],
          ['🚫 Cargas rechazadas',fCLP(fugas.totRechazo),'#fff7ed','#9a3412'],
          ['⏱️ Estadías',fCLP(fugas.totEstadia),'#fefce8','#854d0e'],
        ].map(([l,v,bg,col])=>
          e('div',{key:l,style:{background:bg,borderRadius:10,padding:14}},
            e('div',{style:{fontSize:'.78rem',color:col,marginBottom:4,fontWeight:600}},l),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.1rem',color:col}},v)
          )
        )
      ),
      e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929',marginBottom:8}},'Costo de km vacíos por camión'),
      fugas.lista.length===0?e('div',{className:'card',style:{textAlign:'center',padding:32,color:'#94a3b8'}},'Sin datos en el período')
      :fugas.lista.slice(0,12).map(c=>
        e('div',{key:c.pat,className:'card',style:{marginBottom:8,padding:'12px 14px'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},
            e('div',null,
              e('span',{style:{fontFamily:'monospace',fontWeight:700}},c.pat),
              e('span',{style:{fontSize:'.78rem',color:'#94a3b8',marginLeft:8}},'👤 '+c.cond)
            ),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,color:'#dc2626'}},fCLP(c.costoV))
          ),
          e('div',{style:{display:'flex',gap:12,fontSize:'.76rem',color:'#64748b'}},
            e('span',null,'🛣️ '+c.kmV.toLocaleString()+' km vacío'),
            e('span',{style:{color:c.pctV>35?'#dc2626':'#64748b',fontWeight:c.pctV>35?700:400}},'📊 '+c.pctV+'% vacío'),
            c.rechazo>0&&e('span',{style:{color:'#9a3412'}},'🚫 '+fCLP(c.rechazo)),
            c.estadia>0&&e('span',{style:{color:'#854d0e'}},'⏱️ '+fCLP(c.estadia))
          )
        )
      ),
      rutasVacio.length>0&&e('div',{style:{marginTop:18}},
        e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929',marginBottom:8}},'🔝 Rutas que más generan km vacío'),
        ...rutasVacio.map(r=>
          e('div',{key:r.ruta,className:'card',style:{marginBottom:6,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}},
            e('div',null,
              e('div',{style:{fontSize:'.84rem',fontWeight:600,color:'#0A1929'}},r.ruta),
              e('div',{style:{fontSize:'.74rem',color:'#94a3b8'}},r.n+' viaje'+(r.n!==1?'s':'')+' · '+r.km.toLocaleString()+' km')
            ),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,color:'#5b21b6',fontSize:'.9rem'}},fCLP(r.costo))
          )
        )
      )
    ),

    // ═══ SEMÁFORO ═══
    sub==='semaforo'&&e('div',null,
      e('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}},
        ...[
          ['🟢 Activos',semaforo.filter(s=>s.estado==='verde'||s.estado==='transito'||s.estado==='rentable').length,'#f0fdf4','#166534'],
          ['🟡 1-2 días',semaforo.filter(s=>s.estado==='amarillo').length,'#fefce8','#854d0e'],
          ['🔴 3+ días',semaforo.filter(s=>s.estado==='rojo').length,'#fef2f2','#991b1b'],
          ['⚪ Sin datos',semaforo.filter(s=>s.estado==='sin_datos').length,'#f8fafc','#64748b'],
        ].map(([l,v,bg,col])=>
          e('div',{key:l,style:{background:bg,borderRadius:10,padding:12,textAlign:'center'}},
            e('div',{style:{fontSize:'1.4rem',fontWeight:700,color:col,fontFamily:'monospace'}},v),
            e('div',{style:{fontSize:'.72rem',color:col,marginTop:2}},l)
          )
        )
      ),
      semaforo.filter(s=>s.estado!=='sin_datos').map(s=>{
        const cfg={transito:['#dbeafe','#1e40af','🚛 En tránsito → '+(s.ultima||'')],verde:['#d1fae5','#065f46','🟢 Activo / descargó hoy'],rentable:['#d1fae5','#065f46','🟢 Rentable · '+s.dias+'d detenido pero alta utilidad'],amarillo:['#fef9c3','#854d0e','🟡 '+s.dias+' día'+(s.dias!==1?'s':'')+' detenido'],rojo:['#fee2e2','#991b1b','🔴 '+s.dias+' días detenido · reasignar']}[s.estado];
        return e('div',{key:s.pat,className:'card',style:{marginBottom:6,padding:'10px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',borderLeft:'3px solid',borderLeftColor:cfg[1]}},
          e('div',null,
            e('span',{style:{fontFamily:'monospace',fontWeight:700}},s.pat),
            e('span',{style:{fontSize:'.78rem',color:'#94a3b8',marginLeft:8}},'👤 '+s.cond),
            s.util>0&&e('div',{style:{fontSize:'.73rem',color:'#059669',fontFamily:'monospace',marginTop:2}},'📈 '+fCLP(s.util)+' utilidad')
          ),
          e('span',{style:{fontSize:'.75rem',padding:'3px 10px',borderRadius:20,background:cfg[0],color:cfg[1],fontWeight:600,textAlign:'right',maxWidth:200}},cfg[2])
        );
      }),

function Combustible(){
  const [tramos,setTramos]=useState([]);
  const [orden,setOrden]=useState('rendimiento');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const norm=p=>String(p||'').replace(/-/g,'').replace(/\s/g,'').toUpperCase();

  // Período del reporte de diesel: junio 2026 completo
  const DIESEL_DESDE='2026-06-01';
  const DIESEL_HASTA='2026-06-30';

  // Km recorridos por patente (cargado + vacío) SOLO en el período del diesel
  const kmPorPatente=useMemo(()=>{
    const m={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      const f=t.fecha_carga||'';
      if(f<DIESEL_DESDE||f>DIESEL_HASTA)return;
      const k=norm(t.patente);
      if(!m[k])m[k]=0;
      m[k]+=(findR(t.cliente,t.origen,t.destino)?.k||0)+Number(t.km_vacio||0);
    });
    return m;
  },[tramos]);

  // Cruzar diesel del Excel con km del sistema (solo patentes propias que están en el Excel)
  const analisis=useMemo(()=>{
    const lista=Object.entries(DIESEL_DATA)
      .filter(([pat])=>grupoPatente(TRUCKS.find(x=>norm(x.p)===pat)?.p||pat)!=='terceros')
      .map(([pat,d])=>{
        const truck=TRUCKS.find(x=>norm(x.p)===pat);
        const km=kmPorPatente[pat]||0;
        const rend=d.litros>0&&km>0?km/d.litros:0;
        const costoKm=km>0?d.gasto/km:0;
        const precioL=d.litros>0?d.gasto/d.litros:0;
        return{pat,patFmt:truck?.p||pat,cond:truck?.c||'—',litros:d.litros,gasto:d.gasto,cargas:d.cargas,km,rend,costoKm,precioL,ultFecha:d.ultFecha,ultLitros:d.ultLitros};
      });
    const conKm=lista.filter(x=>x.km>0);
    const ordenar={
      rendimiento:(a,b)=>b.rend-a.rend,
      litros:(a,b)=>b.litros-a.litros,
      gasto:(a,b)=>b.gasto-a.gasto,
      costoKm:(a,b)=>a.costoKm-b.costoKm,
    }[orden];
    return {lista:[...conKm].sort(ordenar),sinKm:lista.filter(x=>x.km===0)};
  },[kmPorPatente,orden]);

  // Totales solo de patentes propias presentes en el Excel
  const propiasData=Object.entries(DIESEL_DATA).filter(([pat])=>grupoPatente(TRUCKS.find(x=>norm(x.p)===pat)?.p||pat)!=='terceros');
  const totLitros=propiasData.reduce((s,[,d])=>s+d.litros,0);
  const totGasto=propiasData.reduce((s,[,d])=>s+d.gasto,0);
  const totIva=propiasData.reduce((s,[,d])=>s+(d.iva||0),0);
  // Precio promedio neto sin IVA = (gasto - IVA) / litros
  const precioNeto=totLitros>0?(totGasto-totIva)/totLitros:0;
  const conKm=analisis.lista;
  const rendProm=conKm.length>0?conKm.reduce((s,x)=>s+x.rend,0)/conKm.length:0;
  const maxRend=conKm.length>0?Math.max(...conKm.map(x=>x.rend)):1;

  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=conKm.map((x,i)=>({'Ranking':i+1,'Patente':x.patFmt,'Conductor':x.cond,'Km recorridos':Math.round(x.km),'Litros diesel':Math.round(x.litros),'Rendimiento (km/L)':x.rend.toFixed(2),'Costo por km':Math.round(x.costoKm),'Precio prom ($/L)':Math.round(x.precioL),'Gasto total':Math.round(x.gasto)}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Rendimiento');
    XLSX.writeFile(wb,'DITrucks_Rendimiento_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };

  return e('div',{style:{maxWidth:700,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{marginBottom:12,padding:'10px 14px',background:'#fffbeb',borderRadius:10,fontSize:'.8rem',color:'#92400e'}},
      'ℹ️ Rendimiento = km recorridos ÷ litros de diesel cargado. Período: junio 2026 completo (solo diesel, sin AdBlue, solo camiones propios). ',
      conKm.length+' de '+propiasData.length+' patentes propias tienen km registrados en ese rango.'
    ),
    // KPIs
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}},
      ...[
        ['⛽ Litros diesel',Math.round(totLitros).toLocaleString()+' L','#eff6ff','#1e40af'],
        ['💰 Gasto diesel',fCLP(totGasto),'#fef2f2','#991b1b'],
        ['📊 Rend. promedio',rendProm.toFixed(2)+' km/L','#f0fdf4','#166534'],
        ['🏷️ Precio prom. neto',fCLP(precioNeto)+'/L','#faf5ff','#6b21a8'],
      ].map(([l,v,bg,col])=>
        e('div',{key:l,style:{background:bg,borderRadius:10,padding:14,textAlign:'center'}},

          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.05rem',color:col}},v)

    ),

    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}},
      e('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
        ...[['rendimiento','📊 Rendimiento'],['litros','⛽ Litros'],['gasto','💰 Gasto'],['costoKm','🛣️ Costo/km']].map(([v,l])=>
          e('button',{key:v,onClick:()=>setOrden(v),style:{padding:'5px 12px',borderRadius:8,border:'1.5px solid',borderColor:orden===v?'#0097A7':'#e2e8f0',background:orden===v?'#e0f7fa':'white',color:orden===v?'#0097A7':'#64748b',fontWeight:600,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},l)
        )
      ),
      e('button',{onClick:exportExcel,style:{padding:'.4rem .9rem',background:'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},'📥 Excel')
    ),
    // Ranking
    conKm.length===0?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'Ninguna patente del Excel tiene km registrados en el sistema todavía')
    :conKm.map((x,i)=>{
      const medal=orden==='rendimiento'?(i===0?'🥇':i===1?'🥈':i===2?'🥉':''):'';
      // color por eficiencia relativa al promedio
      const ef=x.rend>=rendProm*1.1?'#16a34a':x.rend>=rendProm*0.9?'#f59e0b':'#dc2626';
      return e('div',{key:x.pat,className:'card',style:{marginBottom:8,borderLeft:'3px solid',borderLeftColor:ef,padding:'12px 14px'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
          e('div',{style:{display:'flex',alignItems:'center',gap:8}},
            e('span',{style:{fontSize:'1rem',width:24,textAlign:'center'}},medal||('#'+(i+1))),
            e('div',null,
              e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.92rem'}},x.patFmt),
              e('div',{style:{fontSize:'.76rem',color:'#64748b'}},'👤 '+x.cond)
            )
          ),
          e('div',{style:{textAlign:'right'}},
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.15rem',color:ef}},x.rend.toFixed(2)),
            e('div',{style:{fontSize:'.7rem',color:'#94a3b8'}},'km/L')
          )
        ),
        // barra de rendimiento
        e('div',{style:{height:6,background:'#f1f5f9',borderRadius:3,overflow:'hidden',marginBottom:8}},
          e('div',{style:{height:'100%',borderRadius:3,background:ef,width:Math.round(x.rend/maxRend*100)+'%'}})
        ),
        e('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6}},
          ...[['🛣️ Km',Math.round(x.km).toLocaleString()],['⛽ Litros',Math.round(x.litros).toLocaleString()],['💵 Costo/km',fCLP(x.costoKm)],['🏷️ $/Litro',fCLP(x.precioL)]].map(([l,v])=>
            e('div',{key:l,style:{textAlign:'center'}},
              e('div',{style:{fontSize:'.66rem',color:'#94a3b8'}},l),
              e('div',{style:{fontFamily:'monospace',fontWeight:600,fontSize:'.8rem',color:'#0A1929'}},v)
            )
          )
        ),
        // Recuadro de última carga de combustible
        x.ultFecha&&(()=>{
          const diasDesde=Math.floor((Date.now()-new Date(x.ultFecha+'T00:00:00'))/86400000);
          const pctUlt=x.litros>0?Math.round(x.ultLitros/x.litros*100):0;
          const reciente=diasDesde<=3&&pctUlt>=30;
          return e('div',{style:{marginTop:8,padding:'10px 12px',borderRadius:8,border:'1.5px solid',borderColor:reciente?'#fde68a':'#e2e8f0',background:reciente?'#fffbeb':'#f8fafc',display:'flex',justifyContent:'space-between',alignItems:'center'}},

              e('div',{style:{fontSize:'.82rem',color:'#0A1929',fontWeight:600}},
                '📅 '+x.ultFecha+'  ·  ',

// ── FONDO A RENDIR · Vista administrador (Rodolfo / Alejandro / owner) ──
function FondoRendir({user}){
  const [movs,setMovs]=useState([]);
  const [tramosAll,setTramosAll]=useState([]);
  const [loading,setLoading]=useState(true);
  const [vista,setVista]=useState('saldos'); // 'saldos' | 'aprobacion' | 'clientes'
  const [form,setForm]=useState(false);
  const [cPat,setCPat]=useState('');
  const [cTramo,setCTramo]=useState('');
  const [cMonto,setCMonto]=useState('');
  const [cNota,setCNota]=useState('');
  const [guardando,setGuardando]=useState(false);
  const [verFoto,setVerFoto]=useState(null);
  const load=async()=>{setLoading(true);setMovs(await apiFondo.get());setLoading(false);};
  useEffect(()=>{load();api.get().then(setTramosAll);},[]);
  const tramoDe=(id)=>tramosAll.find(t=>t.id===id);
  const conductores=[...new Set(TRUCKS.filter(t=>!t.baja&&t.c).flatMap(t=>t.c.split('/').map(s=>s.trim())).filter(Boolean))].sort();
  // Tramos recientes para asignar (últimos 60 por fecha de carga)
  const tramosSel=useMemo(()=>[...tramosAll].sort((a,b)=>(b.fecha_carga||'').localeCompare(a.fecha_carga||'')).slice(0,60),[tramosAll]);

  const cargar=async()=>{
    if(guardando)return;
    if(!cPat||!cMonto){alert('Selecciona conductor e ingresa el monto');return;}
    setGuardando(true);
    try{
      const t=cTramo?tramoDe(cTramo):null;
      const r=await apiFondo.add({id:Date.now().toString(),created_at:Date.now(),tipo:'carga',conductor:cPat,categoria:'',monto:Number(cMonto)||0,nota:cNota||'',foto:'',fecha:today(),creado_por:user?.nombre||'',estado:'',tramo_id:cTramo||'',foto_guia:'',foto_pesaje:'',cliente:t?t.cliente:''});
      if(!r.ok){alert('No se pudo guardar. ¿Creaste la tabla "fondo" en Supabase?');return;}
      await apiFlujo.add({id:Date.now().toString(),created_at:Date.now(),tipo:'gasto',concepto:'Fondo a rendir · '+cPat,categoria:'Otro',monto:Number(cMonto)||0,fecha:today(),nota:cNota||'',creado_por:user?.nombre||''}).catch(()=>{});
      await load();setForm(false);setCPat('');setCTramo('');setCMonto('');setCNota('');
    }finally{setGuardando(false);}
  };
  // Aprobar un gasto pendiente → rebaja el saldo (marca estado aprobado) + descuenta flujo
  const aprobar=async(x)=>{
    const ok=await apiFondo.patch(x.id,{estado:'aprobado'});
    if(!ok){alert('No se pudo aprobar');return;}
    await apiFlujo.add({id:Date.now().toString(),created_at:Date.now(),tipo:'gasto',concepto:x.categoria+' · '+x.conductor,categoria:x.categoria==='AdBlue'?'Combustible':(x.categoria==='Peaje'?'Peajes':'Otro'),monto:Number(x.monto)||0,fecha:today(),nota:'Fondo a rendir'+(x.nota?' · '+x.nota:''),creado_por:user?.nombre||''}).catch(()=>{});
    await load();
  };
  const rechazar=async(x)=>{if(!confirm('¿Rechazar y borrar este gasto?'))return;await apiFondo.del(x.id);load();};

  // Saldos por conductor (solo gastos aprobados rebajan)
  const porConductor=useMemo(()=>{
    const m={};
    movs.forEach(x=>{
      const c=x.conductor||'—';
      if(!m[c])m[c]={conductor:c,cargas:0,aprob:0,pend:0,movs:[]};
      if(x.tipo==='carga')m[c].cargas+=Number(x.monto||0);
      else if(x.estado==='aprobado')m[c].aprob+=Number(x.monto||0);
      else if(x.estado==='enviado')m[c].pend+=Number(x.monto||0);
      m[c].movs.push(x);
    });
    Object.values(m).forEach(o=>{o.saldo=o.cargas-o.aprob;o.movs.sort((a,b)=>(b.created_at||0)-(a.created_at||0));});
    return Object.values(m).sort((a,b)=>a.conductor.localeCompare(b.conductor));
  },[movs]);
  const pendientes=movs.filter(x=>x.tipo==='gasto'&&x.estado==='enviado').sort((a,b)=>(b.created_at||0)-(a.created_at||0));

  // Resumen por cliente (usa el tramo asociado a cada carga)
  const porCliente=useMemo(()=>{
    const m={};
    movs.filter(x=>x.tipo==='carga').forEach(c=>{
      const t=tramoDe(c.tramo_id);
      const cli=(t&&t.cliente)||c.cliente||'Sin cliente';
      if(!m[cli])m[cli]={cliente:cli,fondo:0,gastado:0,cargas:[]};
      m[cli].fondo+=Number(c.monto||0);
      m[cli].cargas.push(c);
    });
    movs.filter(x=>x.tipo==='gasto'&&x.estado==='aprobado').forEach(g=>{
      const carga=movs.find(c=>c.id===g.carga_id);
      const t=carga?tramoDe(carga.tramo_id):tramoDe(g.tramo_id);
      const cli=(t&&t.cliente)||(carga&&carga.cliente)||'Sin cliente';
      if(!m[cli])m[cli]={cliente:cli,fondo:0,gastado:0,cargas:[]};
      m[cli].gastado+=Number(g.monto||0);
    });
    return Object.values(m).sort((a,b)=>b.fondo-a.fondo);
  },[movs,tramosAll]);

  const totCargas=movs.filter(x=>x.tipo==='carga').reduce((a,x)=>a+Number(x.monto||0),0);
  const totAprob=movs.filter(x=>x.tipo==='gasto'&&x.estado==='aprobado').reduce((a,x)=>a+Number(x.monto||0),0);
  const totPend=movs.filter(x=>x.tipo==='gasto'&&x.estado==='enviado').reduce((a,x)=>a+Number(x.monto||0),0);
