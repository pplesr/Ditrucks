const MARGEN_TERCERO_DEFAULT=0.35;
const utilidadTercero=(t)=>{
  const r=findR(t.cliente,t.origen,t.destino);
  const {tarifa,extras}=calcT(t);
  const ingresoReal=tarifa+extras; // tarifa ya = ton*valor si la ruta es por tonelada
  if(r&&typeof r.tt==='number'){
    // Si la tarifa tercero es POR TONELADA/KILO, se multiplica por las toneladas ingresadas
    const pagoTercero=r.ttPorTon?r.tt*(Number(t.toneladas)||0):r.tt;
    return ingresoReal-pagoTercero; // utilidad = ingreso − pago al tercero
  }
  if(r&&typeof r.ut==='number')return r.ut; // respaldo: utilidad precalculada de tarifa fija
  return ingresoReal*MARGEN_TERCERO_DEFAULT; // respaldo final
};

  const au=a.toUpperCase(),bu=b.toUpperCase();
  if(au===bu)return true;
  return ZONAS_EQUIV.some(z=>z.includes(au)&&z.includes(bu));
};

// ── CÁLCULO KM VACÍOS ──
// Regla 1: buscar en DIST (tabla Excel) directo o inverso → usar KMS y Gasto_Tramo real
// Regla 2: si no existe → Haversine (georreferencia) × $800/km
const kmV=(a,b)=>{
  if(!a||!b)return{km:0,costo:0,fuente:'zona'};
  const au=normCity(a),bu=normCity(b);
  if(mismaZona(au,bu))return{km:0,costo:0,fuente:'zona'};

  // REGLA 1: buscar en tabla de distancias (directo o inverso)
  const dir=DIST_IDX[au+'|'+bu];
  if(dir)return{km:dir.km,costo:dir.c,fuente:'tabla'};
  const inv=DIST_IDX[bu+'|'+au];
  if(inv)return{km:inv.km,costo:inv.c,fuente:'tabla'};

  // REGLA 2: georreferencia Haversine × $800
  const ca=CC[au]||CC[a],cb=CC[bu]||CC[b];
  if(!ca||!cb)return{km:0,costo:0,fuente:'sin_coords'};
  const km=haversine(ca,cb);
  return{km,costo:Math.round(km*COSTO_KM_VACIO),fuente:'geo'};
};

// ── TELÉFONOS DE CONDUCTORES (para aviso por WhatsApp) ──
// Formato internacional sin signos: 56912345678. Editable aquí.
const FONOS_CONDUCTOR={
  // 'VLADEMIR PIZARRO':'56912345678',
  // 'JULIO VARGAS':'56987654321',
};
// Normaliza un número a formato wa.me (solo dígitos, con código país 56 si falta)
const normFono=(f)=>{
  if(!f)return '';
  let d=String(f).replace(/[^0-9]/g,'');
  if(d.length===9&&d.startsWith('9'))d='56'+d; // celular chileno sin código país
  if(d.length===8)d='569'+d;
  return d;
};
// Arma el mensaje de aviso de viaje para un tramo
const mensajeViaje=(t)=>{
  const eq=equipoDe(t.patente);
  const cond=(eq.conductor||'').split('/')[0].trim();
  const ruta=(t.origen||'?')+' → '+(t.destino||'?');
  const l=['Hola '+(cond||'')+', tienes un viaje asignado:'];
  l.push('🚛 '+(t.patente||'')+(eq.acoplado?' · 🔗 '+eq.acoplado:''));
  l.push('📦 '+(t.cliente||'')+': '+ruta);
  if(t.fecha_carga)l.push('📅 Carga: '+t.fecha_carga+(t.hora_carga?' '+t.hora_carga:''));
  if(t.guia)l.push('📄 Guía: '+t.guia);
  l.push('— DITrucks');
  return l.join('\n');
};
// Devuelve el link wa.me para avisar al conductor de un tramo (o null si no hay fono)
const linkWhatsappTramo=(t)=>{
  const eq=equipoDe(t.patente);
  const cond=(eq.conductor||'').split('/')[0].trim().toUpperCase();
  // buscar teléfono por nombre exacto o parcial
  let fono='';
  for(const k in FONOS_CONDUCTOR){ if(k.toUpperCase()===cond||cond.includes(k.toUpperCase())||k.toUpperCase().includes(cond)){fono=FONOS_CONDUCTOR[k];break;} }
  const num=normFono(fono);
  const texto=encodeURIComponent(mensajeViaje(t));
  return num?('https://wa.me/'+num+'?text='+texto):('https://wa.me/?text='+texto);
};
// Resuelve la factura de un tramo por su guía. Devuelve N° factura o null.
// Asignaciones puntuales de factura cuando no se puede linkear por guía.
// Clave: 'CLIENTE|PATENTE|FECHA_CARGA'
const FACTURAS_MANUAL={
  'CORPESCA LOCAL|RWTK-87|2026-06-27':'2371',
};
const facturaDeTramo=(t)=>{
  if(!t)return null;
  if(t.guia){
    const g=String(t.guia).trim().replace(/\.0$/,'');
    if(FACTURAS_JUNIO[g])return FACTURAS_JUNIO[g];
  }
  const k=(t.cliente||'').trim().toUpperCase()+'|'+(t.patente||'').trim().toUpperCase()+'|'+(t.fecha_carga||'').trim();
  return FACTURAS_MANUAL[k]||null;
};
// Determina si un tramo debe considerarse facturado (mayo asumido facturado; junio+ según mapa)
const estaFacturado=(t)=>{
  if(!t||!t.fecha_carga)return false;
  const mes=t.fecha_carga.slice(0,7);
  if(mes<='2026-05')return true; // hasta mayo: todo facturado
  return facturaDeTramo(t)!=null; // junio en adelante: según factura real
};

const calcT=(t)=>{const r=findR(t.cliente,t.origen,t.destino);const tarifaBase=r?(r.ton?(Number(t.toneladas)||0)*r.ton:r.t):0;const tarifa=(t.tarifa_manual!=null&&t.tarifa_manual!=='')?Number(t.tarifa_manual):tarifaBase;const costoVacio=Number(t.costo_vacio||0);const costo=(r?r.c:0)+costoVacio+(t.encarpe?Number(t.encarpe_monto||0):0)+(t.lavado?Number(t.lavado_monto||0):0);const extras=(t.estadia?Number(t.estadia_monto||0):0)+(t.rechazada?Number(t.rechazada_monto||0):0);return{tarifa,costo,costoVacio,extras,util:tarifa+extras-costo,km:r?r.k:0,tarifaModificada:t.tarifa_manual!=null&&t.tarifa_manual!==''};};

// ── LISTA TRAMOS ──
function ListaTramos({user,isOwner}){
  const [data,setData]=useState([]);
  const [q,setQ]=useState('');
  const [filtDesde,setFiltDesde]=useState('');
  const [filtHasta,setFiltHasta]=useState('');
  const [mesSel,setMesSel]=useState('');
  const [clienteFil,setClienteFil]=useState('');
  const [soloSinGuia,setSoloSinGuia]=useState(false);
  const [soloDuplicados,setSoloDuplicados]=useState(false);
  const [soloSinFactura,setSoloSinFactura]=useState(false);
  const [sel,setSel]=useState(null);
  const [loading,setLoading]=useState(true);
  const [comp,setComp]=useState(null);
  const [cGuia,setCGuia]=useState('');
  const [cFecha,setCFecha]=useState('');
  const [cHora,setCHora]=useState('');
  const [cTon,setCTon]=useState('');
  const [cEncarpe,setCEncarpe]=useState(false);
  const [cEncarpeM,setCEncarpeM]=useState('');
  const [cLavado,setCLavado]=useState(false);
  const [cLavadoM,setCLavadoM]=useState('');
  const [cEstadia,setCEstadia]=useState(false);
  const [cEstadiaM,setCEstadiaM]=useState('');
  const [cRechazada,setCRechazada]=useState(false);
  const [cRechazadaM,setCRechazadaM]=useState('');
  const [cTarifa,setCTarifa]=useState('');
  const load=async()=>{setLoading(true);const d=await api.get();setData(d);setLoading(false);};
  useEffect(()=>{load();},[]);
  // Detectar duplicados: misma guía + mismo cliente (solo si guía no está vacía)
  const idsDuplicados=useMemo(()=>{
    const m={};
    data.forEach(t=>{
      if(!t.guia||!t.cliente)return;
      const k=t.guia+'|'+t.cliente;
      (m[k]=m[k]||[]).push(t.id);
    });
    const dup=new Set();
    Object.values(m).forEach(ids=>{if(ids.length>1)ids.forEach(id=>dup.add(id));});
    return dup;
  },[data]);
  const fil=useMemo(()=>{
    const sq=q.toLowerCase();
    return data.filter(t=>{
      if(sq&&![t.cliente,t.origen,t.destino,t.patente,t.guia,t.creado_por].some(v=>(v||'').toLowerCase().includes(sq)))return false;
      if(clienteFil&&t.cliente!==clienteFil)return false;
      if(mesSel&&!(t.fecha_carga||'').startsWith(mesSel))return false;
      if(filtDesde&&(t.fecha_carga||'')<filtDesde)return false;
      if(filtHasta&&(t.fecha_carga||'')>filtHasta)return false;
      if(soloSinGuia&&t.guia)return false;
      if(soloDuplicados&&!idsDuplicados.has(t.id))return false;
      if(soloSinFactura){const mes=(t.fecha_carga||'').slice(0,7);if(mes<'2026-06'||facturaDeTramo(t)!=null||!t.guia)return false;}
      return true;
    });
  },[data,q,filtDesde,filtHasta,soloSinGuia,mesSel,clienteFil,soloDuplicados,idsDuplicados,soloSinFactura]);
  // Meses disponibles (últimos 6) y clientes presentes en los datos
  const mesesDisp=useMemo(()=>{
    const hoy=new Date();const arr=[];
    for(let i=0;i<6;i++){const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);const ym=d.toISOString().slice(0,7);arr.push({ym,label:MESES_ES[d.getMonth()]+' '+d.getFullYear()});}
    return arr;
  },[]);
  const clientesDisp=useMemo(()=>[...new Set(data.map(t=>t.cliente).filter(Boolean))].sort(),[data]);

  const del=async(id)=>{
    if(!confirm('¿Eliminar este tramo?'))return;
    const tramoBorrado=data.find(t=>t.id===id);
    await api.del(id);
    if(tramoBorrado&&tramoBorrado.patente){
      const restantes=data
        .filter(t=>t.id!==id&&t.patente===tramoBorrado.patente)
        .sort((a,b)=>(a.fecha_carga||'').localeCompare(b.fecha_carga||'')||a.created_at-b.created_at);
      const sigIdx=restantes.findIndex(t=>
        (t.fecha_carga||'')>(tramoBorrado.fecha_carga||'')||
        ((t.fecha_carga||'')===(tramoBorrado.fecha_carga||'')&&t.created_at>tramoBorrado.created_at)
      );
      if(sigIdx>=0){
        const sig=restantes[sigIdx];
        const prevDelSig=sigIdx>0?restantes[sigIdx-1]:null;
        let nuevoKmVacio=0,nuevoCostoVacio=0,nuevaCiudad='';
        // FIX: usar mismaZona
        if(prevDelSig&&prevDelSig.destino&&sig.origen){
          const prR=findR(prevDelSig.cliente,prevDelSig.origen,prevDelSig.destino);
          const pc=prR?.dc||prevDelSig.destino;
          const nxR=findR(sig.cliente,sig.origen,sig.destino);
          const nc2=nxR?.oc||sig.origen;
          if(!mismaZona(pc,nc2)){
            const v=kmV(pc,nc2);
            nuevoKmVacio=v.km;nuevoCostoVacio=v.costo;nuevaCiudad=pc;
          }
        }
        await api.patch(sig.id,{km_vacio:nuevoKmVacio,costo_vacio:nuevoCostoVacio,ciudad_vacio_desde:nuevaCiudad});
      }
    }
    load();
  };
  const completar=async()=>{
    // Determinar si la tarifa fue modificada manualmente
    const tarifaCalc=calcT({...comp,toneladas:cTon||comp.toneladas}).tarifa;
    const tarifaIngresada=cTarifa!==''?Number(cTarifa):null;
    const fueModificada=tarifaIngresada!==null&&Math.abs(tarifaIngresada-tarifaCalc)>1;
    await api.patch(comp.id,{
      guia:cGuia,fecha_desc:cFecha,hora_desc:cHora,
      toneladas:cTon||comp.toneladas,
      tarifa_manual:fueModificada?tarifaIngresada:null,
      encarpe:cEncarpe,encarpe_monto:cEncarpeM,
      lavado:cLavado,lavado_monto:cLavadoM,
      estadia:cEstadia,estadia_monto:cEstadiaM,
      rechazada:cRechazada,rechazada_monto:cRechazadaM,
    });
    setComp(null);load();
  };
  const est=(t)=>{
    if(t.guia&&t.fecha_desc)return{l:'Completo',bg:'#d1fae5',col:'#065f46',ic:'✅'};
    if(!t.guia)return{l:'Sin guía',bg:'#fee2e2',col:'#991b1b',ic:'⚠️'};
    return{l:'Sin descarga',bg:'#fef3c7',col:'#92400e',ic:'⏳'};
  };
  const exportExcel=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    // Usar los tramos FILTRADOS (respeta mes/fecha/cliente/etc.) y agrupar por cliente
    const origen=[...fil].sort((a,b)=>
      (a.cliente||'').localeCompare(b.cliente||'')||
      (a.fecha_carga||'').localeCompare(b.fecha_carga||'')
    );
    if(origen.length===0){alert('No hay tramos que coincidan con los filtros seleccionados');return;}
    const rows=origen.map(t=>{
      const {tarifa,costo,extras,util,km}=calcT(t);
      const truck=TRUCKS.find(x=>x.p===t.patente);
      const dias=t.fecha_carga&&t.fecha_desc?Math.round((new Date(t.fecha_desc)-new Date(t.fecha_carga))/86400000):'';
      const r=findR(t.cliente,t.origen,t.destino);
      return{'Cliente':t.cliente,'Patente':t.patente,'Conductor':truck?.c||'','Origen':t.origen,'Destino':t.destino,'Fecha Carga':t.fecha_carga,'Hora Carga':t.hora_carga,'Fecha Descarga':t.fecha_desc||'Pendiente','Días Tránsito':dias,'Guía':t.guia||'Pendiente','Toneladas':r&&r.ton?(t.toneladas||''):'-','Km Cargado':km,'Km Vacío':t.km_vacio||0,'Ciudad Vacío Desde':t.ciudad_vacio_desde||'','Tarifa':Math.round(tarifa),'Costo':Math.round(costo),'Extras':Math.round(extras),'Utilidad':Math.round(util),'Costo Km Vacío':t.costo_vacio||0,'Estado':t.guia&&t.fecha_desc?'Completo':!t.guia?'Sin guía':'Sin descarga','Creado por':t.creado_por||''};
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Tramos');
    // Nombre del archivo según el filtro activo
    let suf=new Date().toISOString().split('T')[0];
    if(mesSel)suf=mesSel;
    else if(filtDesde||filtHasta)suf=(filtDesde||'inicio')+'_a_'+(filtHasta||'hoy');
    if(clienteFil)suf=clienteFil.replace(/[^a-zA-Z0-9]/g,'_')+'_'+suf;
    XLSX.writeFile(wb,'DITrucks_Tramos_'+suf+'.xlsx');
  };
  return e('div',{style:{maxWidth:600,margin:'0 auto',paddingBottom:48}},
    comp&&e('div',{style:{position:'fixed',inset:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:16,background:'rgba(0,0,0,.45)'}},
      e('div',{className:'card si',style:{width:'100%',maxWidth:440,maxHeight:'90vh',overflowY:'auto'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
          e('strong',null,comp.guia&&comp.fecha_desc?'✏️ Editar tramo':'Completar tramo'),
          e('button',{onClick:()=>setComp(null),style:{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#94a3b8'}},'×')
        ),
        e('div',{style:{fontSize:'.85rem',color:'#64748b',marginBottom:12}},comp.cliente+' · '+comp.origen+' → '+comp.destino),
        F('N° Guía',e('input',{className:'inp',type:'text',value:cGuia,onChange:ev=>setCGuia(ev.target.value),placeholder:'Número de guía'})),
        (()=>{const r=findR(comp.cliente,comp.origen,comp.destino);return r&&r.ton?e('div',null,
          e('label',{className:'lbl'},'Toneladas cargadas ',e('span',{style:{color:'#00BCD4'}},'('+r.ton+' $/ton)')),
          e('input',{className:'inp',type:'number',min:0,value:cTon,onChange:ev=>setCTon(ev.target.value),placeholder:'Ej: 28'}),
          cTon&&e('div',{style:{marginTop:4,fontSize:'.82rem',color:'#059669',fontWeight:600}},'Tarifa: $'+(Math.round(Number(cTon)*r.ton)).toLocaleString('es-CL'))
        ):null;})(),
        // Tarifa manual (ingreso editable)
        (()=>{
          const tarifaCalc=calcT({...comp,toneladas:cTon||comp.toneladas,tarifa_manual:null}).tarifa;
          const modificada=cTarifa!==''&&Math.abs(Number(cTarifa)-tarifaCalc)>1;
          return e('div',{style:{marginTop:4}},
            e('label',{className:'lbl'},'💵 Tarifa / Ingreso ',e('span',{style:{color:'#94a3b8',fontWeight:400}},'(calculada: $'+Math.round(tarifaCalc).toLocaleString('es-CL')+')')),
            e('input',{className:'inp',type:'number',value:cTarifa,onChange:ev=>setCTarifa(ev.target.value),placeholder:'Dejar vacío para usar la tarifa calculada'}),
            modificada&&e('div',{style:{marginTop:4,fontSize:'.8rem',color:'#b45309',fontWeight:600}},'⚠️ Tarifa modificada manualmente (antes $'+Math.round(tarifaCalc).toLocaleString('es-CL')+')')
          );
        })(),
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
          F('Fecha descarga',e('input',{className:'inp',type:'date',value:cFecha,onChange:ev=>setCFecha(ev.target.value)})),
          F('Hora descarga',e('input',{className:'inp',type:'time',value:cHora,onChange:ev=>setCHora(ev.target.value),disabled:!cFecha}))
        ),
        e('div',{style:{borderTop:'1px solid #f1f5f9',marginTop:12,paddingTop:12}},
          e('div',{style:{fontSize:'.82rem',fontWeight:600,color:'#475569',marginBottom:8}},'➕ Cargos adicionales'),
          ...[
            ['encarpe','🔧 Encarpe',cEncarpe,setCEncarpe,cEncarpeM,setCEncarpeM],
            ['lavado','🚿 Lavado',cLavado,setCLavado,cLavadoM,setCLavadoM],
            ['estadia','🏨 Estadía',cEstadia,setCEstadia,cEstadiaM,setCEstadiaM],
            ['rechazada','📦 Rechazada',cRechazada,setCRechazada,cRechazadaM,setCRechazadaM],
          ].map(([k,l,val,setVal,monto,setMonto])=>
            e('div',{key:k,style:{marginBottom:6,padding:'8px 10px',borderRadius:8,border:'1.5px solid',borderColor:val?'#a5f3fc':'#f1f5f9',background:val?'#e0f7fa':'#f8fafc'}},
              e('label',{style:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:'.85rem',fontWeight:500}},
                e('input',{type:'checkbox',checked:val,onChange:ev=>setVal(ev.target.checked),style:{width:15,height:15,accentColor:'#00BCD4'}}),l
              ),
              val&&e('input',{className:'inp',type:'number',placeholder:'Monto (+ cargo / - descuento)',value:monto,onChange:ev=>setMonto(ev.target.value),style:{marginTop:6,fontSize:'.85rem'}})
            )
          )
        ),

        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:12}},
          e('button',{onClick:()=>setComp(null),style:{padding:'.75rem',borderRadius:10,border:'1.5px solid #e2e8f0',background:'white',cursor:'pointer',fontWeight:500,fontFamily:'Geist,sans-serif'}},'Cancelar'),
          e('button',{className:'btn',onClick:completar},'Guardar')
        )
      )
    ),
    e('div',{style:{display:'flex',gap:8,marginBottom:8,flexWrap:'wrap'}},
      e('input',{className:'inp',style:{flex:'1 1 200px'},placeholder:'🔍 Buscar…',value:q,onChange:ev=>setQ(ev.target.value)}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtDesde||'',onChange:ev=>{setFiltDesde(ev.target.value);setMesSel('');},title:'Desde'}),
      e('input',{className:'inp',type:'date',style:{width:140},value:filtHasta||'',onChange:ev=>{setFiltHasta(ev.target.value);setMesSel('');},title:'Hasta'}),
      e('select',{className:'inp',style:{width:180},value:clienteFil,onChange:ev=>setClienteFil(ev.target.value),title:'Cliente'},

const esDiaHabil=(d)=>{
  const dow=d.getDay(); // 0=domingo,6=sábado
  if(dow===0||dow===6)return false;
  const iso=d.toISOString().split('T')[0];
  if(FERIADOS_CL_2026.has(iso))return false;
  return true;
};
// Cuenta días hábiles (lun-vie, sin festivos) entre dos fechas, ambas inclusive
const diasHabilesEntre=(desde,hasta)=>{
  let n=0;
  const cur=new Date(desde);
  cur.setHours(0,0,0,0);
  const end=new Date(hasta);
  end.setHours(0,0,0,0);
  while(cur<=end){
    if(esDiaHabil(cur))n++;
    cur.setDate(cur.getDate()+1);
  }
  return n;
};

// ── SELECTOR DE PERÍODO (mes actual, meses anteriores, rango personalizado) ──
// Devuelve {desde, hasta} en formato YYYY-MM-DD según la selección
function rangoPeriodo(sel, custom){
  const hoy=new Date();
  const y=hoy.getFullYear(), mo=hoy.getMonth();
  const fmt=d=>d.toISOString().split('T')[0];
  if(sel==='custom'&&custom&&custom.desde&&custom.hasta){
    return {desde:custom.desde, hasta:custom.hasta};
  }
  if(sel==='all'){return {desde:'2000-01-01', hasta:fmt(hoy)};}
  // sel tipo 'm0' (mes actual), 'm1' (mes anterior), 'm2', etc.
  if(sel&&sel[0]==='m'){
    const back=parseInt(sel.slice(1))||0;
    const ini=new Date(y, mo-back, 1);
    const fin=new Date(y, mo-back+1, 0); // último día del mes
    return {desde:fmt(ini), hasta:fmt(fin)};
  }
  // fallback: mes actual
  return {desde:fmt(new Date(y,mo,1)), hasta:fmt(hoy)};
}
const MESES_ES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function opcionesMeses(){
  const hoy=new Date();const arr=[];
  for(let i=0;i<6;i++){
    const d=new Date(hoy.getFullYear(),hoy.getMonth()-i,1);
    arr.push({id:'m'+i, label:(i===0?'Mes actual · ':'')+MESES_ES[d.getMonth()]+' '+d.getFullYear()});
  }
  return arr;
}

function Eficiencia(){
  const [tramos,setTramos]=useState([]);
  const [sel,setSel]=useState('m0');
  const [custom,setCustom]=useState({desde:'',hasta:''});
  const [patFil,setPatFil]=useState('todos');
  const [grupo,setGrupo]=useState('todos');
  const [tipoFil,setTipoFil]=useState('todos');
  useEffect(()=>{api.get().then(setTramos);},[]);

  const rango=useMemo(()=>rangoPeriodo(sel,custom),[sel,custom]);

  const byT=useMemo(()=>{
    const desde=rango.desde, hasta=rango.hasta;
    const m={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      if(noEficiencia(t.patente))return;
      const f=t.fecha_carga||(t.created_at?new Date(t.created_at).toISOString().split('T')[0]:'');
      if(f<desde||f>hasta)return;
      if(!m[t.patente])m[t.patente]={pat:t.patente,cond:TRUCKS.find(x=>x.p===t.patente)?.c||'—',grupo:grupoPatente(t.patente),tipo:tipoPatente(t.patente,t.fecha_carga),n:0,ing:0,cos:0,kmC:0,kmV:0,sinGuia:0,rangos:[]};
      const {tarifa,costo,extras}=calcT(t);
      const p=m[t.patente];
      p.n++;
      if(p.grupo==='terceros'){
        // Ingreso DITrucks = utilidad con tercero (de la ruta). Costo 0: ya es utilidad neta.
        p.ing+=utilidadTercero(t);
      }else{
        p.ing+=tarifa+extras;
        p.cos+=costo;
      }
      p.kmC+=findR(t.cliente,t.origen,t.destino)?.k||0;
      p.kmV+=t.km_vacio||0;
      if(!t.guia)p.sinGuia++;
      // Días de traslado del tramo (carga → descarga, mínimo 1). Se usa para el pago
      // especial de KKLL-43 (por día de traslado, no por sueldo fijo).
      if(t.fecha_carga){
        const fc=new Date(t.fecha_carga+'T00:00:00');
        const fd=new Date((t.fecha_desc||t.fecha_carga)+'T00:00:00');
        const dias=Math.max(1,Math.round((fd-fc)/86400000)+1);
        p.diasTraslado=(p.diasTraslado||0)+dias;
      }
      // Guardar rango de actividad del tramo (de carga a descarga, o solo carga si aún no descarga)
      if(t.fecha_carga){
        p.rangos=p.rangos||[];
        p.rangos.push({desde:t.fecha_carga,hasta:t.fecha_desc||t.fecha_carga});
      }
    });
    // Diagnóstico: por qué algunos tramos no se cuentan
    const sinPatente=tramos.filter(t=>!t.patente).length;
    const fueraPeriodo=tramos.filter(t=>{const f=t.fecha_carga||'';return t.patente&&(f<desde||f>hasta);}).length;
    // Días hábiles totales del período (excluye sáb/dom/festivos)
    const desdeD=new Date(desde+'T00:00:00');
    const hastaD=new Date(Math.min(new Date(hasta+'T00:00:00').getTime(), Date.now()));
    const totalDiasHabiles=diasHabilesEntre(desdeD,hastaD);
    Object.values(m).forEach(p=>{
      const rangos=(p.rangos||[]).sort((a,b)=>a.desde.localeCompare(b.desde));
      // Fusionar/ordenar rangos por fecha de inicio. Para cada par de rangos consecutivos,
      // el "hueco" entre el fin de uno (fecha_desc) y el inicio del siguiente (fecha_carga)
      // solo cuenta como inactividad real si contiene días hábiles estrictamente entre ambos.
      // Ej: descarga viernes, carga lunes → hueco = sábado,domingo → 0 días hábiles → no inactivo.
      // Ej: descarga jueves, viernes feriado, carga lunes → hueco = viernes,sábado,domingo → 0 hábiles → no inactivo.
      // Ej: descarga lunes, carga miércoles (martes libre hábil) → 1 día hábil de hueco → 1 inactivo.
      let diasInactivosCamion=0;
      for(let i=0;i<rangos.length-1;i++){
        const finActual=new Date(rangos[i].hasta+'T00:00:00');
        const inicioSiguiente=new Date(rangos[i+1].desde+'T00:00:00');
        // Días estrictamente entre el fin de un tramo y el inicio del siguiente
        const cur=new Date(finActual);
        cur.setDate(cur.getDate()+1);
        while(cur<inicioSiguiente){
          if(esDiaHabil(cur))diasInactivosCamion++;
          cur.setDate(cur.getDate()+1);
        }
      }
      // Además: días hábiles del período ANTES del primer tramo y DESPUÉS del último tramo
      // (camión sin actividad al inicio o al final de la ventana) también cuentan como inactivos.
      let diasAntes=0,diasDespues=0;
      if(rangos.length>0){
        const inicioPeriodo=new Date(desde+'T00:00:00');
        const primerInicio=new Date(rangos[0].desde+'T00:00:00');
        const cur1=new Date(inicioPeriodo);
        while(cur1<primerInicio){
          if(esDiaHabil(cur1))diasAntes++;
          cur1.setDate(cur1.getDate()+1);
        }
        const ultimoFin=new Date(rangos[rangos.length-1].hasta+'T00:00:00');
        const cur2=new Date(ultimoFin);
        cur2.setDate(cur2.getDate()+1);
        while(cur2<=hastaD){
          if(esDiaHabil(cur2))diasDespues++;
          cur2.setDate(cur2.getDate()+1);
        }
      }
      p.diasInactivos=diasInactivosCamion+diasAntes+diasDespues;
      p.diasActivos=totalDiasHabiles-p.diasInactivos;
    });
    // Utilidad neta por equipo = utilidad bruta − costo conductor (sueldo o pago por día)
    Object.values(m).forEach(p=>{
      const u=p.ing-p.cos;
      if(p.grupo==='terceros'){p.utilNeta=u;return;}
      const costoCond=PATENTES_PAGO_DIA.includes(p.pat)?(p.diasTraslado||0)*PAGO_DIA_TRASLADO:SUELDO_PROM_CONDUCTOR;
      p.utilNeta=u-costoCond;
    });
    const result=Object.values(m).sort((a,b)=>b.utilNeta-a.utilNeta);
    result._sinPatente=sinPatente;
    result._fueraPeriodo=fueraPeriodo;
    result._totalTramos=tramos.length;
    return result;
  },[tramos,sel,custom]);

  const src=useMemo(()=>{
    let r=byT;
    if(tipoFil!=='todos')r=r.filter(p=>p.tipo===tipoFil);
    if(patFil!=='todos')return r.filter(p=>p.pat===patFil);
    if(grupo!=='todos')return r.filter(p=>p.grupo===grupo);
    return r;
  },[byT,patFil,grupo,tipoFil]);

  // Análisis de camiones con utilidad negativa vs los 3 mejores
  const analisisNegativos=useMemo(()=>{
    const conUtil=src.map(p=>({...p,util:p.ing-p.cos})).filter(p=>p.grupo==='propios');
    const ordenados=[...conUtil].sort((a,b)=>b.util-a.util);
    const top3=ordenados.slice(0,3);
    const negativos=ordenados.filter(p=>p.util<0);
    if(negativos.length===0||top3.length===0)return null;
    // Promedios de los top 3
    const avg=k=>top3.reduce((s,p)=>s+(p[k]||0),0)/top3.length;
    const refTramos=avg('n'),refKmC=avg('kmC'),refSinGuia=avg('sinGuia'),refDias=avg('diasInactivos');
    const refIngXtramo=top3.reduce((s,p)=>s+p.ing,0)/Math.max(1,top3.reduce((s,p)=>s+p.n,0));
    // Diagnóstico por cada negativo
    return {
      top3:top3.map(p=>p.pat),
      camiones:negativos.map(p=>{
        const causas=[];
        const ingXtramo=p.n>0?p.ing/p.n:0;
        if(p.sinGuia>0)causas.push(p.sinGuia+' tramo'+(p.sinGuia!==1?'s':'')+' sin guía (ingreso no registrado)');
        if(p.n<refTramos*0.6)causas.push('pocos tramos ('+p.n+' vs '+refTramos.toFixed(0)+' del top)');
        if(p.kmC<refKmC*0.6)causas.push('pocos km cargados ('+Math.round(p.kmC).toLocaleString()+' vs '+Math.round(refKmC).toLocaleString()+')');
        if(ingXtramo<refIngXtramo*0.6&&p.n>0)causas.push('bajo ingreso por tramo ('+fCLP(ingXtramo)+' vs '+fCLP(refIngXtramo)+')');
        if((p.diasInactivos||0)>refDias*1.5&&refDias>0)causas.push((p.diasInactivos||0)+' días inactivos (vs '+refDias.toFixed(0)+' del top)');
        if(causas.length===0)causas.push('costos superan ingresos en el período');
        return {pat:p.pat,cond:p.cond,util:p.util,causas};
      })
    };
  },[src]);

  const tot=useMemo(()=>src.reduce((a,p)=>({
    n:a.n+p.n,ing:a.ing+p.ing,cos:a.cos+p.cos,kmC:a.kmC+p.kmC,kmV:a.kmV+p.kmV,
    diasInactivos:a.diasInactivos+(p.diasInactivos||0)
  }),{n:0,ing:0,cos:0,kmC:0,kmV:0,diasInactivos:0}),[src]);

  const util=tot.ing-tot.cos;
  const pctV=tot.kmC+tot.kmV>0?Math.round(tot.kmV/(tot.kmC+tot.kmV)*100):0;
  // días del período para umbrales de inactividad
  const days=Math.max(1,diasHabilesEntre(new Date(rango.desde+'T00:00:00'),new Date(Math.min(new Date(rango.hasta+'T00:00:00').getTime(),Date.now()))));

  // Exportar a Excel solo los tramos de terceros del período
  const exportTerceros=()=>{

    const {desde,hasta}=rango;
    const filas=tramos.filter(t=>{
      if(!t.patente||grupoPatente(t.patente)!=='terceros')return false;
      const f=t.fecha_carga||'';
      return f>=desde&&f<=hasta;
    }).sort((a,b)=>(a.fecha_carga||'').localeCompare(b.fecha_carga||''));
    if(filas.length===0){alert('No hay tramos de terceros en el período seleccionado');return;}
    const rows=filas.map(t=>{
      const r=findR(t.cliente,t.origen,t.destino);
      const {tarifa,extras}=calcT(t);
      const ingresoReal=tarifa+extras;
      const tarifaTercero=r&&typeof r.tt==='number'?r.tt:null;
      const utilidad=utilidadTercero(t);
      return {
        'Patente':t.patente,
        'Conductor':TRUCKS.find(x=>x.p===t.patente)?.c||'',
        'Fecha':t.fecha_carga||'',
        'Tramo':(t.origen||'')+' → '+(t.destino||''),
        'Cliente':t.cliente||'',
        'Tarifa':Math.round(ingresoReal),
        'Tarifa Tercero':tarifaTercero!==null?Math.round(tarifaTercero):'',
        'Utilidad':Math.round(utilidad),
        'Guía':t.guia||''
      };
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Terceros');
    XLSX.writeFile(wb,'DITrucks_Terceros_'+desde+'_a_'+hasta+'.xlsx');
  };

        )

    ),
    byT.length>1&&e('div',{style:{display:'flex',gap:6,marginBottom:10,overflowX:'auto',paddingBottom:4}},
      ...['todos',...byT.map(p=>p.pat)].map(p=>

          p==='todos'?'Todos':p)
      )
    ),
    (byT._sinPatente>0||byT._fueraPeriodo>0)&&e('div',{style:{marginBottom:10,padding:'8px 12px',background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,fontSize:'.78rem',color:'#92400e'}},
      'ℹ️ De '+byT._totalTramos+' tramos totales, '+tot.n+' se muestran aquí. ',
      byT._sinPatente>0?byT._sinPatente+' sin patente asignada':'',
      byT._sinPatente>0&&byT._fueraPeriodo>0?' · ':'',

    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}},
      ...[[`🚛 Tramos`,tot.n],[`💵 Ingresos`,fCLP(tot.ing)],[`📈 Utilidad`,fCLP(util)],[`🛣️ Km vacíos`,tot.kmV.toLocaleString()+' ('+pctV+'%)']].map(([l,v])=>

    // ── COSTOS FIJOS Y UTILIDAD NETA ──
    (()=>{

      const utilNeta=util-totFijos;
      return e('div',{className:'card',style:{marginBottom:12,padding:'14px 16px'}},

            )

        )

    })(),
    // KPI días inactivos flota
    src.length>0&&e('div',{className:'card',style:{marginBottom:12,borderLeft:'3px solid',borderLeftColor:tot.diasInactivos>src.length*days*0.3?'#ef4444':'#f59e0b'}},
      e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
        e('div',null,
          e('div',{style:{fontSize:'.8rem',color:'#64748b',marginBottom:3}},'😴 Días hábiles inactivos · flota seleccionada'),
          e('div',{style:{display:'flex',alignItems:'baseline',gap:8}},
            e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.3rem',color:tot.diasInactivos>src.length*days*0.3?'#dc2626':'#92400e'}},tot.diasInactivos),
            e('span',{style:{fontSize:'.8rem',color:'#94a3b8'}},'días hábiles sin actividad (excluye fines de semana y festivos)')
          )
        ),
        e('div',{style:{textAlign:'right'}},
          e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},rango.desde+' → '+rango.hasta),
          e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},src.length+' camiones')
        )
      )
    ),
    tot.kmC+tot.kmV>0&&e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.82rem',color:'#64748b',marginBottom:6}},
        e('span',null,'📍 '+tot.kmC.toLocaleString()+' km cargado'),
        e('span',null,'🛣️ '+tot.kmV.toLocaleString()+' km vacío')
      ),
      e('div',{style:{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}},
        tot.kmC>0&&e('div',{style:{background:'linear-gradient(90deg,#00BCD4,#0097A7)',width:(100-pctV)+'%'}}),
        tot.kmV>0&&e('div',{style:{background:'linear-gradient(90deg,#8B5CF6,#6D28D9)',width:pctV+'%'}})
      ),
      e('div',{style:{textAlign:'center',fontSize:'.75rem',color:'#94a3b8',marginTop:4}},'Eficiencia: '+(100-pctV)+'% cargado')
    ),
    src.length===0
      ?e('div',{className:'card',style:{textAlign:'center',padding:48,color:'#94a3b8'}},'📊 Sin datos para el período')
      :src.map(p=>{
        const u=p.ing-p.cos;
        const pv=p.kmC+p.kmV>0?Math.round(p.kmV/(p.kmC+p.kmV)*100):0;
        return e('div',{key:p.pat,className:'card',style:{marginBottom:10}},
          e('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:10}},
            e('div',null,
              e('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:2}},
                e('span',{style:{fontFamily:'monospace',fontWeight:700}},p.pat),
                e('span',{style:{fontSize:'.7rem',padding:'1px 6px',borderRadius:4,fontWeight:600,
                  background:p.grupo==='terceros'?'#fef3c7':'#dbeafe',
                  color:p.grupo==='terceros'?'#92400e':'#1e40af'}},
                  p.grupo==='terceros'?'Tercero':'Propio'),
                e('span',{style:{fontSize:'.7rem',padding:'1px 6px',borderRadius:4,fontWeight:600,background:p.tipo==='plana'?'#fce7f3':'#ede9fe',color:p.tipo==='plana'?'#9d174d':'#5b21b6'}},p.tipo==='plana'?'🔩 Plana':'🛢️ Estanque')
              ),
              e('div',{style:{fontSize:'.82rem',color:'#64748b'}},'👤 '+p.cond)
            ),
            e('div',{style:{textAlign:'right'}},
              e('div',{style:{fontFamily:'monospace',fontWeight:700,color:u>=0?'#059669':'#dc2626'}},fCLP(u)),
              e('div',{style:{fontSize:'.75rem',color:'#94a3b8'}},p.n+' tramo'+(p.n!==1?'s':''))
            )
          ),
          e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:8}},
            ...[[`Ingresos`,fCLP(p.ing),'#f0fdf4','#166534'],['Costos',fCLP(p.cos),'#fef2f2','#991b1b'],['Km vacío',p.kmV.toLocaleString(),'#f5f3ff','#5b21b6']].map(([l,v,bg,col])=>
              e('div',{key:l,style:{background:bg,borderRadius:8,padding:8,textAlign:'center'}},
                e('div',{style:{fontSize:'.72rem',color:col,marginBottom:2}},l),
                e('div',{style:{fontFamily:'monospace',fontWeight:700,color:col,fontSize:'.82rem'}},v)
              )
            )
          ),
          e('div',{style:{display:'flex',height:6,borderRadius:3,overflow:'hidden',background:'#f1f5f9',marginBottom:4}},

          p.grupo!=='terceros'&&(()=>{

            const costoConductor=esPagoDia?(p.diasTraslado||0)*PAGO_DIA_TRASLADO:SUELDO_PROM_CONDUCTOR;

            return e('div',{style:{marginTop:8,padding:'8px 10px',borderRadius:8,background:'#f8fafc',border:'1px solid #e2e8f0'}},

              ),
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:4,borderTop:'1px solid #e2e8f0'}},
                e('span',{style:{fontSize:'.8rem',fontWeight:700,color:'#0A1929'}},'💰 Utilidad neta equipo'),
                e('span',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.9rem',color:utilNetaEq>=0?'#059669':'#dc2626'}},fCLP(utilNetaEq))
              )
            );
          })(),
          p.diasInactivos>0&&e('div',{style:{marginTop:6,fontSize:'.78rem',background:p.diasInactivos>Math.min(days,30)*0.4?'#fef2f2':'#fffbeb',color:p.diasInactivos>Math.min(days,30)*0.4?'#991b1b':'#92400e',borderRadius:6,padding:'6px 10px'}},
            '😴 '+p.diasInactivos+' día'+(p.diasInactivos!==1?'s':'')+' hábil'+(p.diasInactivos!==1?'es':'')+' inactivo'+(p.diasInactivos!==1?'s':'')+' en el período'
          ),
          p.sinGuia>0&&e('div',{style:{marginTop:6,fontSize:'.78rem',background:'#fffbeb',color:'#92400e',borderRadius:6,padding:'6px 10px'}},
            '⚠️ '+p.sinGuia+' tramo'+(p.sinGuia!==1?'s':'')+' sin guía'
          )
        );
      })
  );
}


// ── REGIONES ──
const REGIONES={
  'I':['ARICA','PUTRE'],
  'II':['IQUIQUE','ALTO HOSPICIO'],
  'III':['ANTOFAGASTA','MEJILLONES','CALAMA','TOCOPILLA'],
  'IV':['CALDERA','COPIAPO','TIERRA AMARILLA'],
  'V':['LA SERENA','COQUIMBO','OVALLE'],
  'VI':['VALPARAISO','VIÑA DEL MAR','CON-CON','CALERA','CASABLANCA','SAN ANTONIO'],
  'VII':['SANTIAGO','MAIPU','SAN BERNARDO','PEÑAFLOR','PADRE HURTADO','MALLOCO','TALAGANTE','LAMPA','PUDAHUEL'],
  'VIII':['RANCAGUA','MOSTAZAL','SAN FRANCISCO MOSTAZAL','PAINE','MALLARAUCO','ACULEO','MELIPILLA','ROSARIO'],
  'IX':['SAN FERNANDO','PICHIDEGUA','NANCAGUA','RENGO','LO MIRANDA'],
  'X':['CURICO','TENO','LONTUE','TALCA'],
  'XI':['LINARES','PARRAL','RETIRO'],
  'XII':['CHILLAN','BULNES'],
  'XIII':['LOS ANGELES','CORONEL','TALCAHUANO','CONCEPCION','CISTERNAS','LOTA'],
  'XIV':['TEMUCO','FREIRE','VICTORIA'],
  'XV':['OSORNO','RIO BUENO'],
  'XVI':['PUERTO MONTT','LLANQUIHUE','CALBUCO','PARGUA'],
  'XVII':['CASTRO','QUELLON','ANCUD'],
};
const getRegion=(ciudad)=>{
  if(!ciudad)return'Sin destino';
  const c=ciudad.toUpperCase();
  for(const[reg,cities]of Object.entries(REGIONES)){
    if(cities.includes(c))return reg+' Región';
  }
  return'Otra región';
};
const REGION_NAMES={
  'I Región':'Arica y Parinacota','II Región':'Tarapacá',
  'III Región':'Antofagasta','IV Región':'Atacama',
  'V Región':'Coquimbo','VI Región':'Valparaíso',
  'VII Región':'Metropolitana','VIII Región':"O'Higgins",
  'IX Región':'Maule','X Región':'Maule Sur',
  'XI Región':'Ñuble Norte','XII Región':'Ñuble',
  'XIII Región':'Biobío','XIV Región':'Araucanía',
  'XV Región':'Los Lagos Norte','XVI Región':'Los Lagos',
  'XVII Región':'Los Lagos Sur / Chiloé',
  'Sin destino':'Sin destino registrado','Otra región':'Otra región',
};
const FIJOS_CORONEL=['GWKV-11','RVTZ-27'];

// ── DISPONIBILIDAD ──
function Disponibilidad({tramos,recargar}){
  const [actualizando,setActualizando]=useState(false);
  const [okMsg,setOkMsg]=useState(false);
  // ── MANTENCIÓN: usa la tabla 'mantencion' existente como bitácora (entrada/salida) ──
  const [mants,setMants]=useState([]);
  const [formMant,setFormMant]=useState(false);
  const [mPat,setMPat]=useState('');
  const [mMotivo,setMMotivo]=useState('');
  const [guardandoM,setGuardandoM]=useState(false);
  // ── REASIGNACIÓN DE EQUIPO (rampla / conductor) ──
  const [asignVer,setAsignVer]=useState(0);
  const [formEq,setFormEq]=useState(false);
  const [ePat,setEPat]=useState('');
  const [eAcop,setEAcop]=useState('');
  const [eCond,setECond]=useState('');
  const [ePerm,setEPerm]=useState(true);
  const [eMsg,setEMsg]=useState('');
  // ── SUB-PESTAÑAS ──
  const [subTab,setSubTab]=useState('ubicacion');
  // ── ESTADOS (conductores / tractos / semis) y LECTURAS DE KM ──
  const [equipos,setEquipos]=useState([]);
  const [edit,setEdit]=useState(null); // {tipo,nombre,estado,comentario}
  const [kmEdit,setKmEdit]=useState(null); // {patente,km}
  const loadEquipos=()=>api.getEquipos().then(d=>setEquipos(Array.isArray(d)?d:[]));
  useEffect(()=>{loadEquipos();},[]);
  // Estado vigente por elemento (el registro más reciente manda sobre el inicial)
  const estados=useMemo(()=>{
    const m={...ESTADOS_INI};
    [...equipos].filter(x=>x.tipo!=='km')
      .sort((a,b)=>(a.created_at||0)-(b.created_at||0))
      .forEach(x=>{if(x.tipo&&x.nombre)m[x.tipo+'|'+x.nombre]={estado:x.estado||'',comentario:x.comentario||''};});
    return m;
  },[equipos]);
  const guardarEstado=async()=>{
    if(!edit)return;
    const ok=await api.setEquipo({id:Date.now().toString(),created_at:Date.now(),tipo:edit.tipo,nombre:edit.nombre,estado:edit.estado||'',comentario:edit.comentario||'',km_base:null,fecha_base:null,actualizado_por:''});
    if(!ok)alert('No se pudo guardar en la nube. Crea la tabla "equipos" en Supabase (ver instrucciones).');
    await loadEquipos();setEdit(null);
  };
  // Lectura de km más reciente por patente (si no hay, el odómetro base de la planilla)
  const kmBase=useMemo(()=>{
    const m={};
    TRUCKS.forEach(t=>{if(t.km!=null)m[t.p]={km:t.km,fecha:FECHA_KM_BASE};});
    [...equipos].filter(x=>x.tipo==='km'&&x.nombre)
      .sort((a,b)=>(a.created_at||0)-(b.created_at||0))
      .forEach(x=>{m[x.nombre]={km:Number(x.km_base)||0,fecha:x.fecha_base||FECHA_KM_BASE};});
    return m;
  },[equipos]);
  // Km actual = odómetro base + km de los tramos posteriores a esa lectura
  const kmActual=useMemo(()=>{
    const m={};
    Object.entries(kmBase).forEach(([p,b])=>{m[p]={...b,recorridos:0};});
    tramos.forEach(t=>{
      const b=m[t.patente];if(!b)return;
      if(!t.fecha_carga||t.fecha_carga<=b.fecha)return;
      b.recorridos+=(findR(t.cliente,t.origen,t.destino)?.k||0)+Number(t.km_vacio||0);
    });
    Object.values(m).forEach(b=>{b.total=b.km+b.recorridos;});
    return m;
  },[kmBase,tramos]);
  const guardarKm=async()=>{
    if(!kmEdit||!kmEdit.patente)return;
    const ok=await api.setEquipo({id:Date.now().toString(),created_at:Date.now(),tipo:'km',nombre:kmEdit.patente,estado:'',comentario:'',km_base:Number(kmEdit.km)||0,fecha_base:today(),actualizado_por:''});
    if(!ok)alert('No se pudo guardar en la nube. Crea la tabla "equipos" en Supabase (ver instrucciones).');
    await loadEquipos();setKmEdit(null);
  };
  // Última mantención vigente por patente: el registro 'mant' más reciente sobrescribe el de la planilla
  const ultimaMant=useMemo(()=>{
    const m={};
    TRUCKS.forEach(t=>{if(t.umKm!=null)m[t.p]={km:t.umKm,fecha:t.umFecha||''};});
    [...equipos].filter(x=>x.tipo==='mant'&&x.nombre)
      .sort((a,b)=>(a.created_at||0)-(b.created_at||0))
      .forEach(x=>{m[x.nombre]={km:Number(x.km_base)||0,fecha:x.fecha_base||''};});
    return m;
  },[equipos]);
  // Editor de mantención realizada {patente, km, fecha}
  const [mantEdit,setMantEdit]=useState(null);
  const guardarMantRealizada=async()=>{
    if(!mantEdit||!mantEdit.patente)return;
    const ok=await api.setEquipo({id:Date.now().toString(),created_at:Date.now(),tipo:'mant',nombre:mantEdit.patente,estado:'',comentario:mantEdit.comentario||'',km_base:Number(mantEdit.km)||0,fecha_base:mantEdit.fecha||today(),actualizado_por:''});
    if(!ok){alert('No se pudo guardar en la nube. Crea la tabla "equipos" en Supabase (ver instrucciones).');return;}
    await loadEquipos();setMantEdit(null);
  };
  // Semirremolques: los asignados a un tracto + los libres
  const semis=useMemo(()=>{
    const asignados=TRUCKS.filter(t=>!t.baja).map(t=>({semi:equipoDe(t.p).acoplado,tracto:t.p})).filter(x=>x.semi);
    const libres=SEMIS_LIBRES.map(s=>({semi:s,tracto:''}));
    const vistos=new Set();
    return [...asignados,...libres].filter(x=>{if(vistos.has(x.semi))return false;vistos.add(x.semi);return true;})
      .sort((a,b)=>a.semi.localeCompare(b.semi));
  },[asignVer]);
  const seleccionarEq=(p)=>{
    setEPat(p);
    const eq=equipoDe(p);
    setEAcop(eq.acoplado);setECond(eq.conductor);
  };
  const guardarEq=async()=>{
    if(!ePat){alert('Selecciona la patente');return;}
    const okA=await aplicarAsign(ePat,eCond,eAcop,ePerm,'');
    setAsignVer(v=>v+1);
    setEMsg(ePerm?(okA?'✓ Guardado para todos':'⚠️ Aplicado solo en este dispositivo'):'✓ Aplicado');
    setTimeout(()=>setEMsg(''),3500);
    setFormEq(false);setEPat('');setEAcop('');setECond('');
  };
  const loadMants=()=>api.getMant().then(d=>setMants(Array.isArray(d)?d:[]));
  useEffect(()=>{loadMants();},[]);
  // Estado vigente por patente: manda el último movimiento registrado
  const enMantencion=useMemo(()=>{
    const ord=[...mants].filter(x=>x.tipo==='ENTRADA TALLER'||x.tipo==='SALIDA TALLER')
      .sort((a,b)=>String(a.created_at||a.fecha||'').localeCompare(String(b.created_at||b.fecha||'')));
    const m={};
    ord.forEach(x=>{
      if(!x.patente)return;
      if(x.tipo==='ENTRADA TALLER')m[x.patente]={motivo:x.descripcion||'Sin detalle',fecha:x.fecha||''};
      else delete m[x.patente];
    });
    return m;
  },[mants]);
  const marcarMant=async()=>{
    if(guardandoM)return;
    if(!mPat){alert('Selecciona la patente');return;}
    setGuardandoM(true);
    try{
      const ok=await api.addMant({id:Date.now().toString(),created_at:Date.now(),patente:mPat,tipo:'ENTRADA TALLER',descripcion:mMotivo||'',fecha:today(),costo:0,taller:''});
      if(!ok){alert('No se pudo guardar. Revisa la conexión.');return;}
      await loadMants();
      setFormMant(false);setMPat('');setMMotivo('');
    }finally{setGuardandoM(false);}
  };
  const sacarMant=async(pat)=>{
    if(!confirm('¿Marcar '+pat+' como fuera de mantención?'))return;
    await api.addMant({id:Date.now().toString(),created_at:Date.now(),patente:pat,tipo:'SALIDA TALLER',descripcion:'',fecha:today(),costo:0,taller:''});
    await loadMants();
  };
  // ── BACKUP: tractos activos sin rampla asignada ──
  const flotaBackup=useMemo(()=>{
    const activos=TRUCKS.filter(t=>!t.baja);
    const ramplas=new Set(activos.map(t=>(equipoDe(t.p).acoplado||'').trim()).filter(Boolean));
    return {tractos:activos.length,ramplas:ramplas.size,integrados:activos.filter(t=>t.integrado).length,sinRampla:activos.filter(t=>!t.integrado&&!(equipoDe(t.p).acoplado||'').trim()).map(t=>t.p)};
  },[asignVer]);
  const handleRecargar=async()=>{
    if(actualizando)return;
    setActualizando(true);setOkMsg(false);
    try{ await Promise.resolve(recargar&&recargar()); }
    finally{
      setActualizando(false);
      setOkMsg(true);
      setTimeout(()=>setOkMsg(false),2500);
    }
  };
  const disponibles=useMemo(()=>{
    const map={};
    // Agrupar todos los tramos por patente
    const porPatente={};
    tramos.forEach(t=>{
      if(!t.patente)return;
      if(esBaja(t.patente))return;
      if(!porPatente[t.patente])porPatente[t.patente]=[];
      porPatente[t.patente].push(t);
    });
    Object.entries(porPatente).forEach(([pat,lista])=>{
      const truck=TRUCKS.find(x=>x.p===pat);
      if(!truck)return;
      const hoyStr=today();
      // Descartar tramos con fecha claramente errónea para definir la ubicación:
      // fecha de carga en el futuro, o descarga anterior a la carga (imposible).
      const validos=lista.filter(t=>{
        if(t.fecha_carga&&t.fecha_carga>hoyStr)return false; // carga en el futuro
        if(t.fecha_carga&&t.fecha_desc&&t.fecha_desc<t.fecha_carga)return false; // descarga antes que carga
        return true;
      });
      const base=validos.length>0?validos:lista; // si todos son inválidos, usar los que haya
      // La ubicación actual la define el tramo con la FECHA DE CARGA más reciente
      // (no el último ingresado al sistema). Si hay empate, desempata por created_at.
      const ordenados=[...base].sort((a,b)=>
        (b.fecha_carga||'').localeCompare(a.fecha_carga||'')||
        (b.created_at||0)-(a.created_at||0)
      );
      const activo=ordenados[0];
      const t=activo;
      const destino=t.destino||'Sin registro';
      const enTransito=!t.fecha_desc&&!!t.destino;
      let diasDetenido=null;
      if(!enTransito&&t.fecha_desc){
        const desc=new Date(t.fecha_desc+'T00:00:00');
        const hoy=new Date();
        hoy.setHours(0,0,0,0);
        // Contar solo DÍAS HÁBILES (sin fines de semana ni feriados) desde el día
        // siguiente a la descarga hasta hoy inclusive.
        let n=0;
        const cur=new Date(desc);
        cur.setDate(cur.getDate()+1);
        while(cur<=hoy){
          if(esDiaHabil(cur))n++;
          cur.setDate(cur.getDate()+1);
        }
        diasDetenido=n;
      }
      map[pat]={patente:pat,conductor:equipoDe(pat).conductor,acoplado:equipoDe(pat).acoplado,destino,fecha:t.fecha_carga||'',fechaDesc:t.fecha_desc||'',region:getRegion(destino),fijo:false,enTransito,cliente:t.cliente||'',diasDetenido};
    });
    TRUCKS.forEach(t=>{
      if(t.baja)return;
      if(!map[t.p]){
        const esFijo=FIJOS_CORONEL.includes(t.p);
        map[t.p]={patente:t.p,conductor:equipoDe(t.p).conductor,acoplado:equipoDe(t.p).acoplado,destino:esFijo?'CORONEL':'Sin registro',fecha:'',region:esFijo?getRegion('CORONEL'):'Sin destino',fijo:esFijo,enTransito:false,cliente:''};
      }
    });
    return Object.values(map);
  },[tramos,asignVer]);
  // Facturación del mes en curso por camión (para detectar baja facturación)
  const factPorCamion=useMemo(()=>{
    const mesActual=today().slice(0,7);
    const m={};
    tramos.forEach(t=>{
      if(!t.patente||esBaja(t.patente))return;
      if((t.fecha_carga||'').slice(0,7)!==mesActual)return;
      const{tarifa,extras}=calcT(t);
      const grupo=grupoPatente(t.patente);
      const ing=grupo==='terceros'?utilidadTercero(t):(tarifa+extras);
      m[t.patente]=(m[t.patente]||0)+ing;
    });
    return m;
  },[tramos]);
  // Media de facturación (solo camiones propios con actividad este mes)
  const mediaFact=useMemo(()=>{
    const propios=Object.entries(factPorCamion).filter(([p])=>grupoPatente(p)==='propios').map(([,v])=>v);
    if(propios.length===0)return 0;
    return propios.reduce((a,b)=>a+b,0)/propios.length;
  },[factPorCamion]);
  const porRegion=useMemo(()=>{
    const m={};
    disponibles.forEach(d=>{
      const regKey=REGION_NAMES[d.region]||d.region;
      if(!m[regKey])m[regKey]=[];
      m[regKey].push(d);
    });
    return m;
  },[disponibles]);
  const regionOrder=['Arica y Parinacota','Tarapacá','Antofagasta','Atacama','Coquimbo','Valparaíso','Metropolitana',"O'Higgins",'Maule','Maule Sur','Ñuble Norte','Ñuble','Biobío','Araucanía','Los Lagos Norte','Los Lagos','Los Lagos Sur / Chiloé','Sin destino registrado','Otra región'];
  const INTERVALO_MANT=20000; // km entre mantenciones preventivas
  const conductores=[...new Set(TRUCKS.filter(t=>!t.baja&&t.c).flatMap(t=>t.c.split('/').map(x=>x.trim())).filter(Boolean))].sort();
  const colorEstado=(es)=>{
    const s=(es||'').toLowerCase();
    if(s.includes('taller'))return['#fef3c7','#92400e'];
    if(s.includes('vacacion')||s.includes('licencia'))return['#dbeafe','#1e40af'];
    if(s.includes('back'))return['#ede9fe','#5b21b6'];
    if(s.includes('espera'))return['#fee2e2','#991b1b'];
    if(!s)return['#f1f5f9','#64748b'];
    return['#dcfce7','#166534'];
  };
  const filaEstado=(tipo,nombre,sub)=>{
    const st=estados[tipo+'|'+nombre]||{estado:'',comentario:''};
    const cc=colorEstado(st.estado);
    return e('div',{key:tipo+nombre,style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,padding:'8px 0',borderBottom:'1px solid #f1f5f9'}},
      e('div',{style:{minWidth:0}},
        e('div',{style:{fontWeight:600,fontSize:'.84rem',color:'#0A1929'}},nombre),
        sub&&e('div',{style:{fontSize:'.72rem',color:'#94a3b8'}},sub),
        st.comentario&&e('div',{style:{fontSize:'.73rem',color:'#78350f',marginTop:2}},'💬 '+st.comentario)
      ),
      e('div',{style:{display:'flex',alignItems:'center',gap:6,flexShrink:0}},
        e('span',{style:{fontSize:'.72rem',padding:'2px 8px',borderRadius:99,fontWeight:700,background:cc[0],color:cc[1]}},st.estado||'Activo'),
        e('button',{onClick:()=>setEdit({tipo,nombre,estado:st.estado||'',comentario:st.comentario||''}),style:{padding:'2px 8px',background:'white',color:'#0097A7',border:'1px solid #b2ebf2',borderRadius:6,fontWeight:600,cursor:'pointer',fontSize:'.72rem',fontFamily:'Geist,sans-serif'}},'✏️')
      )
    );
  };
  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{display:'flex',gap:0,marginBottom:14,borderBottom:'2px solid #f1f5f9'}},
      ...[['ubicacion','📍 Ubicación'],['estados','👥 Estados'],['mant','🔧 Mantención & Km']].map(x=>
        e('button',{key:x[0],onClick:()=>setSubTab(x[0]),style:{padding:'10px 14px',border:'none',borderBottom:'2px solid',borderBottomColor:subTab===x[0]?'#0097A7':'transparent',background:'none',color:subTab===x[0]?'#0097A7':'#64748b',fontWeight:subTab===x[0]?700:400,cursor:'pointer',fontSize:'.85rem',fontFamily:'Geist,sans-serif'}},x[1]))
    ),
    edit&&e('div',{className:'card',style:{marginBottom:12,border:'2px solid #b2ebf2'}},
      e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929',marginBottom:10}},'✏️ '+edit.nombre),
      e('label',{className:'lbl'},'Estado'),
      e('input',{className:'inp',list:'estados-sug',value:edit.estado,onChange:ev=>setEdit({...edit,estado:ev.target.value}),placeholder:'Activo, Taller, Vacaciones, Back up…',style:{marginBottom:8}}),
      e('datalist',{id:'estados-sug'},...['Activo','Taller','Vacaciones','Licencia médica','Back up','En espera de tercero','Viaje'].map(o=>e('option',{key:o,value:o}))),
      e('label',{className:'lbl'},'Comentario'),
      e('input',{className:'inp',value:edit.comentario,onChange:ev=>setEdit({...edit,comentario:ev.target.value}),placeholder:'Detalle o motivo'}),
      e('div',{style:{display:'flex',gap:8,marginTop:12}},
        e('button',{onClick:guardarEstado,style:{padding:'.5rem 1rem',background:'#0097A7',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'Guardar'),
        e('button',{onClick:()=>setEdit(null),style:{padding:'.5rem 1rem',background:'white',color:'#64748b',border:'1.5px solid #e2e8f0',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'Cancelar')
      )
    ),
    subTab==='estados'&&e('div',null,
      e('div',{className:'card',style:{marginBottom:12}},
        e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929',marginBottom:6}},'👤 Conductores ('+conductores.length+')'),
        ...conductores.map(c=>{
          const tr=TRUCKS.filter(t=>!t.baja&&(t.c||'').indexOf(c)>=0).map(t=>t.p).join(', ');
          return filaEstado('conductor',c,tr?'🚛 '+tr:'sin equipo asignado');
        })
      ),
      e('div',{className:'card',style:{marginBottom:12}},
        e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929',marginBottom:6}},'🚛 Tractos ('+TRUCKS.filter(t=>!t.baja).length+')'),
        ...TRUCKS.filter(t=>!t.baja).map(t=>{
          const eq=equipoDe(t.p);
          return filaEstado('tracto',t.p,(eq.conductor||'sin conductor')+(eq.acoplado?' · 🔗 '+eq.acoplado:' · ♻️ sin rampla'));
        })
      ),
      e('div',{className:'card',style:{marginBottom:12}},

          e('input',{className:'inp',type:'number',value:kmEdit.km,onChange:ev=>setKmEdit({...kmEdit,km:ev.target.value}),placeholder:'Km actuales del odómetro'}),
          e('div',{style:{display:'flex',gap:8,marginTop:12}},
            e('button',{onClick:guardarKm,style:{padding:'.5rem 1rem',background:'#0097A7',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'Guardar lectura'),
            e('button',{onClick:()=>setKmEdit(null),style:{padding:'.5rem 1rem',background:'white',color:'#64748b',border:'1.5px solid #e2e8f0',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'Cancelar')
          )
        ),
        urgentes>0&&e('div',{style:{padding:'10px 14px',background:'#fef2f2',borderRadius:10,border:'1.5px solid #fecaca',marginBottom:12,fontSize:'.82rem',color:'#991b1b',fontWeight:700}},'🚨 '+urgentes+' camión'+(urgentes!==1?'es':'')+' requiere'+(urgentes!==1?'n':'')+' mantención pronto (≤5.000 km)'),
        e('div',{style:{fontWeight:700,fontSize:'.85rem',color:'#0A1929',marginBottom:8}},'🚛 Flota propia · orden por urgencia ('+propios.length+')'),
        ...propios.map(fila),
        terceros.length>0&&e('div',{style:{fontWeight:700,fontSize:'.85rem',color:'#64748b',marginTop:16,marginBottom:8}},'🤝 Terceros · solo km acumulados ('+terceros.length+')'),
        ...terceros.map(fila)

    })(),
    subTab==='ubicacion'&&e('div',null,
    e('div',{style:{display:'flex',justifyContent:'flex-end',alignItems:'center',gap:10,marginBottom:10}},
      okMsg&&e('span',{style:{fontSize:'.8rem',color:'#059669',fontWeight:600}},'✓ Ubicaciones actualizadas'),
      eMsg&&e('span',{style:{fontSize:'.78rem',color:'#059669',fontWeight:600}},eMsg),
      e('button',{onClick:()=>{setFormEq(v=>!v);setFormMant(false);},style:{padding:'.5rem 1rem',background:formEq?'#5b21b6':'#ede9fe',color:formEq?'white':'#5b21b6',border:'1.5px solid '+(formEq?'#5b21b6':'#ddd6fe'),borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},formEq?'✕ Cerrar':'🔗 Asignar rampla'),
      recargar&&e('button',{onClick:handleRecargar,disabled:actualizando,style:{padding:'.5rem 1rem',background:actualizando?'#94a3b8':'#0097A7',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:actualizando?'wait':'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},actualizando?'⏳ Actualizando…':'🔄 Reactualizar ubicación')
    ),
    // Formulario para reasignar rampla / conductor
    formEq&&e('div',{className:'card',style:{marginBottom:12,border:'2px solid #ddd6fe'}},

      e('label',{className:'lbl'},'Tracto (patente)'),
      e('select',{className:'inp',value:ePat,onChange:ev=>seleccionarEq(ev.target.value),style:{cursor:'pointer',marginBottom:8}},
        e('option',{value:''},'Seleccionar tracto…'),
        ...TRUCKS.filter(t=>!t.baja).map(t=>{const eq=equipoDe(t.p);return e('option',{key:t.p,value:t.p},t.p+(eq.acoplado?' · 🔗 '+eq.acoplado:' · ♻️ backup'));})
      ),
      e('label',{className:'lbl'},'Semi / rampla'),
      e('input',{className:'inp',value:eAcop,onChange:ev=>setEAcop(ev.target.value),placeholder:'Dejar vacío = pasa a ser backup',style:{marginBottom:8}}),
      e('label',{className:'lbl'},'Conductor'),
      e('input',{className:'inp',value:eCond,onChange:ev=>setECond(ev.target.value),placeholder:'Nombre del conductor'}),
      e('label',{style:{display:'flex',alignItems:'center',gap:8,marginTop:10,cursor:'pointer',fontSize:'.8rem',color:'#475569'}},
        e('input',{type:'checkbox',checked:ePerm,onChange:ev=>setEPerm(ev.target.checked),style:{width:16,height:16,cursor:'pointer'}}),
        e('span',null,'Permanente ',e('span',{style:{color:'#94a3b8'}},'(queda por defecto para todos)'))
      ),
      e('button',{onClick:guardarEq,style:{marginTop:12,padding:'.55rem 1.1rem',background:'#5b21b6',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.84rem',fontFamily:'Geist,sans-serif'}},'Guardar asignación')
    ),
    e('div',{style:{marginBottom:10,padding:'10px 14px',background:'#e0f7fa',borderRadius:10,fontSize:'.85rem',color:'#006064'}},
      '📍 Último destino por camión · ',
      e('strong',null,disponibles.filter(d=>d.destino!=='Sin registro').length),
      ' de ',e('strong',null,disponibles.length),' camiones con actividad'
    ),
    // Indicador de backup: tractos sin rampla asignada
    e('div',{style:{marginBottom:16,padding:'10px 14px',background:flotaBackup.sinRampla.length>0?'#f5f3ff':'#f8fafc',borderRadius:10,fontSize:'.82rem',color:flotaBackup.sinRampla.length>0?'#5b21b6':'#64748b',border:'1px solid '+(flotaBackup.sinRampla.length>0?'#ddd6fe':'#e2e8f0')}},
      '🚛 ',e('strong',null,flotaBackup.tractos),' tractos · 🔗 ',e('strong',null,flotaBackup.ramplas),' ramplas',
      flotaBackup.sinRampla.length>0
        ? e('span',null,' · ♻️ ',e('strong',null,flotaBackup.sinRampla.length),' de backup (sin rampla): ',flotaBackup.sinRampla.join(', '))
        : e('span',null,' · sin equipos de backup'),
      flotaBackup.integrados>0&&e('span',null,' · 🛢️ '+flotaBackup.integrados+' con estanque integrado')
    ),
    Object.keys(enMantencion).length>0&&e('div',{style:{marginBottom:16,padding:'10px 14px',background:'#fffbeb',borderRadius:10,border:'1px solid #fde68a'}},
      e('div',{style:{fontSize:'.78rem',fontWeight:700,color:'#92400e',marginBottom:6}},'🔧 En mantención ('+Object.keys(enMantencion).length+')'),
      ...Object.entries(enMantencion).map(([pat,info])=>e('div',{key:pat,style:{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'.78rem',padding:'2px 0',gap:8}},
        e('span',{style:{color:'#78350f'}},e('strong',null,pat),' · ',info.motivo,info.fecha?' · desde '+info.fecha:''),
        e('button',{onClick:()=>sacarMant(pat),style:{padding:'2px 8px',background:'white',color:'#059669',border:'1px solid #a7f3d0',borderRadius:6,fontWeight:600,cursor:'pointer',fontSize:'.72rem',fontFamily:'Geist,sans-serif',flexShrink:0}},'✓ Sacar')
      ))
    ),
    regionOrder.filter(r=>porRegion[r]&&porRegion[r].length>0).map(nombre=>{
      const cams=porRegion[nombre];
      return e('div',{key:nombre,className:'card',style:{marginBottom:12}},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,paddingBottom:10,borderBottom:'1px solid #f1f5f9'}},
          e('div',{style:{fontWeight:700,fontSize:'.95rem',color:'#0A1929'}},nombre),
          e('div',{style:{fontSize:'.78rem',color:'#94a3b8'}},cams.length+' camión'+(cams.length!==1?'es':''))
        ),
        cams.map(d=>e('div',{key:d.patente,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #f8fafc'}},

            e('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},

                color:d.diasDetenido===0?'#166534':d.diasDetenido<=1?'#713f12':d.diasDetenido<=3?'#92400e':'#991b1b',
              }},
                d.diasDetenido===0?'⚡ Descargó hoy':
                d.diasDetenido===1?'🕐 1 día detenido':
                d.diasDetenido<=3?'⏳ '+d.diasDetenido+' días detenido':
                '🔴 '+d.diasDetenido+' días detenido'
              ),
              // Alerta de baja facturación (bajo la media, solo camiones propios con actividad)
              (()=>{
                if(grupoPatente(d.patente)!=='propios')return null;
                const fact=factPorCamion[d.patente];
                if(fact==null||mediaFact<=0)return null;
                if(fact<mediaFact*0.6)return e('span',{style:{fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:700,background:'#fee2e2',color:'#991b1b'}},'📉 Baja facturación');
                return null;
              })(),
              enMantencion[d.patente]&&e('span',{style:{fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:700,background:'#fef3c7',color:'#92400e'}},'🔧 En mantención'),
              (!d.acoplado&&!esIntegrado(d.patente))&&e('span',{style:{fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:700,background:'#ede9fe',color:'#5b21b6'}},'♻️ Backup'),
              esIntegrado(d.patente)&&e('span',{style:{fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:700,background:'#e0f2fe',color:'#075985'}},'🛢️ Estanque integrado'),
              (()=>{const st=estados['tracto|'+d.patente];if(!st||!st.estado)return null;const cc=colorEstado(st.estado);return e('span',{style:{fontSize:'.72rem',padding:'1px 7px',borderRadius:4,fontWeight:700,background:cc[0],color:cc[1]}},st.estado);})(),

            e('div',{style:{fontSize:'.77rem',color:'#64748b',marginTop:2}},'👤 '+d.conductor+(d.acoplado?' · 🔗 '+d.acoplado:'')+(d.enTransito&&d.cliente?' · '+d.cliente:''),
              (()=>{const st=estados['conductor|'+(d.conductor||'')];if(!st||!st.estado)return null;const cc=colorEstado(st.estado);return e('span',{style:{fontSize:'.68rem',marginLeft:6,padding:'1px 6px',borderRadius:99,fontWeight:700,background:cc[0],color:cc[1]}},st.estado);})()

              const s1=d.acoplado?estados['semi|'+d.acoplado]:null;if(s1&&(s1.estado||s1.comentario))cs.push('🔗 '+d.acoplado+': '+[s1.estado,s1.comentario].filter(Boolean).join(' · '));
              if(cs.length===0)return null;
              return e('div',{style:{fontSize:'.72rem',color:'#78350f',marginTop:2}},'💬 '+cs.join('  ·  '));
            })(),
            (()=>{
              if(grupoPatente(d.patente)!=='propios')return null;
              const fact=factPorCamion[d.patente];
              if(fact==null||mediaFact<=0)return null;

              return e('div',{style:{fontSize:'.72rem',color:bajo?'#b91c1c':'#94a3b8',marginTop:2,fontWeight:bajo?600:400}},'💰 '+fCLP(fact)+' este mes · '+pct+'% de la media'+(bajo?' ⚠️':''));
            })()

    )

const MESES_NOM={'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio','07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
function HistorialMensual(){
  const [tramos,setTramos]=useState([]);
  const [mesSel,setMesSel]=useState('');
  useEffect(()=>{api.get().then(setTramos);},[]);
  // Combinar: histórico del Excel (ene-may) + meses del sistema (jun en adelante)
  const dataSistema=useMemo(()=>{
    const m={};
    tramos.forEach(t=>{
      if(!t.patente||!t.fecha_carga)return;
      const mes=t.fecha_carga.slice(0,7);
      if(mes<'2026-06')return; // ene-may viene del Excel histórico
      if(!m[mes])m[mes]={tramos:0,facturado:0,propioTramos:0,propioMonto:0,terceroTramos:0,terceroMonto:0,kmReales:0,gastoReal:0,clientesMap:{}};
      const{tarifa,costo,extras}=calcT(t);
      const ing=tarifa+extras;
      const esTercero=grupoPatente(t.patente)==='terceros';
      const bloque=m[mes];
      bloque.tramos++;bloque.facturado+=ing;
      bloque.kmReales+=(findR(t.cliente,t.origen,t.destino)?.k||0)+Number(t.km_vacio||0);
      bloque.gastoReal+=costo;
      if(esTercero){bloque.terceroTramos++;bloque.terceroMonto+=ing;}
      else{bloque.propioTramos++;bloque.propioMonto+=ing;}
      const cl=t.cliente||'—';
      if(!bloque.clientesMap[cl])bloque.clientesMap[cl]={n:cl,tramos:0,monto:0};
      bloque.clientesMap[cl].tramos++;bloque.clientesMap[cl].monto+=ing;
    });
    Object.values(m).forEach(b=>{b.clientes=Object.values(b.clientesMap).sort((a,c)=>c.monto-a.monto).slice(0,15);delete b.clientesMap;});
    return m;
  },[tramos]);
  // Todos los meses combinados
  const todosMeses=useMemo(()=>{
    const combinado={...HIST_MENSUAL,...dataSistema};
    return Object.keys(combinado).sort().reverse().map(k=>({mes:k,...combinado[k]}));
  },[dataSistema]);

  // ── RESUMEN MENSUAL ──
  // Ene-mar: solo facturación real (sin margen, no representativo).
  // Abr-may: histórico sin costo por tramo → se estima el gasto con el RATIO real
  //   (gasto/facturado) de los meses que sí vienen del sistema (jun+), ya que los
  //   tramos son los mismos siempre.
  // Jun en adelante: margen real directo del sistema.
  const resumenMeses=useMemo(()=>{
    // Ratio de gasto de los meses reales del sistema (jun+)
    let sumF=0,sumG=0;
    todosMeses.forEach(m=>{if(m.gastoReal!=null&&m.facturado>0){sumF+=m.facturado;sumG+=m.gastoReal;}});
    const ratioGasto=sumF>0?sumG/sumF:null;
    // Meses a los que aplicamos el ratio estimado (abril y mayo del histórico)
    const MESES_ESTIMAR=['2026-04','2026-05'];
    return todosMeses.map(m=>{
      if(m.gastoReal!=null){
        // Mes real del sistema
        const margen=m.facturado-m.gastoReal;
        return {...m,gasto:m.gastoReal,margen,margenPct:m.facturado>0?margen/m.facturado*100:0,tieneCosto:true,estimado:false};
      }
      if(MESES_ESTIMAR.includes(m.mes)&&ratioGasto!=null){
        // Estimar gasto con el ratio real
        const gasto=Math.round(m.facturado*ratioGasto);
        const margen=m.facturado-gasto;
        return {...m,gasto,margen,margenPct:m.facturado>0?margen/m.facturado*100:0,tieneCosto:true,estimado:true};
      }
      // Ene-mar: solo facturación
      return {...m,gasto:null,margen:null,margenPct:null,tieneCosto:false,estimado:false};
    });
  },[todosMeses]);
  const totalRes=useMemo(()=>resumenMeses.reduce((a,m)=>({facturado:a.facturado+m.facturado,margen:a.margen+(m.margen||0)}),{facturado:0,margen:0}),[resumenMeses]);

  const totalAnual=useMemo(()=>todosMeses.reduce((a,m)=>({tramos:a.tramos+m.tramos,facturado:a.facturado+m.facturado,propioMonto:a.propioMonto+m.propioMonto,terceroMonto:a.terceroMonto+m.terceroMonto}),{tramos:0,facturado:0,propioMonto:0,terceroMonto:0}),[todosMeses]);
  const nomMes=k=>{const[y,mm]=k.split('-');return (MESES_NOM[mm]||mm)+' '+y;};
  const maxFact=Math.max(...todosMeses.map(m=>m.facturado),1);

  const exportHist=()=>{
    if(typeof XLSX==='undefined'){alert('Excel no disponible');return;}
    const rows=resumenMeses.slice().reverse().map(m=>({'Mes':nomMes(m.mes),'Tramos':m.tramos,'Facturado':m.facturado,'Gasto':m.tieneCosto?Math.round(m.gasto):'','Margen $':m.tieneCosto?Math.round(m.margen):'','Margen %':m.tieneCosto?m.margenPct.toFixed(1)+'%':'solo facturación','Propios ($)':m.propioMonto,'Terceros ($)':m.terceroMonto}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Historial');
    XLSX.writeFile(wb,'DITrucks_Historial_2026.xlsx');
  };

  const detalle=mesSel?({...HIST_MENSUAL,...dataSistema})[mesSel]:null;

  return e('div',{style:{maxWidth:720,margin:'0 auto',paddingBottom:48}},
    e('div',{style:{padding:'10px 14px',background:'#eff6ff',borderRadius:10,fontSize:'.8rem',color:'#1e40af',marginBottom:12}},
      'ℹ️ Enero a Mayo: datos históricos importados. Junio en adelante: calculado en vivo desde el sistema. Este historial no afecta las demás pestañas.'
    ),
    // KPIs anuales
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}},
      ...[
        ['💰 Total facturado '+(new Date().getFullYear()),fCLP(totalAnual.facturado),'#f0fdf4','#166534'],
        ['📦 Total tramos',totalAnual.tramos.toLocaleString(),'#eff6ff','#1e40af'],
        ['🏠 Propios',fCLP(totalAnual.propioMonto),'#f5f3ff','#5b21b6'],
        ['🤝 Terceros',fCLP(totalAnual.terceroMonto),'#fffbeb','#92400e'],
      ].map(([l,v,bg,col])=>e('div',{key:l,style:{background:bg,borderRadius:10,padding:14,textAlign:'center'}},
        e('div',{style:{fontSize:'.74rem',color:col,marginBottom:4,fontWeight:600}},l),
        e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.05rem',color:col}},v)
      ))
    ),
    // ── PANEL DE SIMULACIÓN DE MARGEN ──
    e('div',{className:'card',style:{marginBottom:14,padding:'16px',border:'2px solid #c7d2fe'}},
      e('div',{style:{fontWeight:700,fontSize:'.95rem',color:'#0A1929',marginBottom:4}},'📊 Resumen mensual'),
      e('div',{style:{fontSize:'.76rem',color:'#64748b',marginBottom:12,lineHeight:1.5}},
        'Enero a marzo: solo facturación real. Abril–mayo: gasto estimado con el ratio real de los meses del sistema (mismos tramos). Junio en adelante: margen real directo del sistema.'
      ),
      // Totales
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}},
        ...[
          ['Facturado total',fCLP(totalRes.facturado),'#f0fdf4','#166534'],
          ['Margen real (abr+)',fCLP(totalRes.margen),'#faf5ff','#6b21a8'],
        ].map(([l,v,bg,col])=>e('div',{key:l,style:{background:bg,borderRadius:8,padding:'10px',textAlign:'center'}},
          e('div',{style:{fontSize:'.68rem',color:col,marginBottom:2,fontWeight:600}},l),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.95rem',color:col}},v)
        ))
      ),
      // Tabla por mes
      e('div',{style:{overflowX:'auto'}},
        e('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:'.74rem'}},
          e('thead',null,e('tr',{style:{borderBottom:'2px solid #e2e8f0'}},
            ...['Mes','Facturado','Gasto','Margen $','Margen %'].map((h,i)=>e('th',{key:h,style:{padding:'6px 6px',textAlign:i===0?'left':'right',color:'#64748b',fontWeight:600}},h))
          )),
          e('tbody',null,
            ...[...resumenMeses].reverse().map(m=>e('tr',{key:m.mes,style:{borderBottom:'1px solid #f1f5f9'}},
              e('td',{style:{padding:'6px 6px',fontWeight:600}},nomMes(m.mes),m.estimado&&e('span',{style:{fontSize:'.6rem',color:'#d97706',marginLeft:3}},'est.')),
              e('td',{style:{padding:'6px 6px',textAlign:'right',fontFamily:'monospace'}},fCLP(m.facturado)),
              e('td',{style:{padding:'6px 6px',textAlign:'right',fontFamily:'monospace',color:'#dc2626'}},m.tieneCosto?fCLP(m.gasto):'—'),
              e('td',{style:{padding:'6px 6px',textAlign:'right',fontFamily:'monospace',fontWeight:600,color:m.tieneCosto?(m.margen>=0?'#059669':'#dc2626'):'#94a3b8'}},m.tieneCosto?fCLP(m.margen):'solo facturación'),
              e('td',{style:{padding:'6px 6px',textAlign:'right',fontFamily:'monospace',fontWeight:700,color:m.tieneCosto?(m.margenPct>=20?'#059669':m.margenPct>=10?'#d97706':'#dc2626'):'#94a3b8'}},m.tieneCosto?m.margenPct.toFixed(1)+'%':'—')
            ))
          )
        )
      )
    ),
    e('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:10}},
      e('button',{onClick:exportHist,style:{padding:'.5rem 1rem',background:'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'📥 Exportar historial')
    ),
    // Barra por mes
    todosMeses.map(m=>{
      const pctTer=m.facturado>0?Math.round(m.terceroMonto/m.facturado*100):0;
      const abierto=mesSel===m.mes;
      return e('div',{key:m.mes,className:'card',style:{marginBottom:8,padding:'12px 14px',cursor:'pointer'},onClick:()=>setMesSel(abierto?'':m.mes)},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
          e('div',null,
            e('div',{style:{fontWeight:700,fontSize:'.95rem'}},nomMes(m.mes)),
            e('div',{style:{fontSize:'.76rem',color:'#94a3b8'}},m.tramos+' tramos · '+pctTer+'% terceros')
          ),
          e('div',{style:{textAlign:'right'}},
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.05rem',color:'#166534'}},fCLP(m.facturado)),
            e('div',{style:{fontSize:'.7rem',color:'#94a3b8'}},abierto?'▲ ocultar':'▼ ver clientes')
          )
        ),
        e('div',{style:{display:'flex',height:8,borderRadius:4,overflow:'hidden',background:'#f1f5f9'}},
          e('div',{style:{width:(m.propioMonto/m.facturado*100)+'%',background:'#8b5cf6'}}),
          e('div',{style:{width:(m.terceroMonto/m.facturado*100)+'%',background:'#f59e0b'}})
        ),
        e('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'.7rem',color:'#94a3b8',marginTop:4}},
          e('span',null,'🏠 Propios '+fCLP(m.propioMonto)),
          e('span',null,'🤝 Terceros '+fCLP(m.terceroMonto))
        ),
        abierto&&m.clientes&&e('div',{style:{marginTop:10,borderTop:'1px solid #f1f5f9',paddingTop:8}},
          e('div',{style:{fontSize:'.72rem',fontWeight:700,color:'#64748b',marginBottom:6}},'CLIENTES DEL MES'),
          ...m.clientes.map((c,i)=>e('div',{key:c.n,style:{display:'flex',justifyContent:'space-between',fontSize:'.78rem',padding:'3px 0',borderBottom:i<m.clientes.length-1?'1px solid #f8fafc':'none'}},
            e('span',{style:{color:'#475569'}},(i+1)+'. '+c.n+' ('+c.tramos+')'),
            e('span',{style:{fontFamily:'monospace',fontWeight:600,color:'#0A1929'}},fCLP(c.monto))
          ))
        )
      );
    })
  );
}

      if(cliente&&t.cliente!==cliente)return false;
      if(desde&&t.fecha_carga<desde)return false;
      if(hasta&&t.fecha_carga>hasta)return false;

    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Reporte');
    XLSX.writeFile(wb,'DITrucks_Reporte_'+(cliente||'todos')+'_'+new Date().toISOString().split('T')[0]+'.xlsx');
  };
  return e('div',{style:{maxWidth:640,margin:'0 auto',paddingBottom:48}},

      e('div',{style:{fontWeight:700,marginBottom:12}},'🔍 Filtros'),

          )
        )
      ),
      e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}},
