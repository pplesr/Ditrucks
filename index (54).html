        e('option',{value:''},'Seleccionar conductor…'),
        ...conductores.map(c=>e('option',{key:c,value:c},c))
      ),
      e('label',{className:'lbl'},'Tramo asignado'),
      e('select',{className:'inp',value:cTramo,onChange:ev=>setCTramo(ev.target.value),style:{cursor:'pointer',marginBottom:8}},
        e('option',{value:''},'Seleccionar tramo…'),
        ...tramosSel.map(t=>e('option',{key:t.id,value:t.id},(t.fecha_carga||'')+' · '+(t.cliente||'')+' · '+(t.origen||'')+'→'+(t.destino||'')+' ('+(t.patente||'')+')'))
      ),
      e('label',{className:'lbl'},'Monto a entregar'),
      e('input',{className:'inp',type:'number',value:cMonto,onChange:ev=>setCMonto(ev.target.value),placeholder:'Ej: 200000',style:{marginBottom:8}}),
      e('label',{className:'lbl'},'Nota (opcional)'),
      e('input',{className:'inp',value:cNota,onChange:ev=>setCNota(ev.target.value),placeholder:'Ej: fondo semana 30'}),
      e('div',{style:{fontSize:'.72rem',color:'#94a3b8',marginTop:8}},'Rebaja el flujo de caja como gasto "Fondo a rendir".'),
      e('button',{onClick:cargar,disabled:guardando,style:{marginTop:12,padding:'.55rem 1.1rem',background:guardando?'#94a3b8':'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:guardando?'wait':'pointer',fontSize:'.84rem',fontFamily:'Geist,sans-serif'}},guardando?'Guardando…':'Entregar fondo')
    ),
    // Sub-pestañas
    e('div',{style:{display:'flex',gap:0,marginBottom:14,borderBottom:'2px solid #f1f5f9'}},
      ...[['saldos','💰 Saldos'],['aprobacion','✅ Aprobación'+(pendientes.length?' ('+pendientes.length+')':'')],['clientes','📁 Por cliente']].map(x=>
        e('button',{key:x[0],onClick:()=>setVista(x[0]),style:{padding:'10px 14px',border:'none',borderBottom:'2px solid',borderBottomColor:vista===x[0]?'#0097A7':'transparent',background:'none',color:vista===x[0]?'#0097A7':'#64748b',fontWeight:vista===x[0]?700:400,cursor:'pointer',fontSize:'.83rem',fontFamily:'Geist,sans-serif'}},x[1]))
    ),
    e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}},
      ...[['Entregado',fCLP(totCargas),'#f0fdf4','#166534'],['Aprobado',fCLP(totAprob),'#fef2f2','#991b1b'],['Pendiente',fCLP(totPend),'#fffbeb','#92400e']].map(x=>
        e('div',{key:x[0],style:{background:x[2],borderRadius:8,padding:'10px',textAlign:'center'}},
          e('div',{style:{fontSize:'.68rem',color:x[3],marginBottom:2,fontWeight:600}},x[0]),
          e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.88rem',color:x[3]}},x[1])
        ))
    ),
    loading?e('div',{style:{textAlign:'center',color:'#94a3b8',padding:20}},'Cargando…'):
    // VISTA SALDOS
    vista==='saldos'?(porConductor.length===0?e('div',{style:{textAlign:'center',color:'#94a3b8',padding:20}},'Sin movimientos de fondo aún'):
      porConductor.map(o=>e('div',{key:o.conductor,className:'card',style:{marginBottom:10}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
          e('div',{style:{fontWeight:700,fontSize:'.9rem',color:'#0A1929'}},'👤 '+o.conductor),
          e('div',{style:{textAlign:'right'}},
            e('div',{style:{fontSize:'.68rem',color:'#94a3b8'}},'saldo disponible'),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'.95rem',color:o.saldo>=0?'#059669':'#dc2626'}},fCLP(o.saldo))
          )
        ),
        e('div',{style:{fontSize:'.72rem',color:'#64748b'}},'Entregado '+fCLP(o.cargas)+' · Aprobado '+fCLP(o.aprob)+(o.pend>0?' · ⏳ Pendiente '+fCLP(o.pend):''))
      ))
    ):
    // VISTA APROBACIÓN
    vista==='aprobacion'?(pendientes.length===0?e('div',{style:{textAlign:'center',color:'#94a3b8',padding:20}},'No hay gastos pendientes de aprobación'):
      pendientes.map(x=>{
        const carga=movs.find(c=>c.id===x.carga_id);
        const t=carga?tramoDe(carga.tramo_id):tramoDe(x.tramo_id);
        return e('div',{key:x.id,className:'card',style:{marginBottom:10,border:'1px solid #fde68a'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:8}},
            e('div',null,
              e('div',{style:{fontWeight:700,fontSize:'.88rem',color:'#0A1929'}},'👤 '+x.conductor+' · '+x.categoria),
              t&&e('div',{style:{fontSize:'.74rem',color:'#64748b'}},'🚛 '+(t.cliente||'')+' · '+(t.origen||'')+'→'+(t.destino||'')),
              e('div',{style:{fontSize:'.72rem',color:'#94a3b8'}},x.fecha+(x.nota?' · '+x.nota:''))
            ),
            e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1rem',color:'#dc2626'}},fCLP(x.monto))
          ),
          e('div',{style:{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}},
            x.foto&&e('button',{onClick:()=>setVerFoto(x.foto),style:{padding:'4px 10px',background:'#eff6ff',color:'#1e40af',border:'none',borderRadius:6,cursor:'pointer',fontSize:'.74rem',fontWeight:600,fontFamily:'Geist,sans-serif'}},'🧾 Boleta'),
            carga&&carga.foto_guia&&e('button',{onClick:()=>setVerFoto(carga.foto_guia),style:{padding:'4px 10px',background:'#f0fdf4',color:'#166534',border:'none',borderRadius:6,cursor:'pointer',fontSize:'.74rem',fontWeight:600,fontFamily:'Geist,sans-serif'}},'📄 Guía'),
            carga&&carga.foto_pesaje&&e('button',{onClick:()=>setVerFoto(carga.foto_pesaje),style:{padding:'4px 10px',background:'#faf5ff',color:'#6b21a8',border:'none',borderRadius:6,cursor:'pointer',fontSize:'.74rem',fontWeight:600,fontFamily:'Geist,sans-serif'}},'⚖️ Pesaje')
          ),
          e('div',{style:{display:'flex',gap:8}},
            e('button',{onClick:()=>aprobar(x),style:{flex:1,padding:'8px',background:'#16a34a',color:'white',border:'none',borderRadius:8,fontWeight:700,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'✓ Aprobado'),
            e('button',{onClick:()=>rechazar(x),style:{padding:'8px 14px',background:'white',color:'#dc2626',border:'1.5px solid #fecaca',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},'✕ Rechazar')
          )
        );
      })
    ):
    // VISTA POR CLIENTE
    (porCliente.length===0?e('div',{style:{textAlign:'center',color:'#94a3b8',padding:20}},'Sin datos por cliente'):
      porCliente.map(o=>e('div',{key:o.cliente,className:'card',style:{marginBottom:10}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},
          e('div',{style:{fontWeight:700,fontSize:'.9rem',color:'#0A1929'}},'🏢 '+o.cliente),
          e('div',{style:{textAlign:'right',fontSize:'.74rem',color:'#64748b'}},'Fondo '+fCLP(o.fondo)+' · Gastado '+fCLP(o.gastado))
        ),
        ...o.cargas.map(c=>{
          const t=tramoDe(c.tramo_id);
          return e('div',{key:c.id,style:{padding:'8px 0',borderTop:'1px solid #f1f5f9'}},
            e('div',{style:{fontSize:'.78rem',color:'#475569',marginBottom:6}},
              t?((t.origen||'')+'→'+(t.destino||'')+' · '+(t.patente||'')+(t.fecha_carga?' · '+t.fecha_carga:'')):('Fondo '+fCLP(c.monto))
            ),
            e('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
              c.foto_guia?e('button',{onClick:()=>setVerFoto(c.foto_guia),style:{padding:'4px 10px',background:'#f0fdf4',color:'#166534',border:'none',borderRadius:6,cursor:'pointer',fontSize:'.74rem',fontWeight:600,fontFamily:'Geist,sans-serif'}},'📄 Guía'):e('span',{style:{fontSize:'.72rem',color:'#cbd5e1'}},'sin guía'),
              c.foto_pesaje?e('button',{onClick:()=>setVerFoto(c.foto_pesaje),style:{padding:'4px 10px',background:'#faf5ff',color:'#6b21a8',border:'none',borderRadius:6,cursor:'pointer',fontSize:'.74rem',fontWeight:600,fontFamily:'Geist,sans-serif'}},'⚖️ Pesaje'):e('span',{style:{fontSize:'.72rem',color:'#cbd5e1'}},'sin pesaje')
            )
          );
        })
      ))
    )
  );
}

// ── FONDO A RENDIR · Vista conductor (celular, entra con su usuario sin clave) ──
function FondoConductor({conductor,onSalir}){
  const [movs,setMovs]=useState([]);
  const [tramosAll,setTramosAll]=useState([]);
  const [cat,setCat]=useState('');
  const [monto,setMonto]=useState('');
  const [nota,setNota]=useState('');
  const [foto,setFoto]=useState('');
  const [procesando,setProcesando]=useState(false);
  const [guardando,setGuardando]=useState(false);
  const [okMsg,setOkMsg]=useState('');
  const [verResumen,setVerResumen]=useState(false);
  const [subiendoDoc,setSubiendoDoc]=useState('');
  const load=async()=>{const all=await apiFondo.get();setMovs(all.filter(x=>(x.conductor||'')===conductor));};
  useEffect(()=>{load();api.get().then(setTramosAll);},[conductor]);
  // Cargas de fondo asignadas a este conductor (cada una ligada a un tramo)
  const cargas=movs.filter(x=>x.tipo==='carga');
  const gastos=movs.filter(x=>x.tipo==='gasto');
  const totCargas=cargas.reduce((a,x)=>a+Number(x.monto||0),0);
  // Solo los gastos APROBADOS rebajan el saldo; los pendientes se muestran aparte
  const gastosAprob=gastos.filter(x=>x.estado==='aprobado').reduce((a,x)=>a+Number(x.monto||0),0);
  const gastosPend=gastos.filter(x=>x.estado!=='aprobado').reduce((a,x)=>a+Number(x.monto||0),0);
  const saldo=totCargas-gastosAprob;
  // Carga de fondo activa (la más reciente con tramo) para asociar los gastos
  const cargaActiva=[...cargas].sort((a,b)=>(b.created_at||0)-(a.created_at||0))[0];
  const tramoActivo=cargaActiva&&cargaActiva.tramo_id?tramosAll.find(t=>t.id===cargaActiva.tramo_id):null;
  const comprimirYset=async(file,setter)=>{
    setProcesando(true);
    try{setter(await comprimirImagen(file));}catch(ex){alert('No se pudo procesar la foto');}
    finally{setProcesando(false);}
  };
  const registrar=async()=>{
    if(guardando)return;
    if(yaEnviado){alert('La rendición de este tramo ya fue enviada. No puedes agregar más gastos.');return;}
    if(!cat){alert('Elige el tipo de gasto');return;}
    if(!monto||Number(monto)<=0){alert('Ingresa el monto');return;}
    if(cat==='Otro'&&!nota.trim()){alert('Para "Otro" el comentario es obligatorio');return;}
    if(!foto){alert('Debes tomar o adjuntar la foto de la boleta');return;}
    setGuardando(true);
    try{
      const r=await apiFondo.add({id:Date.now().toString(),created_at:Date.now(),tipo:'gasto',conductor,categoria:cat,monto:Number(monto)||0,nota:nota||'',foto,fecha:today(),creado_por:conductor,estado:'borrador',tramo_id:cargaActiva?cargaActiva.tramo_id||'':'',carga_id:cargaActiva?cargaActiva.id:''});
      if(!r.ok){alert('No se pudo guardar. Revisa la conexión.');return;}
      setCat('');setMonto('');setNota('');setFoto('');
      setOkMsg('✓ Gasto guardado en borrador');setTimeout(()=>setOkMsg(''),2500);
      await load();
    }finally{setGuardando(false);}
  };
  // Subir foto de guía o pesaje a la carga activa (una vez por tramo)
  const subirDoc=async(campo,file)=>{
    if(!cargaActiva){alert('No tienes un fondo/tramo asignado aún');return;}
    setSubiendoDoc(campo);
    try{
      const img=await comprimirImagen(file);
      const ok=await apiFondo.patch(cargaActiva.id,{[campo]:img});
      if(!ok){alert('No se pudo guardar la foto');return;}
      await load();
    }catch(ex){alert('No se pudo procesar la foto');}
    finally{setSubiendoDoc('');}
  };
  // Gastos en borrador de la carga activa (los que se pueden editar/enviar)
  const gastosBorrador=gastos.filter(x=>x.estado==='borrador'&&(!cargaActiva||x.carga_id===cargaActiva.id));
  // ¿La rendición del tramo activo ya fue enviada? (bloquea edición)
  const yaEnviado=cargaActiva?gastos.some(x=>x.carga_id===cargaActiva.id&&(x.estado==='enviado'||x.estado==='aprobado')):false;
  const tieneFotos=cargaActiva&&cargaActiva.foto_guia&&cargaActiva.foto_pesaje;
  const [enviando,setEnviando]=useState(false);
  const enviarRendicion=async()=>{
    if(enviando)return;
    if(!cargaActiva){alert('No tienes fondo asignado');return;}
    if(!tieneFotos){alert('Debes subir las fotos de guía y pesaje antes de enviar');return;}
    if(gastosBorrador.length===0){alert('No tienes gastos en borrador para enviar');return;}
    if(!confirm('¿Enviar la rendición? Una vez enviada no podrás editar los gastos de este tramo.'))return;
    setEnviando(true);
    try{
      for(const g of gastosBorrador){await apiFondo.patch(g.id,{estado:'enviado'});}
      setOkMsg('✓ Rendición enviada para aprobación');setTimeout(()=>setOkMsg(''),3000);
      await load();setVerResumen(false);
    }finally{setEnviando(false);}
  };
  // Vista RESUMEN (con borrar)
  if(verResumen)return e('div',{style:{maxWidth:480,margin:'0 auto',padding:'16px',paddingBottom:48}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
      e('div',{style:{fontWeight:700,fontSize:'1.05rem',color:'#0A1929'}},'📋 Mi resumen'),
      e('button',{onClick:()=>setVerResumen(false),style:{padding:'.4rem .8rem',background:'#0097A7',color:'white',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.78rem',fontFamily:'Geist,sans-serif'}},'← Volver')
    ),
    e('div',{style:{background:'#f8fafc',borderRadius:10,padding:12,marginBottom:14,fontSize:'.82rem',color:'#475569'}},
      'Recibido: ',e('b',null,fCLP(totCargas)),e('br'),
      'Aprobado: ',e('b',{style:{color:'#dc2626'}},fCLP(gastosAprob)),e('br'),
      'Pendiente: ',e('b',{style:{color:'#d97706'}},fCLP(gastosPend)),e('br'),
      'Saldo: ',e('b',{style:{color:'#059669'}},fCLP(saldo))
    ),
    gastos.length===0?e('div',{style:{textAlign:'center',color:'#94a3b8',padding:16}},'Sin gastos registrados'):
    gastos.slice().sort((a,b)=>(b.created_at||0)-(a.created_at||0)).map(x=>{
      const est=x.estado==='aprobado'?['#dcfce7','#166534','✓ Aprobado']:x.estado==='enviado'?['#dbeafe','#1e40af','📨 Enviado']:['#fef3c7','#92400e','📝 Borrador'];
      return e('div',{key:x.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,padding:'10px 0',borderBottom:'1px solid #f1f5f9'}},
        e('div',{style:{minWidth:0}},
          e('span',{style:{fontWeight:600,fontSize:'.85rem'}},x.categoria),
          e('span',{style:{fontSize:'.7rem',marginLeft:6,padding:'1px 6px',borderRadius:99,fontWeight:700,background:est[0],color:est[1]}},est[2]),
          e('div',{style:{fontSize:'.72rem',color:'#94a3b8'}},x.fecha+(x.nota?' · '+x.nota:''))
        ),
        e('div',{style:{display:'flex',alignItems:'center',gap:8,flexShrink:0}},
          e('span',{style:{fontFamily:'monospace',fontWeight:700,color:'#dc2626'}},'−'+fCLP(x.monto)),
          x.estado==='borrador'&&e('button',{onClick:async()=>{if(!confirm('¿Borrar este gasto?'))return;await apiFondo.del(x.id);load();},style:{background:'none',border:'none',color:'#ef4444',cursor:'pointer',fontSize:'.9rem'}},'🗑️')
        )
      );
    }),
    // Estado de las fotos requeridas para enviar
    cargaActiva&&e('div',{style:{marginTop:14,padding:12,borderRadius:10,background:tieneFotos?'#f0fdf4':'#fffbeb',border:'1px solid '+(tieneFotos?'#bbf7d0':'#fde68a')}},
      e('div',{style:{fontSize:'.78rem',fontWeight:600,color:tieneFotos?'#166534':'#92400e',marginBottom:4}},
        tieneFotos?'✓ Guía y pesaje cargados':'⚠️ Faltan fotos para enviar'),
      !tieneFotos&&e('div',{style:{fontSize:'.74rem',color:'#78350f'}},
        (cargaActiva.foto_guia?'✓':'✗')+' Guía   '+(cargaActiva.foto_pesaje?'✓':'✗')+' Pesaje · Súbelas en la pantalla principal')
    ),
    // Botón enviar para aprobación
    !yaEnviado&&gastosBorrador.length>0&&e('button',{onClick:enviarRendicion,disabled:enviando||!tieneFotos,style:{width:'100%',marginTop:12,padding:'13px',background:(!tieneFotos||enviando)?'#94a3b8':'#0097A7',color:'white',border:'none',borderRadius:10,fontWeight:700,cursor:(!tieneFotos||enviando)?'not-allowed':'pointer',fontSize:'.9rem',fontFamily:'Geist,sans-serif'}},
      enviando?'Enviando…':'📨 Enviar rendición para aprobación ('+gastosBorrador.length+')'),
    yaEnviado&&e('div',{style:{marginTop:12,padding:12,background:'#dbeafe',borderRadius:10,textAlign:'center',fontSize:'.82rem',color:'#1e40af',fontWeight:600}},'📨 Rendición enviada · esperando aprobación')
  );
  // VISTA PRINCIPAL
  return e('div',{style:{maxWidth:480,margin:'0 auto',padding:'16px',paddingBottom:48}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}},
      e('div',null,
        e('div',{style:{fontWeight:700,fontSize:'1.05rem',color:'#0A1929'}},'💵 Mi fondo a rendir'),
        e('div',{style:{fontSize:'.8rem',color:'#64748b'}},'👤 '+conductor)
      ),
      onSalir&&e('button',{onClick:onSalir,style:{padding:'.4rem .8rem',background:'#f1f5f9',color:'#64748b',border:'none',borderRadius:8,fontWeight:600,cursor:'pointer',fontSize:'.78rem',fontFamily:'Geist,sans-serif'}},'Salir')
    ),
    e('div',{style:{background:'linear-gradient(135deg,#0A1929,#0097A7)',borderRadius:14,padding:'18px',marginBottom:16,color:'white'}},
      e('div',{style:{fontSize:'.78rem',opacity:.7,marginBottom:4}},'Saldo disponible'),
      e('div',{style:{fontFamily:'monospace',fontWeight:700,fontSize:'1.8rem'}},fCLP(saldo)),
      e('div',{style:{fontSize:'.72rem',opacity:.7,marginTop:6}},'Recibido '+fCLP(totCargas)+' · Aprobado '+fCLP(gastosAprob)+(gastosPend>0?' · ⏳ Pendiente '+fCLP(gastosPend):''))
    ),
    // Tramo asignado + fotos de guía y pesaje
    cargaActiva?e('div',{className:'card',style:{marginBottom:16,border:'2px solid #bfdbfe'}},
      e('div',{style:{fontWeight:700,fontSize:'.85rem',color:'#1e40af',marginBottom:6}},'🚛 Tramo asignado'),
      tramoActivo?e('div',{style:{fontSize:'.82rem',color:'#0A1929',marginBottom:10}},
        e('b',null,tramoActivo.cliente||''),e('br'),
        (tramoActivo.origen||'')+' → '+(tramoActivo.destino||''),
        tramoActivo.fecha_carga?e('div',{style:{fontSize:'.72rem',color:'#94a3b8'}},'Carga: '+tramoActivo.fecha_carga):null
      ):e('div',{style:{fontSize:'.8rem',color:'#94a3b8',marginBottom:10}},'Fondo recibido: '+fCLP(cargaActiva.monto)),
      e('div',{style:{display:'flex',gap:10}},
        ...[['foto_guia','📄 Guía'],['foto_pesaje','⚖️ Pesaje']].map(([campo,lbl])=>
          e('div',{key:campo,style:{flex:1}},
            cargaActiva[campo]?e('div',{style:{position:'relative'}},
              e('img',{src:cargaActiva[campo],style:{width:'100%',height:90,objectFit:'cover',borderRadius:8}}),
              e('div',{style:{position:'absolute',bottom:4,left:4,background:'rgba(22,101,52,.9)',color:'white',fontSize:'.62rem',padding:'1px 6px',borderRadius:4,fontWeight:700}},'✓ '+lbl)
            ):e('label',{style:{display:'block',padding:'16px 6px',border:'2px dashed #cbd5e1',borderRadius:8,textAlign:'center',cursor:'pointer',color:'#64748b',fontSize:'.76rem'}},
              subiendoDoc===campo?'⏳…':lbl,
              e('input',{type:'file',accept:'image/*',capture:'environment',onChange:ev=>{const f=ev.target.files&&ev.target.files[0];if(f)subirDoc(campo,f);},style:{display:'none'}})
            )
          )
        )
      )
    ):e('div',{style:{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:10,padding:12,marginBottom:16,fontSize:'.82rem',color:'#92400e'}},'Aún no tienes un fondo asignado. Rodolfo o Alejandro deben entregarte el fondo con su tramo.'),
    okMsg&&e('div',{style:{background:'#dcfce7',color:'#166534',padding:'10px',borderRadius:8,textAlign:'center',fontWeight:600,marginBottom:12,fontSize:'.85rem'}},okMsg),
    // Formulario de gasto (bloqueado si la rendición ya fue enviada)
    yaEnviado?e('div',{className:'card',style:{marginBottom:12,textAlign:'center',padding:'20px'}},
      e('div',{style:{fontSize:'.9rem',fontWeight:700,color:'#1e40af',marginBottom:4}},'📨 Rendición enviada'),
      e('div',{style:{fontSize:'.8rem',color:'#64748b'}},'Los gastos de este tramo están esperando aprobación. No puedes agregar ni editar.')
    ):e('div',{className:'card',style:{marginBottom:12}},
      e('div',{style:{fontWeight:700,fontSize:'.9rem',color:'#0A1929',marginBottom:12}},'➕ Registrar gasto'),
      e('label',{className:'lbl'},'Tipo de gasto'),
      e('div',{style:{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}},
        ...CATEGORIAS_FONDO.map(c=>e('button',{key:c,onClick:()=>setCat(c),style:{flex:1,minWidth:80,padding:'10px',borderRadius:8,border:'2px solid '+(cat===c?'#0097A7':'#e2e8f0'),background:cat===c?'#e0f7fa':'white',color:cat===c?'#0097A7':'#64748b',fontWeight:700,cursor:'pointer',fontSize:'.82rem',fontFamily:'Geist,sans-serif'}},
          (c==='Peaje'?'🛣️ ':c==='AdBlue'?'🧪 ':'📌 ')+c))
      ),
      e('label',{className:'lbl'},'Monto'),
      e('input',{className:'inp',type:'number',inputMode:'numeric',value:monto,onChange:ev=>setMonto(ev.target.value),placeholder:'$',style:{marginBottom:12,fontSize:'1.1rem'}}),
      e('label',{className:'lbl'},cat==='Otro'?'Comentario (obligatorio)':'Nota (opcional)'),
      e('input',{className:'inp',value:nota,onChange:ev=>setNota(ev.target.value),placeholder:cat==='Otro'?'Describe el gasto':'Ej: peaje Angostura',style:{marginBottom:12,borderColor:cat==='Otro'&&!nota.trim()?'#fca5a5':undefined}}),
      e('label',{className:'lbl'},'📷 Foto de la boleta (obligatoria)'),
      e('div',{style:{marginBottom:12}},
        foto?e('div',{style:{position:'relative'}},
          e('img',{src:foto,style:{width:'100%',borderRadius:8,maxHeight:200,objectFit:'cover'}}),
          e('button',{onClick:()=>setFoto(''),style:{position:'absolute',top:6,right:6,background:'rgba(0,0,0,.6)',color:'white',border:'none',borderRadius:6,padding:'2px 8px',cursor:'pointer',fontSize:'.75rem'}},'✕ Quitar')
        ):e('label',{style:{display:'block',padding:'20px',border:'2px dashed #cbd5e1',borderRadius:10,textAlign:'center',cursor:'pointer',color:'#64748b',fontSize:'.85rem'}},
          procesando?'⏳ Procesando…':'📷 Tomar foto / adjuntar',
          e('input',{type:'file',accept:'image/*',capture:'environment',onChange:ev=>{const f=ev.target.files&&ev.target.files[0];if(f)comprimirYset(f,setFoto);},style:{display:'none'}})
        )
      ),
      e('button',{onClick:registrar,disabled:guardando||procesando,style:{width:'100%',padding:'12px',background:guardando?'#94a3b8':'#16a34a',color:'white',border:'none',borderRadius:10,fontWeight:700,cursor:guardando?'wait':'pointer',fontSize:'.9rem',fontFamily:'Geist,sans-serif'}},guardando?'Guardando…':'Registrar gasto')
    ),
    e('button',{onClick:()=>setVerResumen(true),style:{width:'100%',padding:'12px',background:'white',color:'#0097A7',border:'2px solid #b2ebf2',borderRadius:10,fontWeight:700,cursor:'pointer',fontSize:'.88rem',fontFamily:'Geist,sans-serif'}},'📋 Ver resumen ('+gastos.length+')')
  );
}

// ── APP ──
function App(){
  const [user,setUser]=useState(null);
  const [condMode,setCondMode]=useState(null);
  const [tab,setTab]=useState('tramos');
  const [tramos,setTramos]=useState([]);
  const isOwner=user?.rol==='owner';
  useEffect(()=>{if(user)api.get().then(setTramos);},[user]);
  const [asignVer,setAsignVer]=useState(0);
  useEffect(()=>{
    if(!user)return;
    api.getAsign().then(rows=>{
      if(!Array.isArray(rows)||rows.length===0)return;
      // Se aplican de más antigua a más reciente: la última asignación manda
      [...rows].sort((a,b)=>(a.created_at||0)-(b.created_at||0)).forEach(r=>{
        if(r.patente)ASIGN[r.patente]={conductor:r.conductor||'',acoplado:r.acoplado==null?'':r.acoplado};
      });
      guardarAsignLocal();setAsignVer(v=>v+1);
    });
  },[user]);
  const reload=()=>api.get().then(setTramos);
  if(condMode)return e(FondoConductor,{conductor:condMode,onSalir:()=>setCondMode(null)});
  if(!user)return e(Login,{onLogin:setUser,onConductor:setCondMode});
  const isLimitado=user?.rol==='limitado';
  // Pestañas extra visibles aunque el usuario sea limitado
  const verAnalisis=!isLimitado||user?.email==='atroncoso@ditrucks.cl';
  const tabs=[
    {id:'nuevo',l:'➕ Nuevo'},
    {id:'tramos',l:'📋 Tramos'},
    ...(verAnalisis?[{id:'eficiencia',l:'📊 Eficiencia'}]:[]),
    ...(verAnalisis?[{id:'ranking',l:'🏆 Ranking'}]:[]),
    ...(!isLimitado?[{id:'control',l:'📉 Control'}]:[]),
    ...(verAnalisis?[{id:'combustible',l:'⛽ Combustible'}]:[]),
    {id:'disponibilidad',l:'📍 Disponibilidad'},
    ...(!isLimitado?[{id:'reportes',l:'📁 Reportes'}]:[]),
    {id:'admin',l:'🧾 Facturación'},
    ...(!isLimitado?[{id:'flujo',l:'💰 Flujo de Caja'}]:[]),
    {id:'fondo',l:'💵 Fondo a Rendir'},
  ];
  return e('div',{style:{minHeight:'100vh'}},
    e('div',{style:{background:'linear-gradient(135deg,#0A1929,#1E293B)',color:'white',padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:10}},
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:24}},'🚛'),
        e('span',{style:{fontWeight:700,fontSize:'1.1rem',letterSpacing:-.5}},'DITrucks')
      ),
      e('div',{style:{display:'flex',alignItems:'center',gap:10}},
        e('span',{style:{fontSize:'.82rem',color:'rgba(255,255,255,.6)'}},'👤 '+user.nombre),
        e('button',{onClick:()=>setUser(null),style:{background:'rgba(255,255,255,.1)',border:'none',color:'white',padding:'4px 10px',borderRadius:6,cursor:'pointer',fontSize:'.8rem',fontFamily:'Geist,sans-serif'}},'Salir')
      )
    ),
    e('div',{style:{overflowX:'auto',background:'white',borderBottom:'1px solid #e2e8f0',display:'flex',gap:0}},
      tabs.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{padding:'10px 14px',border:'none',borderBottom:'2px solid',borderBottomColor:tab===t.id?'#00BCD4':'transparent',background:'none',color:tab===t.id?'#0097A7':'#64748b',fontWeight:tab===t.id?600:400,cursor:'pointer',fontSize:'.82rem',whiteSpace:'nowrap',fontFamily:'Geist,sans-serif',transition:'all .15s'}},t.l))
    ),
    e('div',{style:{padding:'16px',maxWidth:700,margin:'0 auto'}},
      tab==='nuevo'&&e(NuevoTramo,{user,tramos,onSaved:reload}),
      tab==='tramos'&&e(ListaTramos,{user,isOwner}),
      tab==='eficiencia'&&e(Eficiencia),
      tab==='ranking'&&e(Ranking),
      tab==='control'&&e(Control),
      tab==='combustible'&&e(Combustible),
      tab==='disponibilidad'&&e(Disponibilidad,{tramos,recargar:reload}),
      tab==='reportes'&&e(ReportesWrapper),
      tab==='admin'&&e(Reportes,{user}),
      tab==='flujo'&&e(FlujoCaja,{user}),
      tab==='fondo'&&e(FondoRendir,{user})
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
